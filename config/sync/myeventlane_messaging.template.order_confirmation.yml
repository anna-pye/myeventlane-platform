enabled: true
subject: '{% if (is_paid ?? true) %}{% if event_name %}Your booking is confirmed – {{ event_name }}{% else %}Booking confirmed – MyEventLane{% endif %}{% else %}Booking received – payment pending{% endif %}'
preheader: '{% if (is_paid ?? true) %}Booking confirmed{% else %}Booking received – payment pending{% endif %}{% if order_number %} · #{{ order_number }}{% endif %}'
body_html: |
  {# ACE Phase 2 — Booking confirmation email (inner content for mel-email-base). #}
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
    <tr>
      <td style="padding:0 0 24px 0;text-align:left;">
        {% if (is_paid ?? true) %}
          <h1 style="margin:0 0 8px 0;font-size:24px;line-height:1.25;font-weight:800;color:#293241;">Booking confirmed</h1>
          <p style="margin:0 0 12px 0;font-size:16px;line-height:1.55;color:#5c6370;">
            Hi {{ first_name }}, your booking is confirmed. Keep this email as your reference before the event.
          </p>
        {% else %}
          <h1 style="margin:0 0 8px 0;font-size:24px;line-height:1.25;font-weight:800;color:#293241;">Booking received</h1>
          <p style="margin:0 0 12px 0;font-size:16px;line-height:1.55;color:#5c6370;">
            Hi {{ first_name }}, we’ve received your booking and are waiting for payment confirmation. We’ll email you once payment has been confirmed.
          </p>
        {% endif %}
        {% if order_number %}
          <p style="margin:0;font-size:15px;line-height:1.5;color:#293241;">
            <strong style="font-size:18px;font-weight:700;letter-spacing:0.02em;">Booking #{{ order_number }}</strong>
          </p>
        {% endif %}
      </td>
    </tr>

    {% if events|length > 0 %}
      {% for event in events %}
        <tr>
          <td style="padding:0 0 24px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#fef5ec;border-radius:12px;">
              {% if event.image_url %}
                <tr>
                  <td style="padding:0;border-radius:12px 12px 0 0;overflow:hidden;">
                    <img src="{{ event.image_url }}" alt="{{ event.image_alt|default(event.title)|e('html_attr') }}" width="552" style="display:block;width:100%;max-width:552px;height:auto;border:0;outline:none;border-radius:12px 12px 0 0;" />
                  </td>
                </tr>
              {% endif %}
              <tr>
                <td style="padding:20px 20px 8px 20px;">
                  <h2 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;font-weight:700;color:#293241;">{{ event.title }}</h2>
                  {% if event.start_date %}
                    <p style="margin:0 0 6px 0;font-size:15px;line-height:1.45;color:#293241;">
                      <strong>Date</strong><br>{{ event.start_date }}{% if event.end_date and event.end_date != event.start_date %} – {{ event.end_date }}{% endif %}
                    </p>
                  {% endif %}
                  {% if event.start_time %}
                    <p style="margin:0 0 6px 0;font-size:15px;line-height:1.45;color:#293241;">
                      <strong>Time</strong><br>{{ event.start_time }}{% if event.end_time %} – {{ event.end_time }}{% endif %}
                    </p>
                  {% endif %}
                  {% if event.venue_name or event.location %}
                    <p style="margin:0 0 6px 0;font-size:15px;line-height:1.45;color:#293241;">
                      <strong>Venue</strong><br>
                      {% if event.venue_name %}{{ event.venue_name }}{% endif %}
                      {% if event.venue_name and event.location %}<br>{% endif %}
                      {% if event.location %}<span style="color:#5c6370;">{{ event.location }}</span>{% endif %}
                    </p>
                  {% endif %}
                  {% if event.organiser_name %}
                    <p style="margin:0 0 6px 0;font-size:15px;line-height:1.45;color:#293241;">
                      <strong>Organiser</strong><br>{{ event.organiser_name }}
                    </p>
                  {% elseif organiser_name %}
                    <p style="margin:0 0 6px 0;font-size:15px;line-height:1.45;color:#293241;">
                      <strong>Organiser</strong><br>{{ organiser_name }}
                    </p>
                  {% endif %}
                </td>
              </tr>
            </table>
          </td>
        </tr>
      {% endfor %}
    {% endif %}

    {% if ticket_items|length > 0 %}
      <tr>
        <td style="padding:0 0 8px 0;">
          <h2 style="margin:0 0 12px 0;font-size:18px;line-height:1.35;font-weight:700;color:#293241;">Ticket summary</h2>
        </td>
      </tr>
      {% for item in ticket_items %}
        <tr>
          <td style="padding:0 0 10px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#f7f7f8;border-radius:8px;">
              <tr>
                <td style="padding:14px 16px;font-size:15px;line-height:1.45;color:#293241;">
                  <strong style="display:block;margin-bottom:4px;">{{ item.title }}</strong>
                  Quantity: {{ item.quantity }}
                  {% if item.attendees|length > 0 %}
                    <br><span style="color:#5c6370;font-size:14px;">Attendees:
                    {% for attendee in item.attendees %}{{ attendee.name }}{% if not loop.last %}, {% endif %}{% endfor %}</span>
                  {% endif %}
                </td>
                <td align="right" valign="top" style="padding:14px 16px;font-size:15px;font-weight:700;color:#293241;white-space:nowrap;">
                  {{ item.price }}
                </td>
              </tr>
            </table>
          </td>
        </tr>
      {% endfor %}
    {% endif %}

    {% if tickets_need_assignment %}
      <tr>
        <td style="padding:8px 0 16px 0;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#fff8e6;border-left:4px solid #f0ad4e;border-radius:4px;">
            <tr>
              <td style="padding:14px 16px;font-size:15px;line-height:1.5;color:#5c4a00;">
                <strong>Assign your tickets</strong> to receive them by email with your PDF and QR code.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    {% endif %}

    {% if donation_total %}
      <tr>
        <td style="padding:8px 0 16px 0;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#fff8e6;border-radius:8px;">
            <tr>
              <td style="padding:14px 16px;font-size:15px;line-height:1.5;color:#5c4a00;">
                <strong>Your donation:</strong> {{ donation_total }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    {% endif %}

    {% if (is_paid ?? true) and organiser_name %}
      <tr>
        <td style="padding:0 0 20px 0;font-size:14px;line-height:1.5;color:#5c6370;">
          <strong>Seller:</strong> {{ organiser_name }}. Your ticket payment was processed through the organiser's connected Stripe account. MyEventLane provides the marketplace and booking workflow.
        </td>
      </tr>
    {% endif %}

    <tr>
      <td style="padding:8px 0 24px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background-color:#f7f7f8;border-radius:8px;">
          <tr>
            <td style="padding:16px;font-size:16px;font-weight:700;color:#293241;">Booking total</td>
            <td align="right" style="padding:16px;font-size:18px;font-weight:800;color:#293241;">{{ booking_total|default(total_paid) }}</td>
          </tr>
          {% if show_includes_gst_note|default(false) %}
            <tr>
              <td colspan="2" style="padding:0 16px 14px 16px;font-size:13px;color:#5c6370;">All prices include GST where applicable.</td>
            </tr>
          {% endif %}
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding:0 0 24px 0;text-align:center;">
        {% set pass_url = digital_pass_url|default(order_url) %}
        {% if not (is_guest ?? false) and pass_url %}
          <!--[if mso]>
          <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ pass_url }}" style="height:48px;v-text-anchor:middle;width:260px;" arcsize="12%" stroke="f" fillcolor="#f26d5b">
            <w:anchorlock/>
            <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">View Digital Pass</center>
          </v:roundrect>
          <![endif]-->
          <!--[if !mso]><!-- -->
          <a href="{{ pass_url }}" style="display:inline-block;background-color:#f26d5b;color:#ffffff !important;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:700;font-size:16px;line-height:1.25;mso-hide:all;">View Digital Pass</a>
          <!--<![endif]-->
          {% if apple_wallet_url or google_wallet_url or pdf_url %}
            <div style="margin-top:20px;" role="group" aria-label="Pass actions">
              {% if apple_wallet_url and apple_wallet_badge_url %}
                <a href="{{ apple_wallet_url }}" style="display:inline-block;margin:8px;text-decoration:none;line-height:0;vertical-align:middle;" aria-label="Add to Apple Wallet">
                  <img src="{{ apple_wallet_badge_url }}" alt="Add to Apple Wallet" width="156" height="48" style="display:block;width:156px;height:48px;border:0;outline:none;">
                </a>
              {% endif %}
              {% if google_wallet_url and google_wallet_badge_url %}
                <a href="{{ google_wallet_url }}" style="display:inline-block;margin:8px;text-decoration:none;line-height:0;vertical-align:middle;" aria-label="Add to Google Wallet">
                  <img src="{{ google_wallet_badge_url }}" alt="Add to Google Wallet" width="272" height="48" style="display:block;width:272px;height:48px;border:0;outline:none;">
                </a>
              {% endif %}
              {% if pdf_url %}
                <a href="{{ pdf_url }}" style="display:inline-block;margin:6px 8px;background-color:#6b46ff;color:#ffffff !important;text-decoration:none;padding:14px 20px;border-radius:8px;font-weight:700;font-size:14px;line-height:1.25;vertical-align:middle;" aria-label="Download PDF">Download PDF</a>
              {% endif %}
            </div>
          {% endif %}
          <div style="margin-top:16px;font-size:15px;line-height:1.7;">
            {% if event_url %}
              <a href="{{ event_url }}" style="color:#6e7ef2;font-weight:600;text-decoration:underline;">View Event</a>
              {% if manage_booking_url %}<span style="color:#c5c7ce;"> · </span>{% endif %}
            {% endif %}
            {% if manage_booking_url %}
              <a href="{{ manage_booking_url }}" style="color:#6e7ef2;font-weight:600;text-decoration:underline;">Manage Booking</a>
            {% endif %}
          </div>
        {% elseif event_url %}
          <!--[if mso]>
          <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ event_url }}" style="height:48px;v-text-anchor:middle;width:240px;" arcsize="12%" stroke="f" fillcolor="#f26d5b">
            <w:anchorlock/>
            <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">View Event</center>
          </v:roundrect>
          <![endif]-->
          <!--[if !mso]><!-- -->
          <a href="{{ event_url }}" style="display:inline-block;background-color:#f26d5b;color:#ffffff !important;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:700;font-size:16px;line-height:1.25;mso-hide:all;">View Event</a>
          <!--<![endif]-->
        {% endif %}
        {% if (is_guest ?? false) %}
          <p style="margin:14px 0 0 0;font-size:14px;line-height:1.5;color:#5c6370;">Check your inbox for ticket PDFs, calendar files, and this booking number — you can open them anytime without signing in.</p>
        {% endif %}
      </td>
    </tr>

    <tr>
      <td style="padding:0 0 24px 0;">
        <h2 style="margin:0 0 10px 0;font-size:18px;line-height:1.35;font-weight:700;color:#293241;">What happens next?</h2>
        <ul style="margin:0;padding:0 0 0 20px;color:#5c6370;font-size:15px;line-height:1.55;">
          {% if (is_paid ?? true) %}
            <li style="margin:0 0 6px 0;">We'll email you if important event details change.</li>
            {% if (is_guest ?? false) %}
              <li style="margin:0 0 6px 0;">Keep this confirmation handy. Sign in later to find tickets under My Bookings, or use the links in your email.</li>
            {% else %}
              <li style="margin:0 0 6px 0;">You'll find your booking in My Bookings.</li>
            {% endif %}
            <li style="margin:0;">We'll remind you before your event.</li>
          {% else %}
            <li style="margin:0 0 6px 0;">We'll confirm your booking by email once payment is received.</li>
            <li style="margin:0 0 6px 0;">We'll email you if important event details change.</li>
            <li style="margin:0;">We'll remind you before your event after payment is confirmed.</li>
          {% endif %}
        </ul>
      </td>
    </tr>

    <tr>
      <td style="padding:0 0 8px 0;border-top:1px solid #e8e8e8;">
        <h2 style="margin:20px 0 10px 0;font-size:18px;line-height:1.35;font-weight:700;color:#293241;">Need help?</h2>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#5c6370;">
          {% if refund_policy_url %}
            <a href="{{ refund_policy_url }}" style="color:#6e7ef2;text-decoration:underline;">Refund policy</a><br>
          {% endif %}
          {% if help_centre_url %}
            <a href="{{ help_centre_url }}" style="color:#6e7ef2;text-decoration:underline;">Help Centre</a><br>
          {% endif %}
          {% set contact_url = organiser_url|default('') %}
          {% if not contact_url and events|length > 0 and events[0].organiser_url|default('') %}
            {% set contact_url = events[0].organiser_url %}
          {% endif %}
          {% if contact_url %}
            <a href="{{ contact_url }}" style="color:#6e7ef2;text-decoration:underline;">Contact organiser</a><br>
          {% endif %}
          {% if support_url %}
            <a href="{{ support_url }}" style="color:#6e7ef2;text-decoration:underline;">Support</a>
          {% endif %}
        </p>
      </td>
    </tr>

    <tr>
      <td style="padding:16px 0 0 0;font-size:12px;line-height:1.5;color:#5c6370;">
        This email was sent to {{ order_email }}.
      </td>
    </tr>
  </table>
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: transactional
    utm_campaign: order_confirmation
