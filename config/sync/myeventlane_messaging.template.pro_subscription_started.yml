enabled: true
subject: '{% if trial_applies %}Your MyEventLane Pro trial has started{% else %}Your MyEventLane Pro subscription has started{% endif %}'
preheader: '{% if trial_applies %}{{ trial_days }} days free, then {{ monthly_price }} per month.{% else %}Your organiser subscription is now active at {{ monthly_price }} per month.{% endif %}'
body_html: |
  <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:600px;margin:0 auto;background:#fff7ee;padding:20px;">
    <div style="background:#ffffff;border-radius:16px;padding:30px;">
      <h1 style="color:#293241;font-size:28px;margin:0 0 24px;">MyEventLane Pro is ready</h1>
      <p style="color:#293241;font-size:16px;line-height:1.6;">Hi {{ first_name|default('there') }},</p>
      <p style="color:#293241;font-size:16px;line-height:1.6;">Your MyEventLane Pro organiser subscription has started.</p>
      <div style="background:#f9f8ff;border:1px solid #dedfff;border-radius:12px;padding:20px;margin:24px 0;">
        {% if trial_applies %}<p style="margin:0 0 10px;color:#293241;"><strong>Free period:</strong> {{ trial_days }} days</p>{% endif %}
        <p style="margin:0 0 10px;color:#293241;"><strong>Charged today:</strong> {{ charged_today }}</p>
        <p style="margin:0 0 10px;color:#293241;"><strong>{% if trial_applies %}After the trial{% else %}Ongoing payment{% endif %}:</strong> {{ monthly_price }} per month</p>
        <p style="margin:0;color:#293241;"><strong>Renewal:</strong> Monthly until cancelled</p>
      </div>
      <p style="color:#293241;font-size:15px;line-height:1.6;">{% if trial_applies %}Your saved card will be charged after the free trial unless you cancel beforehand. {% endif %}You can manage billing, download invoices and receipts, update your card, or schedule cancellation from your Pro account.</p>
      <p style="text-align:center;margin:28px 0;"><a href="{{ pro_manage_url }}" style="display:inline-block;padding:13px 24px;border-radius:12px;background:#6b46ff;color:#ffffff;text-decoration:none;font-weight:700;">Manage MyEventLane Pro</a></p>
      <p style="color:#5b6670;font-size:13px;line-height:1.5;">Order #{{ order_number }} · Sent to {{ order_email }}</p>
      <p style="color:#5b6670;font-size:13px;"><a href="{{ support_url }}" style="color:#5935e8;">Contact MyEventLane support</a></p>
    </div>
  </div>
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: transactional
    utm_campaign: pro_subscription_started
