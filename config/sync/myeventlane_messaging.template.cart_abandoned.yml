enabled: true
subject: 'Still interested? Your cart is waiting'
body: |
  <p>Hi {{ first_name }}, your tickets are still in your cart on MyEventLane whenever you're ready.</p>
  <p><a href="{{ cart_url }}" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#6b46ff;color:#fff;text-decoration:none;font-weight:700;">Return to cart</a></p>
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: cart
    utm_campaign: abandoned
