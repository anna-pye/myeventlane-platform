enabled: true
subject: 'Refund request pending – {{ event_title }}'
body_html: |-
  A customer has requested a refund for <strong>{{ event_title }}</strong>.

  Order: {{ order_number }}
  Amount: {{ refunded_amount }}

  You remain responsible for the refund decision for your event, subject to applicable law. If you approve it, the refunded money comes from your connected Stripe account.

  Please review and approve or reject this request in your vendor dashboard.
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: transactional
    utm_campaign: refund_refund_requested_vendor
