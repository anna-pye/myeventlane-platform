enabled: true
subject: 'Finish setting up MyEventLane Pro'
preheader: 'Return to your secure Pro checkout when you are ready.'
body_html: '<p style="font-size:16px;color:#1a1a2e;">Hi {{ first_name }},</p><p style="font-size:15px;color:#444;">You started setting up MyEventLane Pro but did not finish. Your organiser checkout is ready when you are.</p>{% if trial_days > 0 %}<p style="font-size:15px;color:#444;">Pro includes a {{ trial_days }}-day free period, then {{ monthly_price }} per month until cancelled. Your card is not charged until you confirm the secure checkout.</p>{% else %}<p style="font-size:15px;color:#444;">Pro restarts at {{ monthly_price }} per month from checkout confirmation. There is no new trial period.</p>{% endif %}<p style="text-align:center;margin:28px 0;"><a href="{{ cart_url }}" style="display:inline-block;padding:14px 28px;border-radius:12px;background:#6b46ff;color:#fff;text-decoration:none;font-weight:700;font-size:15px;">Return to Pro checkout</a></p><p style="font-size:14px;color:#888;">If you have any questions, just reply to this email.</p>'
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: cart
    utm_campaign: pro_abandoned_w1
