enabled: '1'
subject: 'Sales are now open: {{ event_title }}'
body_html: |
  <p>Great news! Ticket sales for <strong>{{ event_title }}</strong> are now open.</p>
  {% if sales_start %}
  <p>Sales opened at <strong>{{ sales_start }}</strong>.</p>
  {% endif %}
  <p><a href="{{ event_url }}" style="display:inline-block;padding:12px 18px;border-radius:12px;background:#6b46ff;color:#ffffff;text-decoration:none;font-weight:700;">View Event & Buy Tickets</a></p>
  <p>Good luck with your event!</p>
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: notification
    utm_campaign: sales_open
