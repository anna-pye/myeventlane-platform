# myeventlane_commerce.routing.yml
myeventlane_commerce.event_book:
  path: '/event/{node}/book'
  defaults:
    _controller: '\Drupal\myeventlane_commerce\Controller\BookController::book'
    _title: 'Book tickets'
  requirements:
    _permission: 'access content'
    _event_book_access: 'TRUE'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_commerce.event_ticket_waitlist_claim:
  path: '/event/{node}/book/waitlist/{token}'
  defaults:
    _controller: 'myeventlane_commerce.controller.ticket_waitlist_claim:claim'
    _title: 'Waitlist offer'
  requirements:
    _permission: 'access content'
    node: '\d+'
    token: '.+'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_commerce.attendee_info.edit:
  path: '/cart/attendee-info/{order_item}'
  defaults:
    _controller: '\Drupal\myeventlane_commerce\Controller\AttendeeInfoController::edit'
    _title: 'Edit Ticket Info'
  requirements:
    _permission: 'access checkout'

myeventlane_commerce.attendee:
  path: '/attendee'
  defaults:
    _title: 'Attendee'
    _controller: '\Drupal\myeventlane_commerce\Controller\AttendeeInfoController::build'
  requirements:
    _permission: 'access content'

myeventlane_commerce.ticket_bundle_remove:
  path: '/cart/{commerce_order}/ticket-bundle/{bundle_instance}/remove'
  defaults:
    _form: '\Drupal\myeventlane_commerce\Form\RemoveTicketBundleForm'
    _title: 'Remove ticket bundle'
  requirements:
    _permission: 'access checkout'
    commerce_order: '\d+'
    bundle_instance: '[A-Za-z0-9-]+'
  options:
    parameters:
      commerce_order:
        type: entity:commerce_order
