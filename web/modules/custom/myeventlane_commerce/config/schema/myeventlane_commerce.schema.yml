# Schema for MyEventLane Commerce module configuration.
# This file defines the structure of config objects used by this module.

myeventlane_commerce.operational_stock:
  type: config_object
  label: 'MyEventLane operational add-on stock settings'
  mapping:
    paid_stock_enabled:
      type: boolean
      label: 'Use payment-confirmed, organiser-scoped stock'
    hold_ttl:
      type: integer
      label: 'Cart hold lifetime in seconds'
