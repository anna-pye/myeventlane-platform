services:
  # Lazy proxy for currency formatter to break circular dependency with serializer.
  # @see \Drupal\myeventlane_commerce\MyeventlaneCommerceServiceProvider
  myeventlane_commerce.currency_formatter.lazy:
    class: Drupal\myeventlane_commerce\Service\LazyCurrencyFormatter
    arguments:
      - !service_closure '@commerce_price.currency_formatter'

  # Logger channel for commerce module.
  logger.channel.myeventlane_commerce:
    parent: logger.channel_base
    arguments: ['myeventlane_commerce']

  myeventlane_commerce.order_item_classifier:
    class: Drupal\myeventlane_commerce\Service\OrderItemClassifier

  myeventlane_commerce.filter_payment_gateways_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\FilterPaymentGatewaysSubscriber
    arguments:
      - '@myeventlane_commerce.order_item_classifier'
      - '@current_user'
      - '@logger.channel.myeventlane_commerce'
      - '@config.factory'
      - '@myeventlane_commerce.stripe_connect_payment'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.ticket_backed_order_item_classifier:
    class: Drupal\myeventlane_commerce\Service\TicketBackedOrderItemClassifier
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_commerce.order_item_classifier'
      - '@logger.channel.myeventlane_commerce'

  myeventlane_commerce.paragraph_question_mapper:
    class: Drupal\myeventlane_commerce\Service\ParagraphQuestionMapper

  myeventlane_commerce.order_lock_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\LockAttendeeOnOrderPlaced
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.field_attendee_data_write_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\FieldAttendeeDataWriteSubscriber
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.order_completed_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\OrderCompletedSubscriber
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.stripe_connect_payment:
    class: Drupal\myeventlane_commerce\Service\StripeConnectPaymentService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_core.stripe'
      - '@config.factory'
      - '@logger.channel.myeventlane_commerce'
      - '@myeventlane_commerce.order_item_classifier'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'

  myeventlane_commerce.direct_charge_operational_event_handler:
    class: Drupal\myeventlane_commerce\Service\DirectChargeOperationalEventHandler
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_messaging.manager'
      - '@logger.channel.myeventlane_commerce'
      - '@myeventlane_core.domain_detector'

  myeventlane_commerce.platform_fee_order_processor:
    class: Drupal\myeventlane_commerce\OrderProcessor\PlatformFeeOrderProcessor
    arguments:
      - '@config.factory'
      - '@commerce_price.rounder'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'
      - '@myeventlane_core.platform_fee_settings'
    tags:
      - { name: commerce_order.order_processor, priority: 55 }

  myeventlane_commerce.platform_fee_order_presave_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\PlatformFeeOrderPresaveSubscriber
    arguments:
      - '@commerce_order.order_refresh'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.ticket_variation_sold:
    class: Drupal\myeventlane_commerce\Service\TicketVariationSoldService
    arguments:
      - '@entity_type.manager'

  myeventlane_commerce.ticket_booking_session:
    class: Drupal\myeventlane_commerce\Service\TicketBookingSessionService
    arguments:
      - '@request_stack'
      - '@session_manager'

  myeventlane_commerce.ticket_access_code:
    class: Drupal\myeventlane_commerce\Service\TicketAccessCodeService
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@datetime.time'
      - '@myeventlane_commerce.ticket_booking_session'

  myeventlane_commerce.ticket_tier_access:
    class: Drupal\myeventlane_commerce\Service\TicketTierAccessService

  myeventlane_commerce.ticket_group_eligibility:
    class: Drupal\myeventlane_commerce\Service\TicketGroupEligibilityService
    arguments:
      - '@entity_type.manager'

  myeventlane_commerce.ticket_capacity:
    class: Drupal\myeventlane_commerce\Service\TicketCapacityService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@myeventlane_commerce.ticket_variation_sold'
      - '@datetime.time'

  myeventlane_commerce.ticket_tier_waitlist:
    class: Drupal\myeventlane_commerce\Service\TicketTierWaitlistService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'
      - '@logger.factory'
      - '@myeventlane_commerce.ticket_variation_sold'
      - '@queue'
      - '@myeventlane_commerce.ticket_capacity'
      - '@lock'
      - '@myeventlane_commerce.ticket_booking_session'
      - '@string_translation'

  myeventlane_commerce.ticket_tier_analytics:
    class: Drupal\myeventlane_commerce\Service\TicketTierAnalyticsService
    arguments:
      - '@myeventlane_commerce.ticket_variation_sold'
      - '@datetime.time'

  myeventlane_commerce.ticket_status:
    class: Drupal\myeventlane_commerce\Service\TicketStatusService
    arguments:
      - '@myeventlane_commerce.ticket_variation_sold'
      - '@datetime.time'

  myeventlane_commerce.ticket_availability:
    class: Drupal\myeventlane_commerce\Service\TicketAvailabilityService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_capacity.service'
      - '@logger.channel.myeventlane_commerce'
      - '@myeventlane_commerce.ticket_variation_sold'
      - '@datetime.time'
      - '@myeventlane_commerce.ticket_tier_access'
      - '@myeventlane_commerce.ticket_booking_session'
      - '@myeventlane_commerce.ticket_tier_waitlist'
      - '@current_user'
      - '@string_translation'
      - '@myeventlane_commerce.ticket_access_code'
      - '@myeventlane_commerce.ticket_group_eligibility'
      - '@myeventlane_commerce.ticket_capacity'
      - '@cache.data'
      - '@current_route_match'
      - '@request_stack'

  myeventlane_commerce.event_default_ticket_resolver:
    alias: myeventlane_event.ticket_type_manager

  myeventlane_commerce.customer_ticket_tier_display:
    class: Drupal\myeventlane_commerce\Service\CustomerTicketTierDisplayBuilder
    arguments:
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_event.ticket_tier_lifecycle'
      - '@commerce_price.currency_formatter'
      - '@myeventlane_commerce.ticket_tier_waitlist'
      - '@myeventlane_commerce.event_default_ticket_resolver'
      - '@string_translation'

  myeventlane_commerce.ticket_waitlist_order_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\TicketWaitlistOrderSubscriber
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_commerce.ticket_tier_waitlist'
      - '@logger.channel.myeventlane_commerce'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.donation:
    class: Drupal\myeventlane_commerce\Service\DonationService
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_commerce'

  myeventlane_commerce.controller.ticket_waitlist_claim:
    class: Drupal\myeventlane_commerce\Controller\TicketWaitlistClaimController
    arguments:
      - '@myeventlane_commerce.ticket_tier_waitlist'
      - '@myeventlane_commerce.ticket_booking_session'
      - '@commerce_cart.cart_provider'
      - '@commerce_cart.cart_manager'
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_capacity.order_inspector'
      - '@myeventlane_commerce.ticket_capacity'
      - '@logger.channel.myeventlane_commerce'
    tags:
      - { name: controller.service_arguments }

  myeventlane_commerce.ticket_availability_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\TicketAvailabilityCommerceSubscriber
    arguments:
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_capacity.order_inspector'
      - '@entity_type.manager'
      - '@lock'
      - '@request_stack'
      - '@string_translation'
      - '@logger.channel.myeventlane_commerce'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.ticket_capacity_order_subscriber:
    class: Drupal\myeventlane_commerce\EventSubscriber\TicketCapacityOrderSubscriber
    arguments:
      - '@lock'
      - '@myeventlane_commerce.ticket_availability'
      - '@logger.channel.myeventlane_commerce'
      - '@myeventlane_capacity.order_inspector'
      - '@entity_type.manager'
      - '@request_stack'
    tags:
      - { name: event_subscriber }

  myeventlane_commerce.operational_merchandise_manager:
    class: Drupal\myeventlane_commerce\Service\OperationalMerchandiseManager
    arguments:
      - '@entity_type.manager'
      - '@string_translation'
      - '@logger.channel.myeventlane_commerce'

  myeventlane_commerce.operational_extra_visual_presenter:
    class: Drupal\myeventlane_commerce\Service\OperationalExtraVisualPresenter
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'
      - '@extension.path.resolver'
      - '@string_translation'

  myeventlane_commerce.operational_variation_stock_resolver:
    class: Drupal\myeventlane_commerce\Service\OperationalVariationStockResolver
    arguments:
      - '@string_translation'

  myeventlane_commerce.event_operational_addon_builder:
    class: Drupal\myeventlane_commerce\Service\EventOperationalAddonBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@myeventlane_commerce.operational_extra_visual_presenter'
      - '@myeventlane_commerce.operational_variation_stock_resolver'
      - '@string_translation'

  myeventlane_commerce.event_operational_addon_teaser_builder:
    class: Drupal\myeventlane_commerce\Service\EventOperationalAddonTeaserBuilder
    arguments:
      - '@myeventlane_commerce.event_operational_addon_builder'
      - '@myeventlane_commerce.event_extras_book_placement_resolver'
      - '@commerce_price.currency_formatter'
      - '@string_translation'

  myeventlane_commerce.event_extras_book_placement_resolver:
    class: Drupal\myeventlane_commerce\Service\EventExtrasBookPlacementResolver
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@string_translation'

  myeventlane_commerce.event_booking_summary_cart_extras_builder:
    class: Drupal\myeventlane_commerce\Service\EventBookingSummaryCartExtrasBuilder
    arguments:
      - '@commerce_cart.cart_provider'
      - '@myeventlane_commerce.event_operational_addon_builder'
      - '@myeventlane_commerce.operational_order_item_display_builder'
      - '@myeventlane_commerce.operational_extra_visual_presenter'
      - '@entity_type.manager'

  myeventlane_commerce.operational_order_item_display_builder:
    class: Drupal\myeventlane_commerce\Service\OperationalOrderItemDisplayBuilder
    arguments:
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@myeventlane_commerce.operational_extra_visual_presenter'
      - '@entity_type.manager'
      - '@commerce_price.currency_formatter'
      - '@string_translation'

  myeventlane_commerce.operational_merchandise_governance_manager:
    class: Drupal\myeventlane_commerce\Service\OperationalMerchandiseGovernanceManager
    arguments:
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@string_translation'

  myeventlane_commerce.operational_purchase_composition_manager:
    class: Drupal\myeventlane_commerce\Service\OperationalPurchaseCompositionManager
    arguments:
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@myeventlane_commerce.operational_merchandise_governance_manager'
      - '@string_translation'

  myeventlane_commerce.operational_checkout_governance_manager:
    class: Drupal\myeventlane_commerce\Service\OperationalCheckoutGovernanceManager
    arguments:
      - '@string_translation'

  myeventlane_commerce.operational_customer_guidance_builder:
    class: Drupal\myeventlane_commerce\Service\OperationalCustomerGuidanceBuilder
    arguments:
      - '@string_translation'

  myeventlane_commerce.operational_cart_projection_builder:
    class: Drupal\myeventlane_commerce\Service\OperationalCartProjectionBuilder
    arguments:
      - '@string_translation'

  myeventlane_commerce.operational_checkout_orchestration_manager:
    class: Drupal\myeventlane_commerce\Service\OperationalCheckoutOrchestrationManager
    arguments:
      - '@myeventlane_commerce.operational_purchase_composition_manager'
      - '@myeventlane_commerce.operational_checkout_governance_manager'
      - '@myeventlane_commerce.operational_customer_guidance_builder'
      - '@myeventlane_commerce.operational_cart_projection_builder'
      - '@string_translation'

  myeventlane_commerce.operational_addon_guidance_builder:
    class: Drupal\myeventlane_commerce\Service\OperationalAddonGuidanceBuilder
    arguments:
      - '@string_translation'

  myeventlane_commerce.vendor_operational_addon_order_builder:
    class: Drupal\myeventlane_commerce\Service\VendorOperationalAddonOrderBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.operational_purchase_composition_manager'
      - '@myeventlane_commerce.event_operational_addon_builder'
      - '@myeventlane_commerce.operational_extra_visual_presenter'
      - '@date.formatter'
      - '@string_translation'

  myeventlane_commerce.event_operational_extras_sales_summary_builder:
    class: Drupal\myeventlane_commerce\Service\EventOperationalExtrasSalesSummaryBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.vendor_operational_addon_order_builder'
      - '@myeventlane_commerce.operational_purchase_composition_manager'
      - '@myeventlane_commerce.operational_merchandise_manager'
      - '@myeventlane_commerce.event_operational_addon_builder'
      - '@myeventlane_commerce.operational_variation_stock_resolver'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'
      - '@commerce_price.currency_formatter'
      - '@router.route_provider'
      - '@string_translation'
