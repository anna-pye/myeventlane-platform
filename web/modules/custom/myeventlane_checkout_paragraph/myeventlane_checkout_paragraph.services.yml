services:
  myeventlane_checkout_paragraph.access_resolver:
    class: Drupal\myeventlane_checkout_paragraph\Service\AttendeeParagraphAccessResolver
    arguments: ['@entity_type.manager']

  myeventlane_checkout_paragraph.checkin_token:
    class: Drupal\myeventlane_checkout_paragraph\Service\CheckInTokenService

  logger.channel.myeventlane_checkout_paragraph:
    parent: logger.channel_base
    arguments: ['myeventlane_checkout_paragraph']

  myeventlane_checkout_paragraph.checkout_attendee_schema:
    class: Drupal\myeventlane_checkout_paragraph\Service\CheckoutAttendeeSchemaService
    arguments:
      - '@myeventlane_commerce.ticket_availability'
      - '@logger.channel.myeventlane_checkout_paragraph'
