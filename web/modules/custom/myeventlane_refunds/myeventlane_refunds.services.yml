services:
  logger.channel.myeventlane_refunds:
    parent: logger.channel_base
    arguments: ['myeventlane_refunds']

  myeventlane_refunds.order_inspector:
    class: Drupal\myeventlane_refunds\Service\RefundOrderInspector
    arguments: ['@entity_type.manager', '@logger.channel.myeventlane_refunds']

  myeventlane_refunds.buyer_eligibility:
    class: Drupal\myeventlane_refunds\Service\BuyerRefundEligibilityService
    arguments: ['@myeventlane_refunds.order_inspector', '@datetime.time']

  myeventlane_refunds.refund_request_storage:
    class: Drupal\myeventlane_refunds\Service\RefundRequestStorage
    arguments: ['@database', '@datetime.time']

  myeventlane_refunds.adjustment_note:
    class: Drupal\myeventlane_refunds\Service\RefundAdjustmentNoteService
    arguments: ['@database', '@datetime.time']

  myeventlane_refunds.ticket_entitlement_reconciler:
    class: Drupal\myeventlane_refunds\Service\RefundTicketEntitlementReconciler
    arguments: ['@entity_type.manager', '@logger.channel.myeventlane_refunds']

  myeventlane_refunds.buyer_refund_access_check:
    class: Drupal\myeventlane_refunds\Access\BuyerRefundAccessCheck
    arguments:
      - '@myeventlane_refunds.buyer_eligibility'
      - '@request_stack'
      - '@entity_type.manager'

  myeventlane_refunds.vendor_refund_request_access:
    class: Drupal\myeventlane_refunds\Access\VendorRefundRequestAccessCheck
    arguments:
      - '@myeventlane_refunds.access_resolver'
      - '@myeventlane_event.event_mode_manager'
      - '@myeventlane_refunds.refund_request_storage'

  myeventlane_refunds.retry_access:
    class: Drupal\myeventlane_refunds\Access\RetryRefundAccessCheck
    arguments:
      - '@myeventlane_refunds.processor'
      - '@entity_type.manager'
      - '@myeventlane_refunds.access_resolver'

  myeventlane_refunds.store_ownership_bridge:
    class: Drupal\myeventlane_refunds\Service\VendorOwnershipStoreBridge
    arguments: ['@myeventlane_checkout_flow.vendor_ownership_resolver']

  myeventlane_refunds.access_resolver:
    class: Drupal\myeventlane_refunds\Service\RefundAccessResolver
    arguments:
      - '@myeventlane_refunds.store_ownership_bridge'
      - '@myeventlane_refunds.order_inspector'
      - '@myeventlane_vendor.event_access_checker'

  myeventlane_refunds.processor:
    class: Drupal\myeventlane_refunds\Service\RefundProcessor
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_refunds.order_inspector'
      - '@myeventlane_refunds.access_resolver'
      - '@myeventlane_refunds.buyer_eligibility'
      - '@myeventlane_refunds.refund_request_storage'
      - '@myeventlane_messaging.manager'
      - '@myeventlane_core.stripe'
      - '@config.factory'
      - '@logger.factory'
      - '@queue'
      - '@current_user'
      - '@database'
      - '@datetime.time'
      - '@lock'
      - '@module_handler'
      - '@myeventlane_core.domain_detector'
      - '@myeventlane_refunds.adjustment_note'
      - '@?myeventlane_notifications.refund_trigger'
      - '@myeventlane_refunds.ticket_entitlement_reconciler'
