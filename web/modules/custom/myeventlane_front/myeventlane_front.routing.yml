myeventlane_front.about:
  path: '/legacy-about'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToHelp'
    _title: 'About MyEventLane'
  requirements:
    _permission: 'access content'

myeventlane_front.story:
  path: '/legacy-our-story'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToHelp'
    _title: 'Our story'
  requirements:
    _permission: 'access content'

myeventlane_front.contact:
  path: '/legacy-contact'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToHelp'
    _title: 'Contact'
  requirements:
    _permission: 'access content'

myeventlane_front.blog:
  path: '/legacy-blog'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToBlog'
    _title: 'Blog'
  requirements:
    _permission: 'access content'

myeventlane_front.privacy:
  path: '/legacy-privacy'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToPolicies'
    _title: 'Privacy policy'
  requirements:
    _permission: 'access content'

myeventlane_front.terms:
  path: '/legacy-terms'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\LegacyAboutController::redirectToPolicies'
    _title: 'Terms'
  requirements:
    _permission: 'access content'

myeventlane_front.refund_policy_redirect:
  path: '/refund-policy'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\TrustRedirectController::refundPolicy'
    _title: 'Refund policy'
  requirements:
    _permission: 'access content'

myeventlane_front.sitemap:
  path: '/sitemap'
  defaults:
    _controller: '\Drupal\myeventlane_front\Controller\SitemapController::page'
    _title: 'Sitemap'
  requirements:
    _permission: 'access content'
