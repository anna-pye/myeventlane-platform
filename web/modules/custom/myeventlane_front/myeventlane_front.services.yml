services:
  myeventlane_front.featured_events_render_builder:
    class: Drupal\myeventlane_front\Service\FeaturedEventsRenderBuilder
    arguments:
      - '@entity_type.manager'
      - '@views.executable'
      - '@logger.factory'

  myeventlane_front.homepage_section_visibility:
    class: Drupal\myeventlane_front\Service\HomepageSectionVisibility
    arguments:
      - '@entity_type.manager'
      - '@views.executable'
      - '@myeventlane_front.featured_events_render_builder'

  myeventlane_front.homepage_merchandising:
    class: Drupal\myeventlane_front\Service\HomepageMerchandising
    arguments:
      - '@entity_type.manager'
      - '@views.executable'
      - '@datetime.time'
      - '@path.matcher'
      - '@myeventlane_event.public_visibility'
      - '@myeventlane_event.boosted_quality_gate'

  myeventlane_front.homepage_merchandising_query_alter:
    class: Drupal\myeventlane_front\Service\HomepageMerchandisingQueryAlter
    arguments:
      - '@myeventlane_front.homepage_merchandising'

  myeventlane_front.homepage_rail_diversity:
    class: Drupal\myeventlane_front\Service\HomepageRailDiversityFilter
    arguments:
      - '@myeventlane_front.homepage_merchandising'

  myeventlane_front.homepage_visibility_report:
    class: Drupal\myeventlane_front\Service\HomepageVisibilityReportService
    arguments:
      - '@myeventlane_front.homepage_merchandising'
      - '@myeventlane_event.featured_readiness'
      - '@string_translation'
      - '@?myeventlane_domain_events.read_model.event_metrics'
      - '@?myeventlane_core.discovery_surface_analytics'

  myeventlane_front.trust_content_foundation:
    class: Drupal\myeventlane_front\Service\TrustContentFoundation
    arguments:
      - '@entity_type.manager'
      - '@config.factory'

  myeventlane_front.public_footer_navigation:
    class: Drupal\myeventlane_front\Service\PublicFooterNavigationBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_core.event_category_url'

  myeventlane_front.sitemap_builder:
    class: Drupal\myeventlane_front\Service\SitemapBuilder
    arguments:
      - '@myeventlane_front.public_footer_navigation'
      - '@module_handler'
      - '@?myeventlane_legal.settings'

  myeventlane_front.route_subscriber:
    class: Drupal\myeventlane_front\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  myeventlane_front.organiser_hub_term_provisioner:
    class: Drupal\myeventlane_front\Service\OrganiserHubTermProvisioner
    arguments:
      - '@config.factory'
      - '@entity_type.manager'

  myeventlane_front.organiser_hub_landing:
    class: Drupal\myeventlane_front\Service\OrganiserHubLandingBuilder
    arguments:
      - '@config.factory'
      - '@entity_type.manager'

  myeventlane_front.blog_related_content:
    class: Drupal\myeventlane_front\Service\BlogRelatedContentService
    arguments:
      - '@entity_type.manager'
      - '@cache.default'

  myeventlane_front.playbook_query:
    class: Drupal\myeventlane_front\Service\PlaybookQueryService
    arguments:
      - '@entity_type.manager'
      - '@cache.default'

  myeventlane_front.blog_resource_downloads:
    class: Drupal\myeventlane_front\Service\BlogResourceDownloadBuilder
    arguments:
      - '@file_url_generator'

  myeventlane_front.blog_landing_page:
    class: Drupal\myeventlane_front\Service\BlogLandingPageBuilder
    arguments:
      - '@entity_type.manager'
      - '@cache.default'

  myeventlane_front.blog_article_presentation:
    class: Drupal\myeventlane_front\Service\BlogArticlePresentationService
    arguments:
      - '@date.formatter'
      - '@entity_type.manager'
      - '@myeventlane_front.blog_related_content'
      - '@myeventlane_front.blog_resource_downloads'
      - '@config.factory'

  myeventlane_front.blog_structured_data:
    class: Drupal\myeventlane_front\Service\BlogStructuredDataBuilder
    arguments:
      - '@date.formatter'

  myeventlane_front.organiser_hub_editorial:
    class: Drupal\myeventlane_front\Service\OrganiserHubEditorialService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_front.blog_related_content'
      - '@myeventlane_front.blog_resource_downloads'

  myeventlane_front.organiser_hub_page:
    class: Drupal\myeventlane_front\Service\OrganiserHubPageBuilder
    arguments:
      - '@myeventlane_front.playbook_query'
      - '@myeventlane_front.organiser_hub_editorial'
      - '@myeventlane_front.blog_resource_downloads'
      - '@entity_type.manager'
      - '@cache.default'

  myeventlane_front.organiser_hub_content_seeder:
    class: Drupal\myeventlane_front\Service\OrganiserHubContentSeeder
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@logger.factory'
