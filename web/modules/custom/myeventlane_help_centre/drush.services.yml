services:
  myeventlane_help_centre.commands.repair_node_field_tables:
    class: Drupal\myeventlane_help_centre\Commands\RepairNodeFieldTablesCommands
    arguments:
      - '@entity.definition_update_manager'
    tags:
      - { name: drush.command }

  myeventlane_help_centre.commands.help_content:
    class: Drupal\myeventlane_help_centre\Commands\HelpContentCommands
    arguments:
      - '@myeventlane_help_centre.priority_help_article_importer'
    tags:
      - { name: drush.command }
