services:
  logger.channel.myeventlane_help_centre:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['myeventlane_help_centre']

  myeventlane_help_centre.help_content_repository:
    class: Drupal\myeventlane_help_centre\Service\HelpContentRepository
    arguments:
      - '@config.factory'

  myeventlane_help_centre.help_browse_policy:
    class: Drupal\myeventlane_help_centre\Service\HelpArticleBrowsePolicy

  myeventlane_help_centre.support_panel_builder:
    class: Drupal\myeventlane_help_centre\Service\SupportPanelBuilder
    arguments:
      - '@myeventlane_help_centre.help_content_repository'
      - '@path.validator'
      - '@myeventlane_help.analytics'
      - '@myeventlane_help.intelligence'

  myeventlane_help_centre.seeder:
    class: Drupal\myeventlane_help_centre\Service\HelpContentSeeder
    public: true
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_help_centre.help_content_repository'
      - '@logger.factory'

  myeventlane_help_centre.priority_help_article_importer:
    class: Drupal\myeventlane_help_centre\Service\PriorityHelpArticleImporter
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@language_manager'
      - '@logger.channel.myeventlane_help_centre'
      - '%app.root%'

  myeventlane_help_centre.analytics:
    class: Drupal\myeventlane_help_centre\Service\HelpAnalyticsService
    arguments:
      - '@database'
      - '@logger.factory'
      - '@current_user'
      - '@datetime.time'
      - '@event_dispatcher'

  myeventlane_help_centre.contextual_help:
    class: Drupal\myeventlane_help_centre\Service\ContextualHelpMap
    arguments:
      - '@config.factory'

  myeventlane_help_centre.contextual_help_resolver:
    class: Drupal\myeventlane_help_centre\Service\ContextualHelpResolver
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@current_user'
      - '@module_handler'
      - '@logger.channel.myeventlane_help_centre'
      - '@string_translation'

  myeventlane_help_centre.support_action_builder:
    class: Drupal\myeventlane_help_centre\Service\SupportActionBuilder
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@module_handler'
      - '@config.factory'
      - '@string_translation'

  myeventlane_help_centre.support_context_builder:
    class: Drupal\myeventlane_help_centre\Service\SupportContextBuilder
    arguments:
      - '@current_route_match'
      - '@request_stack'
      - '@current_user'
      - '@?myeventlane_help_assistant.context_resolver'
      - '@myeventlane_help_centre.support_action_builder'

  myeventlane_help_centre.mel_support_settings_builder:
    class: Drupal\myeventlane_help_centre\Service\MelSupportSettingsBuilder
    arguments:
      - '@myeventlane_help_centre.support_context_builder'
      - '@myeventlane_help_centre.support_action_builder'
      - '@request_stack'
      - '@current_user'
      - '@module_handler'
      - '@config.factory'
      - '@string_translation'

  myeventlane_help_centre.support_shell_page_attachments:
    class: Drupal\myeventlane_help_centre\Service\SupportShellPageAttachments
    arguments:
      - '@current_route_match'
      - '@request_stack'
      - '@myeventlane_help_centre.mel_support_settings_builder'

  myeventlane_help.analytics:
    class: Drupal\myeventlane_help_centre\Service\HelpPanelAnalytics
    arguments:
      - '@database'
      - '@request_stack'
      - '@datetime.time'
      - '@logger.channel.myeventlane_help_centre'

  myeventlane_help.recommendation_engine:
    class: Drupal\myeventlane_help_centre\Service\HelpRecommendationEngine
    arguments:
      - '@myeventlane_help.analytics_summary'
      - '@myeventlane_help_centre.help_content_repository'
      - '@logger.channel.myeventlane_help_centre'

  myeventlane_help.analytics_summary:
    class: Drupal\myeventlane_help_centre\Service\HelpAnalyticsSummary
    arguments:
      - '@database'
      - '@cache.default'
      - '@datetime.time'
      - '@logger.channel.myeventlane_help_centre'
      - '@myeventlane_help.analytics'

  myeventlane_help.intelligence:
    class: Drupal\myeventlane_help_centre\Service\HelpPanelIntelligence
    arguments:
      - '@myeventlane_help.analytics_summary'
