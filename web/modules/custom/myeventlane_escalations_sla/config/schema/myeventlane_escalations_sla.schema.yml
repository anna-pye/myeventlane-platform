myeventlane_escalations_sla.settings:
  type: config_object
  label: 'Escalations SLA settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    sla_hours:
      type: mapping
      label: 'SLA hours by priority'
      mapping:
        urgent:
          type: mapping
          label: 'Urgent'
          mapping:
            first_response:
              type: integer
              label: 'First response hours'
            resolution:
              type: integer
              label: 'Resolution hours'
        high:
          type: mapping
          label: 'High'
          mapping:
            first_response:
              type: integer
              label: 'First response hours'
            resolution:
              type: integer
              label: 'Resolution hours'
        normal:
          type: mapping
          label: 'Normal'
          mapping:
            first_response:
              type: integer
              label: 'First response hours'
            resolution:
              type: integer
              label: 'Resolution hours'
        low:
          type: mapping
          label: 'Low'
          mapping:
            first_response:
              type: integer
              label: 'First response hours'
            resolution:
              type: integer
              label: 'Resolution hours'
    escalation_thresholds:
      type: sequence
      label: 'Escalation thresholds'
      sequence:
        type: mapping
        label: 'Threshold'
        mapping:
          hours_past_due:
            type: integer
            label: 'Hours past due'
          level:
            type: integer
            label: 'Escalation level'
    breach_emails:
      type: mapping
      label: 'Breach email settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enabled'
    risk_detection:
      type: mapping
      label: 'Risk detection settings'
      mapping:
        threshold_hours:
          type: integer
          label: 'Hours before SLA due to trigger risk detection'
