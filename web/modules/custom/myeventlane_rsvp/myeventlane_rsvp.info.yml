package: MyEventLane
core_version_requirement: ^11
lifecycle: stable

dependencies:
  - myeventlane_surface:myeventlane_surface
  - myeventlane_vendor:myeventlane_vendor
  - myeventlane_messaging:myeventlane_messaging
  - myeventlane_core:myeventlane_core
  - myeventlane_legal:myeventlane_legal
  - myeventlane_schema:myeventlane_schema
  - myeventlane_event_attendees:myeventlane_event_attendees
  - drupal:commerce_order
  - drupal:node
  - drupal:user
  - drupal:views
  - drupal:datetime
  - drupal:options
  - drupal:link
