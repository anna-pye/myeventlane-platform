services:
  myeventlane_rsvp.donation_confirmation_subscriber:
    class: Drupal\myeventlane_rsvp\EventSubscriber\RsvpDonationConfirmationSubscriber
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_rsvp.mailer'
      - '@logger.channel.myeventlane_rsvp'
    tags:
      - { name: event_subscriber }

  myeventlane_rsvp.user_rsvp_repository:
    class: Drupal\myeventlane_rsvp\Service\UserRsvpRepository
    arguments: ['@database', '@entity_type.manager']

  myeventlane_rsvp.mailer:
    class: Drupal\myeventlane_rsvp\Service\RsvpMailer
    arguments:
      - '@config.factory'
      - '@myeventlane_messaging.manager'
      - '@logger.channel.myeventlane_rsvp'
      - '@?myeventlane_tickets.ticket_pdf_generator'

  logger.channel.myeventlane_rsvp:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['myeventlane_rsvp']

  myeventlane_rsvp.ics_controller:
    class: Drupal\myeventlane_rsvp\Controller\IcsController
    arguments: ['@myeventlane_rsvp.ics_generator']
    tags:
      - { name: controller.service_arguments }

  myeventlane_rsvp.thank_you_controller:
    class: Drupal\myeventlane_rsvp\Controller\RsvpThankYouController
    arguments:
      - '@entity_type.manager'
      - '@request_stack'
      - '@logger.factory'
      - '@myeventlane_rsvp.mailer'
      - '@module_handler'
      - '@current_user'
      - '@myeventlane_surface.customer_continuity_presenter'
    tags:
      - { name: controller.service_arguments }

  myeventlane_rsvp.ics_generator:
    class: Drupal\myeventlane_rsvp\Service\IcsGenerator
    arguments: ['@logger.channel.myeventlane_rsvp', '@myeventlane_core.event_datetime']

  myeventlane_rsvp.capacity:
    class: Drupal\myeventlane_rsvp\Service\RsvpCapacityService
    arguments: ['@entity_type.manager']

  myeventlane_rsvp.calendar_buttons:
    class: Drupal\myeventlane_rsvp\Service\CalendarButtonBuilder
    arguments: ['@myeventlane_core.event_datetime']

  myeventlane_rsvp.storage:
    class: Drupal\myeventlane_rsvp\Service\RsvpStorage
    arguments: ['@database']

  myeventlane_rsvp.digest_generator:
    class: Drupal\myeventlane_rsvp\Service\VendorDigestGenerator
    arguments: ['@entity_type.manager', '@plugin.manager.mail', '@renderer']

  myeventlane_rsvp.digest_queue:
    class: Drupal\myeventlane_rsvp\Queue\VendorDigestQueue
    arguments: ['@myeventlane_rsvp.digest_generator']
    tags:
      - { name: queue_worker, queue_name: mel_rsvp_vendor_digest, cron: 60 }

  myeventlane_rsvp.submission_saver:
    class: Drupal\myeventlane_rsvp\Service\RsvpSubmissionSaver
    arguments: ['@entity_type.manager', '@plugin.manager.mail', '@renderer']

  myeventlane_rsvp.promotion_manager:
    class: Drupal\myeventlane_rsvp\Service\RsvpPromotionManager
    arguments: ['@entity_type.manager']

  myeventlane_rsvp.organiser_view_scope:
    class: Drupal\myeventlane_rsvp\Service\RsvpOrganiserViewScope
    arguments: ['@myeventlane_vendor.user_vendor_membership_query']

  myeventlane_rsvp.vendor_event_access:
    class: Drupal\myeventlane_rsvp\Access\VendorEventAccess
    arguments: ['@myeventlane_vendor.event_access_checker']

  myeventlane_rsvp.rsvp_cancel_access:
    class: Drupal\myeventlane_rsvp\Access\RsvpCancelAccess
    arguments: ['@entity_type.manager', '@config.factory', '@request_stack']

  myeventlane_rsvp.submission_manager:
    class: Drupal\myeventlane_rsvp\Service\RsvpSubmissionManager
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_rsvp.capacity'
      - '@flood'
      - '@lock'
      - '@current_user'
      - '@request_stack'

  myeventlane_rsvp.pdf_generator:
    class: Drupal\myeventlane_rsvp\Service\RsvpPdfGenerator
    arguments: ['@file_system']

  myeventlane_rsvp.sms_manager:
    class: Drupal\myeventlane_rsvp\Service\SmsManager
    arguments: ['@config.factory']

  myeventlane_rsvp.ics_bundle:
    class: Drupal\myeventlane_rsvp\Service\IcsBundleGenerator
    arguments: ['@entity_type.manager', '@myeventlane_core.event_datetime']
