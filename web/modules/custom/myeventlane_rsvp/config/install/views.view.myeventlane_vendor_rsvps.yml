langcode: en
status: true
dependencies:
  module:
    - myeventlane_rsvp
    - node
id: myeventlane_vendor_rsvps
label: 'Vendor RSVP Submissions'
module: views
description: 'Lists RSVP submissions for vendors'
tag: ''
base_table: rsvp_submission
base_field: id
core: '11.x'

display:

  default:
    id: default
    display_title: Master
    display_plugin: default
    position: 0
    display_options:

      title: 'RSVP Submissions'

      relationships:
        event_id:
          id: event_id
          table: rsvp_submission
          field: event_id
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: standard
          required: false

      access:
        type: myeventlane_rsvp_vendor_access
        options: { }

      cache:
        type: tag
        options: { }

      empty:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: text_custom
          empty: true
          content: '<div class="mel-vendor-rsvps__empty" role="status"><h2>No RSVPs yet</h2><p>RSVPs will appear here as people respond. You can share your event link from the Event Editor.</p></div>'
          tokenize: false

      query:
        type: views_query
        options: { }

      pager:
        type: full
        options:
          items_per_page: 50
          offset: 0

      style:
        type: table
        options:
          columns:
            id: id
            event_title: event_title
            attendee_name: attendee_name
            status: status
            changed: changed
          default: changed
          info:
            id:
              sortable: true
              align: ''
              empty_column: false
            event_title:
              sortable: true
              align: ''
              empty_column: false
            attendee_name:
              sortable: true
              align: ''
              empty_column: false
            status:
              sortable: true
              align: ''
              empty_column: false
            changed:
              sortable: true
              default_sort_order: desc
              align: ''
              empty_column: false

      row:
        type: fields
        options: { }

      fields:

        id:
          id: id
          table: rsvp_submission
          field: id
          label: 'RSVP ID'
          plugin_id: numeric

        event_title:
          id: title
          table: node_field_data
          field: title
          relationship: event_id
          label: 'Event'
          empty: 'Legacy / unknown event'
          plugin_id: field

        attendee_name:
          id: attendee_name
          table: rsvp_submission
          field: attendee_name
          label: 'Attendee'
          plugin_id: string

        status:
          id: status
          table: rsvp_submission
          field: status
          label: 'Status'
          plugin_id: string

        changed:
          id: changed
          table: rsvp_submission
          field: changed
          label: 'Updated'
          plugin_id: date

      filters:

        status:
          id: status
          table: rsvp_submission
          field: status
          plugin_id: string
          label: 'Status'
          operator: '!='
          value: cancelled
          group: 1
          exposed: false

        organiser_owned:
          id: organiser_owned
          table: rsvp_submission
          field: organiser_owned
          plugin_id: myeventlane_rsvp_organiser_owned
          group: 1
          exposed: false

      sorts:

        changed:
          id: changed
          table: rsvp_submission
          field: changed
          label: 'Updated'
          order: DESC
          plugin_id: date

      display_extenders: { }

  page_1:
    id: page_1
    display_title: 'Page'
    display_plugin: page
    position: 1
    display_options:
      path: 'dashboard/rsvps'
      menu:
        type: none
      access:
        type: myeventlane_rsvp_vendor_access
        options: { }
      display_extenders: { }
