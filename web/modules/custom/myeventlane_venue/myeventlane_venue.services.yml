services:
  # Logger channel.
  logger.channel.myeventlane_venue:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['myeventlane_venue']

  # Venue access resolver - single source of truth for access decisions.
  myeventlane_venue.access_resolver:
    class: Drupal\myeventlane_venue\Service\VenueAccessResolver
    arguments:
      - '@entity_type.manager'
      - '@current_user'

  # Venue manager service.
  myeventlane_venue.manager:
    class: Drupal\myeventlane_venue\Service\VenueManager
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_venue.access_resolver'
      - '@logger.channel.myeventlane_venue'

  myeventlane_venue.candidate_scorer:
    class: Drupal\myeventlane_venue\Service\VenueCandidateScorer

  myeventlane_venue.overture_repository:
    class: Drupal\myeventlane_venue\Service\OverturePlaceRepository
    arguments:
      - '@database'
      - '@myeventlane_venue.candidate_scorer'

  myeventlane_venue.suggestion_service:
    class: Drupal\myeventlane_venue\Service\VenueSuggestionService
    arguments:
      - '@myeventlane_venue.access_resolver'
      - '@myeventlane_venue.manager'
      - '@myeventlane_venue.overture_repository'
      - '@myeventlane_venue.candidate_scorer'

  myeventlane_venue.overture_importer:
    class: Drupal\myeventlane_venue\Service\OverturePlaceImporter
    arguments:
      - '@database'
      - '@datetime.time'
      - '@myeventlane_venue.candidate_scorer'

  # Explicit, approval-gated website metadata enrichment. These services are
  # separate from the local Overture catalogue and never run on page load.
  myeventlane_venue.public_remote_url_guard:
    class: Drupal\myeventlane_venue\Service\PublicRemoteUrlGuard

  myeventlane_venue.safe_remote_content_fetcher:
    class: Drupal\myeventlane_venue\Service\SafeRemoteContentFetcher
    arguments:
      - '@http_client'
      - '@myeventlane_venue.public_remote_url_guard'

  myeventlane_venue.website_metadata_fetcher:
    class: Drupal\myeventlane_venue\Service\VenueWebsiteMetadataFetcher
    arguments:
      - '@myeventlane_venue.safe_remote_content_fetcher'
      - '@myeventlane_venue.public_remote_url_guard'

  myeventlane_venue.website_image_importer:
    class: Drupal\myeventlane_venue\Service\VenueWebsiteImageImporter
    arguments:
      - '@myeventlane_venue.safe_remote_content_fetcher'
      - '@file.repository'
      - '@file_system'
      - '@entity_type.manager'
      - '@datetime.time'

  # Share token generator.
  myeventlane_venue.share_token_generator:
    class: Drupal\myeventlane_venue\Service\ShareTokenGenerator

  # Controller for venues list.
  myeventlane_venue.controller.venues_list:
    class: Drupal\myeventlane_venue\Controller\VendorVenuesController
    arguments:
      - '@myeventlane_venue.access_resolver'
      - '@myeventlane_venue.manager'

  myeventlane_venue.controller.website_metadata:
    class: Drupal\myeventlane_venue\Controller\VenueWebsiteMetadataController
    arguments:
      - '@myeventlane_venue.website_metadata_fetcher'
      - '@myeventlane_venue.website_image_importer'
      - '@tempstore.private'
      - '@datetime.time'
      - '@logger.channel.myeventlane_venue'
      - '@flood'
      - '@current_user'
