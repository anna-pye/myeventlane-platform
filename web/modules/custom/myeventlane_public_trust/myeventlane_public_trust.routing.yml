# Public trust and transparency page. Anonymous-safe aggregated platform metrics from
# cache only (TrustSignalCalculator); no vendor, order, or customer PII exposed.
myeventlane_public_trust.page:
  path: /trust
  defaults:
    _controller: '\Drupal\myeventlane_public_trust\Controller\PublicTrustController::page'
    _title: 'Trust & transparency'
  requirements:
    _access: 'TRUE'
