services:
  # Logger channel for boost module.
  logger.channel.myeventlane_boost:
    parent: logger.channel_base
    arguments: ['myeventlane_boost']

  # Centralised help copy (tooltips, PDF, onboarding, FAQ).
  myeventlane_boost.help_content:
    class: Drupal\myeventlane_boost\Service\BoostHelpContent

  # Public, one-page PDF guide generator.
  myeventlane_boost.performance_guide_pdf:
    class: Drupal\myeventlane_boost\Service\BoostPerformanceGuidePdfGenerator
    arguments:
      - '@renderer'
      - '@myeventlane_boost.help_content'
      - '@logger.channel.myeventlane_boost'

  # Main boost manager service.
  myeventlane_boost.manager:
    class: Drupal\myeventlane_boost\BoostManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@myeventlane_boost.entitlement_manager'
      - '@logger.channel.myeventlane_boost'

  # Auditable boost entitlement lifecycle manager.
  myeventlane_boost.entitlement_manager:
    class: Drupal\myeventlane_boost\Service\BoostEntitlementManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@logger.channel.myeventlane_boost'

  myeventlane_boost.purchase_success_resolver:
    class: Drupal\myeventlane_boost\Service\BoostPurchaseSuccessResolver
    arguments:
      - '@myeventlane_boost.entitlement_manager'

  myeventlane_boost.checkout_redirect_subscriber:
    class: Drupal\myeventlane_boost\EventSubscriber\BoostCheckoutRedirectSubscriber
    arguments:
      - '@current_route_match'
      - '@entity_type.manager'
      - '@myeventlane_boost.purchase_success_resolver'
      - '@logger.channel.myeventlane_boost'
    tags:
      - { name: event_subscriber }

  # Order/checkout event subscriber for applying boosts on payment.
  myeventlane_boost.order_subscriber:
    class: Drupal\myeventlane_boost\EventSubscriber\BoostOrderSubscriber
    arguments:
      - '@myeventlane_boost.entitlement_manager'
      - '@logger.channel.myeventlane_boost'
      - '@request_stack'
      - '@?myeventlane_notifications.business_trigger'
    tags:
      - { name: event_subscriber }

  # Refund/void subscriber to revoke boosts.
  myeventlane_boost.refund_subscriber:
    class: Drupal\myeventlane_boost\EventSubscriber\BoostRefundSubscriber
    arguments:
      - '@myeventlane_boost.entitlement_manager'
      - '@logger.channel.myeventlane_boost'
    tags:
      - { name: event_subscriber }

  # Access check coordinator for boost routes.
  myeventlane_boost.access:
    class: Drupal\myeventlane_boost\Access\BoostRouteAccess
    arguments:
      - '@logger.channel.myeventlane_boost'
      - '@myeventlane_vendor.access.vendor_console'

  # Backward-compatible alias for existing route requirement IDs.
  myeventlane_boost.boost_route_access:
    alias: myeventlane_boost.access

  # Stripe connectivity checker for vendors/stores.
  myeventlane_boost.stripe_checker:
    class: Drupal\myeventlane_boost\Service\StripeChecker
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_boost'

  # Resolver for published boost product variations.
  myeventlane_boost.boost_variation_resolver:
    class: Drupal\myeventlane_boost\Service\BoostVariationResolver
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_boost'

  # Boost metrics service.
  myeventlane_boost.metrics:
    class: Drupal\myeventlane_boost\Service\BoostMetricsService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@myeventlane_boost.manager'
      - '@myeventlane_boost.entitlement_manager'
      - '@datetime.time'
      - '@string_translation'

  # Platform-wide Boost benchmarks (Phase 7A — internal only).
  myeventlane_boost.benchmark:
    class: Drupal\myeventlane_boost\Service\BoostBenchmarkService
    arguments:
      - '@database'
      - '@cache.default'
      - '@myeventlane_boost.placement_resolver'

  # Boost analytics decision support (Stage 3 — no new queries).
  myeventlane_boost.decision_support:
    class: Drupal\myeventlane_boost\Service\BoostDecisionSupportService
    arguments:
      - '@string_translation'

  # Event-scoped Boost trend intelligence (Phase 8 — daily rollup chart data only).
  myeventlane_boost.trend_intelligence:
    class: Drupal\myeventlane_boost\Service\BoostTrendIntelligenceService
    arguments:
      - '@string_translation'

  # Organiser-facing Boost performance level (Phase 9 — composes decision + trend).
  myeventlane_boost.performance_level:
    class: Drupal\myeventlane_boost\Service\BoostPerformanceLevelService
    arguments:
      - '@string_translation'

  # Prioritised Boost actions with CTAs (Phase 10 — reuses decision support signals).
  myeventlane_boost.action_engine:
    class: Drupal\myeventlane_boost\Service\BoostActionEngineService
    arguments:
      - '@myeventlane_boost.decision_support'
      - '@string_translation'

  # Contextual Boost extension / restart recommendations (Phase 11C).
  myeventlane_boost.extension_recommendation:
    class: Drupal\myeventlane_boost\Service\BoostExtensionRecommendationService
    arguments:
      - '@myeventlane_vendor.service.boost_status'
      - '@myeventlane_boost.manager'
      - '@myeventlane_boost.performance_level'
      - '@myeventlane_boost.decision_support'
      - '@myeventlane_boost.trend_intelligence'
      - '@myeventlane_boost.metrics'
      - '@myeventlane_event_state.resolver'
      - '@datetime.time'
      - '@string_translation'

  # Thin façade: lifecycle presentation metrics (composes BoostManager, entitlements, analytics).
  myeventlane_boost.performance:
    class: Drupal\myeventlane_boost\Service\BoostPerformanceService
    arguments:
      - '@myeventlane_boost.manager'
      - '@myeventlane_boost.entitlement_manager'
      - '@myeventlane_boost.metrics'
      - '@myeventlane_analytics.data'
      - '@datetime.time'
      - '@logger.channel.myeventlane_boost'
      - '@url_generator'
      - '@string_translation'
      - '@state'

  # Boost impression tracker.
  myeventlane_boost.impression_tracker:
    class: Drupal\myeventlane_boost\Service\BoostImpressionTracker
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.myeventlane_boost'

  myeventlane_boost.placement_resolver:
    class: Drupal\myeventlane_boost\Service\BoostPlacementResolver
    arguments:
      - '@current_route_match'
      - '@?myeventlane_core.event_category_url'
      - '@router'
      - '@request_stack'

  myeventlane_boost.impression_attribution:
    class: Drupal\myeventlane_boost\Service\BoostImpressionAttributionService
    arguments:
      - '@myeventlane_boost.entitlement_manager'
      - '@myeventlane_boost.placement_resolver'
      - '@myeventlane_boost.impression_tracker'
      - '@entity_type.manager'
      - '@cache.default'
      - '@lock'
      - '@request_stack'
      - '@logger.channel.myeventlane_boost'

  # Boost click tracker.
  myeventlane_boost.click_tracker:
    class: Drupal\myeventlane_boost\Service\BoostClickTracker
    arguments:
      - '@database'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@myeventlane_boost.entitlement_manager'
      - '@logger.channel.myeventlane_boost'

  # Click tracking event subscriber.
  myeventlane_boost.click_tracking_subscriber:
    class: Drupal\myeventlane_boost\EventSubscriber\BoostClickTrackingSubscriber
    arguments:
      - '@myeventlane_boost.click_tracker'
    tags:
      - { name: event_subscriber }

  # Daily rollup (Phase 2): log -> daily aggregates.
  myeventlane_boost.daily_rollup:
    class: Drupal\myeventlane_boost\Service\BoostDailyRollupService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.myeventlane_boost'
