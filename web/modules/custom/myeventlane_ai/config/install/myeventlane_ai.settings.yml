enabled: false
# When FALSE, Flood-based per-user / per-scope rate limits are skipped (dev only).
rate_limit_enabled: true
provider: 'openai'
openai:
  endpoint: 'https://api.openai.com/v1/chat/completions'
  model: 'gpt-4o-mini'
  timeout_seconds: 20
  max_tokens: 600
  temperature: 0.2
rate_limit:
  per_user_per_hour: 10
  per_scope_per_10_min: 5
daily_user_token_limit: 50000
daily_vendor_token_limit: 200000
daily_cost_ceiling_usd: 10
cb_failure_threshold: 10
cb_window_seconds: 600
cb_cost_trip_seconds: 86400
usage_retention_days: 7
ai_job_retention_days: 7
ai_job_error_retention_days: 14
