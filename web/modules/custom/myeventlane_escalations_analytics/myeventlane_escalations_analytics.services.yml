services:
  myeventlane_escalations_analytics.query:
    class: Drupal\myeventlane_escalations_analytics\Service\EscalationAnalyticsQuery
    arguments: ['@entity_type.manager']

  myeventlane_escalations_analytics.metrics:
    class: Drupal\myeventlane_escalations_analytics\Service\EscalationMetricsCalculator
    arguments: ['@entity_type.manager']

  myeventlane_escalations_analytics.health:
    class: Drupal\myeventlane_escalations_analytics\Service\VendorHealthEvaluator

  logger.channel.myeventlane_escalations_analytics:
    parent: logger.channel_base
    arguments: ['myeventlane_escalations_analytics']
