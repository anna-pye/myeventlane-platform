services:
  myeventlane_wallet.download_access:
    class: Drupal\myeventlane_wallet\Service\WalletDownloadAccessChecker
    arguments: ['@config.factory']

  myeventlane_wallet.ticket_resolver:
    class: Drupal\myeventlane_wallet\Service\WalletTicketResolver
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_wallet.download_access'

  myeventlane_wallet.wallet_signer:
    class: Drupal\myeventlane_wallet\Service\WalletSigner
    arguments:
      - '@config.factory'
      - '@logger.channel.myeventlane_wallet'

  myeventlane_wallet.pkpass_builder:
    class: Drupal\myeventlane_wallet\Service\PkPassBuilder
    arguments:
      - '@file_system'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'
      - '@myeventlane_wallet.wallet_signer'
      - '@config.factory'
      - '@extension.list.module'
      - '@logger.channel.myeventlane_wallet'
      - '@myeventlane_wallet.event_presentation'

  myeventlane_wallet.event_presentation:
    class: Drupal\myeventlane_wallet\Service\WalletEventPresentation
    arguments:
      - '@file_system'
      - '@logger.channel.myeventlane_wallet'
      - '@?myeventlane_event.geo_resolver'

  myeventlane_wallet.google_wallet_builder:
    class: Drupal\myeventlane_wallet\Service\GoogleWalletBuilder
    arguments:
      - '@config.factory'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'
      - '@logger.channel.myeventlane_wallet'

  myeventlane_wallet.presentation_gate:
    class: Drupal\myeventlane_wallet\Service\WalletPresentationGate
    arguments:
      - '@config.factory'
      - '@myeventlane_wallet.wallet_signer'

  myeventlane_wallet.action_builder:
    class: Drupal\myeventlane_wallet\Service\WalletActionBuilder
    arguments:
      - '@myeventlane_wallet.presentation_gate'
      - '@extension.list.module'

  logger.channel.myeventlane_wallet:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['myeventlane_wallet']
