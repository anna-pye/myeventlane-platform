# Admin settings page.
myeventlane_donations.settings:
  path: '/admin/config/myeventlane/donations'
  defaults:
    _form: '\Drupal\myeventlane_donations\Form\DonationSettingsForm'
    _title: 'Donation settings'
  requirements:
    _permission: 'administer myeventlane donations'
  options:
    _admin_route: TRUE

# Platform donation form (vendor -> MyEventLane).
myeventlane_donations.platform:
  path: '/vendor/donate'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationPlatformController::donate'
    _title: 'Support MyEventLane'
  requirements:
    _permission: 'access vendor console'
    _custom_access: 'myeventlane_donations.donation_access:platformAccess'
  options:
    _maintenance_access: FALSE

# Platform donation success callback.
myeventlane_donations.platform_success:
  path: '/vendor/donate/success'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationPlatformController::success'
    _title: 'Thank you for your donation'
  requirements:
    _permission: 'access vendor console'
  options:
    _maintenance_access: FALSE

# Platform donation cancel callback.
myeventlane_donations.platform_cancel:
  path: '/vendor/donate/cancel'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationPlatformController::cancel'
    _title: 'Donation cancelled'
  requirements:
    _permission: 'access vendor console'
  options:
    _maintenance_access: FALSE

# Vendor donations list page.
myeventlane_donations.vendor_list:
  path: '/vendor/donations'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationVendorController::list'
    _title: 'Donations received'
  requirements:
    _custom_access: 'myeventlane_donations.donation_access:vendorAccess'
  options:
    _maintenance_access: FALSE

# Admin donation report.
myeventlane_donations.admin_report:
  path: '/admin/reports/myeventlane/donations'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationReportController::report'
    _title: 'Donation reports'
  requirements:
    _custom_access: '\Drupal\myeventlane_donations\Access\DonationReportAccess::accessReport'
  options:
    _admin_route: TRUE

# Admin donation CSV export.
myeventlane_donations.admin_export:
  path: '/admin/reports/myeventlane/donations/export'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationReportController::export'
    _title: 'Export donations'
  requirements:
    _permission: 'administer myeventlane donations'
  options:
    _admin_route: TRUE

# Unattributed RSVP donations report (items missing field_target_event).
myeventlane_donations.unattributed:
  path: '/admin/reports/myeventlane/donations/unattributed'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\DonationReportController::unattributed'
    _title: 'Unattributed RSVP donations'
  requirements:
    _permission: 'administer myeventlane donations'
  options:
    _admin_route: TRUE

# Vendor: MEL % contribution accrual + invoices (Phase 3).
myeventlane_donations.vendor_mel_billing:
  path: '/vendor/billing/mel-contributions'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelContributionBillingController::overview'
    _title: 'MEL contributions'
  requirements:
    _custom_access: 'myeventlane_donations.donation_access:vendorAccess'
  options:
    _maintenance_access: FALSE

myeventlane_donations.vendor_mel_invoice:
  path: '/vendor/billing/mel-contributions/{invoice}'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelContributionBillingController::invoiceView'
    _title_callback: '\Drupal\myeventlane_donations\Controller\VendorMelContributionBillingController::invoiceTitle'
  requirements:
    _custom_access: 'myeventlane_donations.mel_invoice_access:accessInvoice'
    invoice: \d+
  options:
    _maintenance_access: FALSE
    parameters:
      invoice:
        type: integer

myeventlane_donations.vendor_mel_invoice_pay:
  path: '/vendor/billing/mel-contributions/{invoice}/pay'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelContributionBillingController::invoicePay'
  requirements:
    _custom_access: 'myeventlane_donations.mel_invoice_access:accessInvoice'
    invoice: \d+
  options:
    _maintenance_access: FALSE
    parameters:
      invoice:
        type: integer

myeventlane_donations.vendor_mel_save_payment_method:
  path: '/vendor/billing/mel-contributions/payment-method'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelSavePaymentMethodController::savePaymentMethod'
    _title: 'Save payment method'
  requirements:
    _custom_access: 'myeventlane_donations.donation_access:vendorAccess'
  options:
    _maintenance_access: FALSE

myeventlane_donations.vendor_mel_remove_payment_method:
  path: '/vendor/billing/mel-contributions/payment-method/remove'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelSavePaymentMethodController::removePaymentMethod'
    _title: 'Remove payment method'
  requirements:
    _custom_access: 'myeventlane_donations.donation_access:vendorAccess'
  options:
    _maintenance_access: FALSE

# Admin: MEL vendor % billing overview + manual invoice run.
myeventlane_donations.admin_mel_billing:
  path: '/admin/reports/myeventlane/mel-vendor-billing'
  defaults:
    _controller: '\Drupal\myeventlane_donations\Controller\VendorMelBillingAdminController::overview'
    _title: 'MEL vendor contribution billing'
  requirements:
    _permission: 'administer myeventlane donations'
  options:
    _admin_route: TRUE

