# Parent configuration section for all MyEventLane settings.
myeventlane_core.config:
  path: '/admin/config/myeventlane'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'MyEventLane'
  requirements:
    _permission: 'administer myeventlane'
  options:
    _admin_route: TRUE

# General platform settings.
myeventlane_core.settings:
  path: '/admin/config/myeventlane/general'
  defaults:
    _form: '\Drupal\myeventlane_core\Form\GeneralSettingsForm'
    _title: 'General settings'
  requirements:
    _permission: 'administer myeventlane'
  options:
    _admin_route: TRUE

# My Categories page.
myeventlane_core.my_categories:
  path: '/my-categories'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\MyCategoriesController::myCategories'
    _title: 'My Categories'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'

# Customer onboarding routes (step-by-step flow).
myeventlane_core.onboard.account:
  path: '/onboard/account'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\CustomerOnboardAccountController::account'
    _title: 'Create your account'
  requirements:
    _permission: 'access content'
  options:
    _maintenance_access: FALSE

myeventlane_core.onboard.explore:
  path: '/onboard/explore'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\CustomerOnboardExploreController::explore'
    _title: 'How MyEventLane works'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    _maintenance_access: FALSE

myeventlane_core.onboard.first_action:
  path: '/onboard/first-action'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\CustomerOnboardFirstActionController::firstAction'
    _title: 'Find your first event'
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    _maintenance_access: FALSE

myeventlane_core.onboard.my_tickets:
  path: '/onboard/my-tickets'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\CustomerOnboardMyTicketsController::myTickets'
    _title: "You're all set!"
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
  options:
    _maintenance_access: FALSE

# Onboarding state collection (admin).
entity.myeventlane_onboarding_state.collection:
  path: '/admin/config/myeventlane/onboarding'
  defaults:
    _entity_list: 'myeventlane_onboarding_state'
    _title: 'Onboarding states'
  requirements:
    _permission: 'administer myeventlane onboarding'
  options:
    _admin_route: TRUE

# Custom error routes.
myeventlane_core.error_403:
  path: '/mel/403'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\ErrorController::accessDenied'
    _title: 'Access denied'
  requirements:
    _access: 'TRUE'

myeventlane_core.error_404:
  path: '/mel/404'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\ErrorController::pageNotFound'
    _title: 'Page not found'
  requirements:
    _access: 'TRUE'

myeventlane_core.health:
  path: '/health'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\HealthController::check'
  requirements:
    _access: 'TRUE'
  options:
    _maintenance_access: TRUE

# Log out ticket-buyer session so organiser can use /user/login (vendor destination).
myeventlane_core.organiser_login_switch:
  path: '/user/switch-for-organiser'
  defaults:
    _controller: '\Drupal\myeventlane_core\Controller\OrganiserLoginSwitchController::switchAccount'
    _title: 'Switch account'
  requirements:
    _user_is_logged_in: 'TRUE'

# Category discovery chip listing fragment (AJAX; reuses upcoming_events displays).
myeventlane_core.event_filter:
  path: '/mel/filter-events'
  defaults:
    _controller: 'myeventlane_core.event_filter_controller:filter'
  requirements:
    _permission: 'access content'
