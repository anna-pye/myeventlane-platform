services:

  myeventlane_core.platform_fee_settings:
    class: Drupal\myeventlane_core\Service\PlatformFeeSettings
    arguments:
      - '@config.factory'
      - '@string_translation'

  myeventlane_core.entity_id_normalizer:
    class: Drupal\myeventlane_core\Service\EntityIdNormalizer

  myeventlane_core.event_save_count:
    class: Drupal\myeventlane_core\Service\EventSaveCountService
    arguments: ['@entity_type.manager']

  myeventlane_core.vendor_follow:
    class: Drupal\myeventlane_core\Service\VendorFollowService
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_core'

  myeventlane_core.discovery_attribution_sources:
    class: Drupal\myeventlane_core\Service\DiscoveryAttributionSources

  myeventlane_core.discovery_surface_analytics:
    class: Drupal\myeventlane_core\Service\DiscoverySurfaceAnalyticsService
    arguments:
      - '@myeventlane_core.analytics'
      - '@string_translation'

  myeventlane_core.analytics:
    class: Drupal\myeventlane_core\Service\AnalyticsService
    arguments:
      - '@database'
      - '@current_user'
      - '@datetime.time'
      - '@logger.channel.myeventlane_core'
      - '@myeventlane_core.discovery_attribution_sources'

  myeventlane_core.discovery_analytics_page_attachments:
    class: Drupal\myeventlane_core\Service\DiscoveryAnalyticsPageAttachments
    arguments:
      - '@current_route_match'
      - '@path.matcher'

  myeventlane_core.event_viewer_count:
    class: Drupal\myeventlane_core\Service\EventViewerCountService
    arguments: ['@state', '@datetime.time']

  myeventlane_core.event_interest:
    class: Drupal\myeventlane_core\Service\EventInterestService
    arguments: ['@datetime.time']

  myeventlane_core.event_recommendation:
    class: Drupal\myeventlane_core\Service\EventRecommendationService
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@myeventlane_core.event_save_count'
      - '@myeventlane_core.event_viewer_count'
      - '@myeventlane_core.event_state_resolver'
      - '@string_translation'
      - '@current_route_match'

  myeventlane_core.event_filter_controller:
    class: Drupal\myeventlane_core\Controller\EventFilterController
    arguments:
      - '@renderer'
      - '@logger.channel.myeventlane_core'

  myeventlane_core.optional_service_resolver:
    class: Drupal\myeventlane_core\Service\OptionalServiceResolver

  myeventlane_core.route_helper:
    class: Drupal\myeventlane_core\Service\RouteHelper
    arguments:
      - '@router.route_provider'
      - '@url_generator'

  myeventlane_core.date_formatter:
    class: Drupal\myeventlane_core\Service\DateFormatter
    arguments:
      - '@datetime.time'
      - '@date.formatter'
      - '@language_manager'

  myeventlane_core.stripe:
    class: Drupal\myeventlane_core\Service\StripeService
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@logger.factory'

  myeventlane_core.raw_card_data_guard:
    class: Drupal\myeventlane_core\EventSubscriber\RawCardDataRequestGuard
    arguments:
      - '@logger.channel.myeventlane_core'
    tags:
      - { name: event_subscriber }

  logger.channel.myeventlane_core:
    parent: logger.channel_base
    arguments: ['myeventlane_core']

  myeventlane_core.category_digest_generator:
    class: Drupal\myeventlane_core\Service\CategoryDigestGenerator
    arguments:
      - '@entity_type.manager'
      - '@plugin.manager.mail'
      - '@renderer'
      - '@flag'
      - '@?myeventlane_boost.manager'
      - '@datetime.time'

  myeventlane_core.category_digest_cron:
    class: Drupal\myeventlane_core\Service\CategoryDigestCron
    arguments:
      - '@myeventlane_core.category_digest_generator'
      - '@queue'

  myeventlane_core.category_digest_queue:
    class: Drupal\myeventlane_core\Queue\CategoryDigestQueue
    arguments:
      - '@myeventlane_core.category_digest_generator'
      - '@entity_type.manager'
    tags:
      - { name: queue_worker, queue_name: mel_category_digest, cron: 60 }

  myeventlane_core.domain_detector:
    class: Drupal\myeventlane_core\Service\DomainDetector
    arguments:
      - '@request_stack'
      - '@config.factory'

  myeventlane_core.mel_destination_normalizer:
    class: Drupal\myeventlane_core\Service\MelDestinationNormalizer
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@config.factory'
      - '@module_handler'
      - '@request_stack'
      - '@logger.channel.myeventlane_core'

  myeventlane_core.vendor_domain_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\VendorDomainSubscriber
    arguments:
      $domainDetector: '@myeventlane_core.domain_detector'
      $currentUser: '@current_user'
      $configFactory: '@config.factory'
      $loggerFactory: '@logger.factory'
    tags:
      - { name: event_subscriber }

  myeventlane_core.vendor_logout_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\VendorLogoutRedirectSubscriber
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@logger.channel.myeventlane_core'
    tags:
      - { name: event_subscriber }

  # Disabled: avoids replacing user.login RedirectResponse before session commit (see myeventlane_auth session-staged hub).
  myeventlane_core.vendor_post_login_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\VendorPostLoginRedirectSubscriber
    arguments:
      $currentUser: '@current_user'
      $domainDetector: '@myeventlane_core.domain_detector'
      $logger: '@logger.channel.myeventlane_core'
      $destinationNormalizer: '@myeventlane_core.mel_destination_normalizer'

  myeventlane_core.vendor_host_auth_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\VendorHostAuthRedirectSubscriber
    arguments:
      $domainDetector: '@myeventlane_core.domain_detector'
      $currentUser: '@current_user'
      $logger: '@logger.channel.myeventlane_core'
      $destinationNormalizer: '@myeventlane_core.mel_destination_normalizer'
    tags:
      - { name: event_subscriber }

  myeventlane_core.vendor_login_destination_normalizer:
    class: Drupal\myeventlane_core\Service\VendorLoginDestinationNormalizer
    arguments:
      $configFactory: '@config.factory'
      $destinationNormalizer: '@myeventlane_core.mel_destination_normalizer'

  myeventlane_core.public_vendor_login_conflict_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\PublicVendorLoginConflictSubscriber
    arguments:
      $domainDetector: '@myeventlane_core.domain_detector'
      $currentUser: '@current_user'
      $normalizer: '@myeventlane_core.vendor_login_destination_normalizer'
      $logger: '@logger.channel.myeventlane_core'
    tags:
      - { name: event_subscriber }

  myeventlane_core.vendor_console_gate_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\VendorConsoleGateRedirectSubscriber
    arguments:
      $domainDetector: '@myeventlane_core.domain_detector'
      $currentUser: '@current_user'
      $logger: '@logger.channel.myeventlane_core'
      $configFactory: '@config.factory'
    tags:
      - { name: event_subscriber }

  myeventlane_core.vendor_theme_negotiator:
    class: Drupal\myeventlane_core\Theme\VendorThemeNegotiator
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@theme_handler'
    tags:
      - { name: theme_negotiator, priority: 2000 }

  myeventlane_core.route_theme_negotiator:
    class: Drupal\myeventlane_core\Theme\RouteThemeNegotiator
    tags:
      - { name: theme_negotiator, priority: 1500 }

  myeventlane_core.admin_theme_negotiator:
    class: Drupal\myeventlane_core\Theme\AdminThemeNegotiator
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@config.factory'
      - '@theme_handler'
    tags:
      - { name: theme_negotiator, priority: 2100 }

  myeventlane_core.mel_admin_shell_builder:
    class: Drupal\myeventlane_core\Service\MelAdminShellBuilder
    arguments:
      - '@plugin.manager.block'
      - '@logger.channel.myeventlane_core'
      - '@string_translation'

  myeventlane_core.admin_domain_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\AdminDomainRedirectSubscriber
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
    tags:
      - { name: event_subscriber }

  myeventlane_core.category_color:
    class: Drupal\myeventlane_core\Service\CategoryColorService

  myeventlane_core.event_category_url:
    class: Drupal\myeventlane_core\Service\EventCategoryUrlService
    arguments:
      - '@entity_type.manager'
      - '@cache.data'
      - '@datetime.time'

  myeventlane_core.event_category_canonical_redirect_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\EventCategoryCanonicalRedirectSubscriber
    arguments:
      - '@myeventlane_core.event_category_url'
      - '@?path_alias.manager'
      - '@logger.channel.myeventlane_core'
    tags:
      - { name: event_subscriber }

  myeventlane_core.event_category_request_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\EventCategoryRequestSubscriber
    arguments:
      - '@myeventlane_core.event_category_url'
    tags:
      - { name: event_subscriber }

  myeventlane_core.front_category_stats:
    class: Drupal\myeventlane_core\Service\FrontCategoryStatsService
    arguments:
      - '@entity_type.manager'
      - '@cache.data'
      - '@datetime.time'
      - '@myeventlane_core.category_color'
      - '@config.factory'
      - '@myeventlane_core.event_category_url'

  myeventlane_core.homepage_location:
    class: Drupal\myeventlane_core\Service\HomepageLocationService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@database'

  myeventlane_core.homepage_popularity:
    class: Drupal\myeventlane_core\Service\HomepagePopularityService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@?myeventlane_boost.manager'

  myeventlane_core.homepage_organiser:
    class: Drupal\myeventlane_core\Service\HomepageOrganiserService
    arguments:
      - '@entity_type.manager'
      - '@cache.data'
      - '@datetime.time'

  myeventlane_core.staging_security_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\StagingSecuritySubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }

  myeventlane_core.cart_page_route_subscriber:
    class: Drupal\myeventlane_core\EventSubscriber\CartPageRouteSubscriber
    tags:
      - { name: event_subscriber }

  myeventlane_core.entity_view_display_presave:
    class: Drupal\myeventlane_core\Service\EntityViewDisplayPresave
    arguments:
      - '@entity_type.manager'
      - '@cache_tags.invalidator'
      - '@logger.factory'

  myeventlane_core.event_state_resolver:
    class: Drupal\myeventlane_core\Service\EventStateResolver
    arguments:
      - '@logger.channel.myeventlane_core'
      - '@?myeventlane_boost.manager'

  myeventlane_core.ticket_label_resolver:
    class: Drupal\myeventlane_core\Service\TicketLabelResolver

  myeventlane_core.display_name_resolver:
    class: Drupal\myeventlane_core\Service\DisplayNameResolver
    arguments:
      - '@entity_type.manager'

  myeventlane_core.language_style:
    class: Drupal\myeventlane_core\Service\LanguageStyleService

  myeventlane_onboarding.manager:
    class: Drupal\myeventlane_core\Service\OnboardingManager
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@lock'
      - '@current_user'
      - '@datetime.time'
      - '@?workspaces.manager'

  # Canonical implementation lives in core so the autoload namespace is registered for
  # every bootstrap (Drupal only adds disabled modules' PSR-4 when they are enabled).
  myeventlane_surface.state_readiness_helper:
    class: Drupal\myeventlane_core\MelReadinessHelper
    arguments: ['@string_translation']

  # Same rationale as state_readiness_helper: checkout/account depend on this id while
  # myeventlane_surface may be disabled on some envs until config is aligned.
  myeventlane_surface.governed_operational_templates:
    class: Drupal\myeventlane_core\GovernedOperationalTemplates
    arguments: ['@myeventlane_surface.state_readiness_helper']
