services:
  myeventlane_account.event_review_access:
    class: Drupal\myeventlane_account\Access\EventReviewRouteAccessCheck
    arguments:
      - '@config.factory'

  myeventlane_account.customer_hub_data_builder:
    class: Drupal\myeventlane_account\Service\CustomerHubDataBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_surface.state_readiness_helper'
      - '@file_system'

  myeventlane_account.account_links:
    class: Drupal\myeventlane_account\Service\AccountLinksService
    arguments:
      - '@module_handler'
      - '@current_user'
      - '@current_route_match'

  myeventlane_account.customer_account_hero_builder:
    class: Drupal\myeventlane_account\Service\CustomerAccountHeroBuilder
    arguments:
      - '@myeventlane_surface.state_resolver'
      - '@myeventlane_surface.state_registry'
      - '@myeventlane_surface.state_readiness_helper'
      - '@string_translation'

  myeventlane_account.customer_route_redirect_subscriber:
    class: Drupal\myeventlane_account\EventSubscriber\CustomerAccountRouteRedirectSubscriber
    arguments:
      - '@current_user'
      - '@current_route_match'
    tags:
      - { name: event_subscriber }
