services:
  logger.channel.myeventlane_messaging:
    parent: logger.channel_base
    arguments: ['myeventlane_messaging']

  myeventlane_messaging.message_renderer:
    class: Drupal\myeventlane_messaging\Service\MessageRenderer
    arguments:
      - '@twig'
      - '@renderer'

  myeventlane_messaging.mel_email_layout:
    class: Drupal\myeventlane_messaging\Service\MelEmailLayoutService
    arguments:
      - '@renderer'
      - '@logger.channel.myeventlane_messaging'

  myeventlane_messaging.message_storage:
    class: Drupal\myeventlane_messaging\Service\MessageStorage
    arguments:
      - '@database'

  myeventlane_messaging.message_preference_storage:
    class: Drupal\myeventlane_messaging\Service\MessagePreferenceStorage
    arguments:
      - '@database'

  myeventlane_messaging.delivery.drupal_mail:
    class: Drupal\myeventlane_messaging\Service\Delivery\DrupalMailProvider
    arguments:
      - '@plugin.manager.mail'
      - '@logger.channel.myeventlane_messaging'

  myeventlane_messaging.delivery.postmark:
    class: Drupal\myeventlane_messaging\Service\Delivery\PostmarkDeliveryProvider
    arguments:
      - '@http_client_factory'
      - '@config.factory'
      - '@logger.channel.myeventlane_messaging'

  myeventlane_messaging.delivery_provider_manager:
    class: Drupal\myeventlane_messaging\Service\Delivery\DeliveryProviderManager
    arguments:
      - '@myeventlane_messaging.delivery.drupal_mail'
      - '@myeventlane_messaging.delivery.postmark'
      - '@config.factory'

  myeventlane_messaging.vendor_brand_resolver:
    class: Drupal\myeventlane_messaging\Service\VendorBrandResolver
    arguments:
      - '@config.factory'
      - '@myeventlane_vendor.current_vendor_resolver'
      - '@file_url_generator'

  myeventlane_messaging.utm_linker:
    class: Drupal\myeventlane_messaging\Service\UtmLinker

  myeventlane_messaging.order_confirmation_attachment_resolver:
    class: Drupal\myeventlane_messaging\Service\OrderConfirmationAttachmentResolver
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_messaging'
      - '@?myeventlane_tickets.ticket_pdf_generator'

  myeventlane_messaging.manager:
    class: Drupal\myeventlane_messaging\Service\MessagingManager
    arguments:
      - '@config.factory'
      - '@language_manager'
      - '@queue'
      - '@logger.channel.myeventlane_messaging'
      - '@myeventlane_messaging.message_renderer'
      - '@myeventlane_messaging.message_storage'
      - '@myeventlane_messaging.message_preference_storage'
      - '@myeventlane_messaging.delivery_provider_manager'
      - '@entity_type.manager'
      - '@myeventlane_messaging.utm_linker'
      - '@myeventlane_messaging.vendor_brand_resolver'
      - '@?myeventlane_pro.vendor_comms_resolver'
      - '@myeventlane_messaging.order_confirmation_attachment_resolver'

  myeventlane_messaging.order_confirmation_queue:
    class: Drupal\myeventlane_messaging\Service\OrderConfirmationQueueBuilder
    arguments:
      $entityTypeManager: '@entity_type.manager'
      $ticketLabelResolver: '@?myeventlane_core.ticket_label_resolver'
      $fileUrlGenerator: '@file_url_generator'
      $messagingManager: '@myeventlane_messaging.manager'
      $logger: '@logger.channel.myeventlane_messaging'
      $domainDetector: '@myeventlane_core.domain_detector'
      $orderPricingBreakdown: '@myeventlane_checkout_flow.order_pricing_breakdown'
      $taxInvoicePresentation: '@myeventlane_checkout_flow.tax_invoice_presentation'
      $icsGenerator: '@?myeventlane_rsvp.ics_generator'

  myeventlane_messaging.scheduler.boost:
    class: Drupal\myeventlane_messaging\Scheduler\BoostReminderScheduler
    arguments:
      - '@logger.channel.myeventlane_messaging'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@queue'
      - '@date.formatter'
      - '@?myeventlane_boost.manager'
      - '@myeventlane_messaging.manager'

  myeventlane_messaging.scheduler.cart:
    class: Drupal\myeventlane_messaging\Scheduler\CartAbandonedScheduler
    arguments:
      - '@logger.channel.myeventlane_messaging'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@queue'
      - '@state'
      - '@myeventlane_messaging.manager'
      - '@myeventlane_core.domain_detector'

  myeventlane_messaging.scheduler.event:
    class: Drupal\myeventlane_messaging\Scheduler\EventReminderScheduler
    arguments:
      - '@logger.channel.myeventlane_messaging'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@queue'
      - '@state'
      - '@myeventlane_messaging.manager'
      - '@date.formatter'

  myeventlane_messaging.event_reminder_scheduler:
    class: Drupal\myeventlane_messaging\Service\EventReminderScheduler
    arguments:
      - '@entity_type.manager'
      - '@queue'
      - '@datetime.time'
      - '@logger.channel.myeventlane_messaging'
      - '@myeventlane_messaging.manager'
      - '@date.formatter'
      - '@?myeventlane_rsvp.ics_generator'
      - '@myeventlane_core.domain_detector'

  myeventlane_messaging.unsubscribe_controller:
    class: Drupal\myeventlane_messaging\Controller\UnsubscribeController
    arguments:
      - '@myeventlane_messaging.message_preference_storage'
      - '@config.factory'
      - '@datetime.time'

  myeventlane_messaging.order_placed_subscriber:
    class: Drupal\myeventlane_messaging\EventSubscriber\OrderPlacedSubscriber
    arguments:
      $messagingManager: '@myeventlane_messaging.manager'
      $logger: '@logger.channel.myeventlane_messaging'
      $orderConfirmationQueue: '@myeventlane_messaging.order_confirmation_queue'
    tags:
      - { name: event_subscriber }

  myeventlane_messaging.order_paid_invoice_subscriber:
    class: Drupal\myeventlane_messaging\EventSubscriber\OrderPaidInvoiceSubscriber
    arguments:
      $messagingManager: '@myeventlane_messaging.manager'
      $logger: '@logger.channel.myeventlane_messaging'
      $dateFormatter: '@date.formatter'
      $time: '@datetime.time'
      $entityTypeManager: '@entity_type.manager'
      $taxInvoicePresentation: '@myeventlane_checkout_flow.tax_invoice_presentation'
    tags:
      - { name: event_subscriber }

  myeventlane_messaging.order_paid_confirmation_pdf_recovery_subscriber:
    class: Drupal\myeventlane_messaging\EventSubscriber\OrderPaidConfirmationPdfRecoverySubscriber
    arguments:
      $orderConfirmationQueue: '@myeventlane_messaging.order_confirmation_queue'
      $messageStorage: '@myeventlane_messaging.message_storage'
      $entityTypeManager: '@entity_type.manager'
      $state: '@state'
      $logger: '@logger.channel.myeventlane_messaging'
    tags:
      - { name: event_subscriber }

  myeventlane_messaging.resend_order_access:
    class: Drupal\myeventlane_messaging\Access\ResendOrderConfirmationAccess
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_tickets.event_access'
