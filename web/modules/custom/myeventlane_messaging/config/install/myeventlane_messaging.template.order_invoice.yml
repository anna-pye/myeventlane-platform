enabled: true
subject: '{{ document_title|default("Receipt") }} – Order #{{ order_number }}'
body_html: |
  <div style="font-family:Arial,Helvetica,sans-serif;color:#293241;font-size:14px;line-height:1.45;">
    <h1 style="font-size:24px;line-height:1.2;margin:0 0 12px;">{{ document_title|default('Receipt') }}</h1>
    <p style="margin:0 0 10px;">{% if first_name|default('') %}Hi {{ first_name }},{% else %}Hello,{% endif %}</p>
    <p style="margin:0 0 12px;">Thank you for your payment. Your receipt details are below.</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:0 0 14px;">
      <tr><td style="padding:3px 0;"><strong>Order number</strong></td><td align="right">{{ order_number }}</td></tr>
      <tr><td style="padding:3px 0;"><strong>Invoice date</strong></td><td align="right">{{ invoice_date_short|default(invoice_date) }}</td></tr>
    </table>
    {% for event in events|default([]) %}<p style="margin:0 0 12px;"><strong>Event:</strong> {{ event.title }}</p>{% endfor %}
    <div style="page-break-inside:avoid;break-inside:avoid;margin:0 0 12px;">
      <h2 style="font-size:17px;margin:0 0 4px;">Tickets and organiser charges</h2>
      <p style="margin:0;"><strong>Supplier:</strong> {{ vendor_name }}<br><strong>ABN:</strong> {{ vendor_abn ?: 'ABN not provided' }}</p>
    </div>
    <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px;">
      <thead><tr style="border-bottom:1px solid #cccccc;">
        <th align="left" style="padding:6px 2px;">Description</th><th align="center">Qty</th><th align="right">Unit price</th>
        {% if invoice_lines_include_gst_column|default(false) %}<th align="right">{{ organiser_gst_inclusive|default(false) ? 'GST included' : 'GST' }}</th>{% endif %}<th align="right">Total</th>
      </tr></thead>
      <tbody>{% for row in line_items|default(invoice_lines|default([])) %}
        <tr style="border-bottom:1px solid #eeeeee;page-break-inside:avoid;"><td style="padding:8px 2px;">{{ row.title }}</td><td align="center">{{ row.quantity }}</td><td align="right">{{ row.unit_price }}</td>
        {% if invoice_lines_include_gst_column|default(false) %}<td align="right">{{ row.gst|default('—') }}</td>{% endif %}<td align="right">{{ row.line_total }}</td></tr>
      {% endfor %}</tbody>
    </table>
    {% for fee in fee_lines|default(invoice_fee_lines|default([])) %}
      <table role="presentation" width="100%" style="margin:6px 0;"><tr><td>{{ fee.label }}</td><td align="right">{{ fee.amount }}</td></tr></table>
    {% endfor %}
    {% if order_total_gst %}<p style="margin:8px 0 14px;font-size:13px;">{{ organiser_gst_inclusive|default(false) ? 'GST included in organiser charges' : 'Organiser GST' }}: <strong>{{ order_total_gst }}</strong></p>{% endif %}
    {% if platform_fee_lines|default([])|length > 0 %}
      <div style="page-break-inside:avoid;break-inside:avoid;margin:14px 0;padding-top:10px;border-top:1px solid #dddddd;">
        <h2 style="font-size:17px;margin:0 0 4px;">MyEventLane platform charges</h2>
        <p style="margin:0 0 6px;"><strong>Supplier:</strong> {{ (platform_name|default('')) ?: 'My EventLane' }}<br><strong>ABN:</strong> {{ (platform_abn|default('')) ?: 'ABN not provided' }}</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">{% for fee in platform_fee_lines %}
          <tr><td style="padding:3px 0;">{{ fee.label }}</td><td align="right"><strong>{{ fee.amount }}</strong></td></tr>
          <tr><td style="padding:3px 0;font-size:13px;">GST included in this fee</td><td align="right" style="font-size:13px;">{{ fee.gst }}</td></tr>
        {% endfor %}</table>
      </div>
    {% endif %}
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:14px 0;page-break-inside:avoid;border-top:2px solid #dddddd;">
      <tr><td style="padding:8px 0;">Order total</td><td align="right">{{ order_total|default(total_paid) }}</td></tr>
      {% if amount_paid|default('') %}<tr><td style="padding:4px 0;font-size:18px;"><strong>Amount paid</strong></td><td align="right" style="font-size:18px;"><strong>{{ amount_paid }}</strong></td></tr>{% endif %}
      {% if balance_due|default('') %}<tr><td style="padding:4px 0;">Balance due</td><td align="right">{{ balance_due }}</td></tr>{% endif %}
    </table>
    {% if is_tax_invoice %}
      <p style="font-size:12px;margin:12px 0;">This document is a tax invoice for the GST-bearing supplier charges identified above. Organiser GST reflects tax recorded when the order was placed.</p>
    {% else %}<p style="font-size:12px;margin:12px 0;">No GST was recorded on this order.</p>{% endif %}
    <p style="font-size:12px;margin:12px 0 0;">Please retain this receipt for your records.</p>
  </div>
utm:
  enable: true
  params:
    utm_source: email
    utm_medium: transactional
    utm_campaign: order_invoice
