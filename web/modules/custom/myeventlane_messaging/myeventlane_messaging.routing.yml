# Postmark delivery webhook — public endpoint, secret-verified in controller.
myeventlane_messaging.postmark_webhook_delivery:
  path: '/webhooks/postmark/delivery'
  defaults:
    _controller: '\Drupal\myeventlane_messaging\Controller\PostmarkWebhookController::delivery'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# Postmark bounce webhook — public endpoint, secret-verified in controller.
myeventlane_messaging.postmark_webhook_bounce:
  path: '/webhooks/postmark/bounce'
  defaults:
    _controller: '\Drupal\myeventlane_messaging\Controller\PostmarkWebhookController::bounce'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# Unsubscribe endpoint for email preferences.
myeventlane_messaging.unsubscribe:
  path: '/email/unsubscribe/{uid}/{ts}/{h}'
  defaults:
    _controller: 'myeventlane_messaging.unsubscribe_controller:unsubscribe'
    _title: 'Email preferences'
  requirements:
    _permission: 'access content'

# Admin settings page.
myeventlane_messaging.settings:
  path: '/admin/config/myeventlane/messaging'
  defaults:
    _form: '\Drupal\myeventlane_messaging\Form\MessagingSettingsForm'
    _title: 'Messaging settings'
  requirements:
    _permission: 'administer myeventlane messaging'
  options:
    _admin_route: TRUE

myeventlane_messaging.resend_order_confirmation:
  path: '/admin/myeventlane/orders/{commerce_order}/resend-confirmation'
  defaults:
    _controller: '\Drupal\myeventlane_messaging\Controller\ResendOrderEmailController::resend'
    _title: 'Resend confirmation email'
  requirements:
    _user_is_logged_in: 'TRUE'
    _custom_access: 'myeventlane_messaging.resend_order_access:access'
    commerce_order: \d+
  options:
    parameters:
      commerce_order:
        type: entity:commerce_order
    _admin_route: TRUE
