myeventlane_pro.settings:
  type: config_object
  label: 'MyEventLane Pro settings'
  mapping:
    trial_days:
      type: integer
      label: 'Trial days'
    pro_price:
      type: integer
      label: 'Displayed Pro price'
    pro_variation_sku:
      type: string
      label: 'Pro subscription variation SKU'
    grace_days:
      type: integer
      label: 'Grace period days after payment failure'
    pro_boost_days:
      type: integer
      label: 'Included Boost days per eligible event'
    upgrade_cta_enabled:
      type: boolean
      label: 'Show upgrade CTA to non-Pro organisers'
    cancel_request_enabled:
      type: boolean
      label: 'Enable cancellation request flow'
    billing_support_url:
      type: string
      label: 'Billing support URL'
    billing_portal_enabled:
      type: boolean
      label: 'Enable Stripe Customer Billing Portal redirect'
    webhook_audit_enabled:
      type: boolean
      label: 'Enable webhook audit logging'
    subscription_webhook_secret:
      type: string
      label: 'Stripe subscription webhook signing secret (whsec_…).'
    abandoned_cart:
      type: mapping
      label: 'Abandoned cart'
      mapping:
        enabled:
          type: boolean
          label: 'Enabled'
        delay_wave_1:
          type: integer
          label: 'Wave 1 delay'
        delay_wave_2:
          type: integer
          label: 'Wave 2 delay'

# MEL Pro uses the Commerce Stripe Payment Element configuration unchanged,
# adding only Commerce's zero-balance payment-method capability marker.
commerce_payment.commerce_payment_gateway.plugin.mel_pro_stripe_payment_element:
  type: commerce_payment.commerce_payment_gateway.plugin.stripe_payment_element

myeventlane_pro.vendor_comms.*:
  type: config_entity
  label: 'Pro vendor comms'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    store_id:
      type: integer
      label: 'Store ID'
    enabled:
      type: boolean
      label: 'Enabled'
    rsvp_body:
      type: text
      label: 'RSVP body'
    ticket_body:
      type: text
      label: 'Ticket body'
    reminder_body:
      type: text
      label: 'Reminder body'
    abandoned_cart_body:
      type: text
      label: 'Abandoned cart body'
    brand_signature:
      type: text
      label: 'Brand signature'
    updated:
      type: integer
      label: 'Updated'
