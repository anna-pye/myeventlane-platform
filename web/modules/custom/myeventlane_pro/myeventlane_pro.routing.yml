myeventlane_pro.overview:
  path: '/vendor/pro'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProOverviewController::overview'
    _title: 'MyEventLane Pro'
  requirements:
    _role: 'vendor'

myeventlane_pro.subscribe:
  path: '/vendor/pro/subscribe'
  defaults:
    _form: '\Drupal\myeventlane_pro\Form\ProSubscribeForm'
    _title: 'Subscribe to Pro'
  requirements:
    _role: 'vendor'

myeventlane_pro.success:
  path: '/vendor/pro/success'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProOverviewController::success'
    _title: 'Welcome to Pro'
  requirements:
    _role: 'vendor'

myeventlane_pro.manage:
  path: '/vendor/pro/manage'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProBillingController::manage'
    _title: 'Manage Pro Subscription'
  requirements:
    _custom_access: '\Drupal\myeventlane_pro\Controller\ProOverviewController::accessProVendor'

myeventlane_pro.billing_portal:
  path: '/vendor/pro/billing-portal'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProBillingController::portal'
    _title: 'Update payment method'
  requirements:
    _custom_access: '\Drupal\myeventlane_pro\Controller\ProOverviewController::accessProVendor'

myeventlane_pro.cancel_request:
  path: '/vendor/pro/cancel'
  defaults:
    _form: '\Drupal\myeventlane_pro\Form\ProCancelRequestForm'
    _title: 'Request to cancel MEL Pro'
  requirements:
    _custom_access: '\Drupal\myeventlane_pro\Controller\ProOverviewController::accessProVendor'

myeventlane_pro.cancel_confirm:
  path: '/vendor/pro/cancel/confirm'
  defaults:
    _form: '\Drupal\myeventlane_pro\Form\ProCancelConfirmForm'
    _title: 'Cancel Pro Subscription'
  requirements:
    _custom_access: '\Drupal\myeventlane_pro\Controller\ProOverviewController::accessProVendor'

myeventlane_pro.branding:
  path: '/vendor/settings/branding'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProBrandingController::settings'
    _title: 'Branding'
  requirements:
    _custom_access: '\Drupal\myeventlane_pro\Controller\ProBrandingController::access'
    _myeventlane_pro_access: 'TRUE'

myeventlane_pro.admin_report:
  path: '/admin/platform/pro'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProAdminReportController::report'
    _title: 'Pro subscriptions'
  requirements:
    _permission: 'view pro reporting'

myeventlane_pro.diagnostics:
  path: '/admin/reports/myeventlane/pro-status'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProDiagnosticsController::diagnostics'
    _title: 'Pro status diagnostics'
  requirements:
    _permission: 'access pro diagnostics'

myeventlane_pro.diagnostics_reconcile_user:
  path: '/admin/reports/myeventlane/pro-status/reconcile/{uid}'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProDiagnosticsController::reconcileUser'
  requirements:
    _permission: 'access pro diagnostics'
    uid: \d+
  options:
    parameters:
      uid:
        type: integer

myeventlane_pro.settings:
  path: '/admin/config/myeventlane/pro'
  defaults:
    _form: '\Drupal\myeventlane_pro\Form\ProSettingsForm'
    _title: 'MyEventLane Pro settings'
  requirements:
    _permission: 'administer myeventlane pro settings'

myeventlane_vendor.message_attendees:
  path: '/vendor/events/{node}/message'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\MessageAttendeesController::message'
    _title: 'Message attendees'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - event

# Public endpoint required by Stripe. Access is intentionally open at the Drupal route
# layer because authenticity is enforced by Stripe signature verification in
# ProSubscriptionWebhookController::handle(). Audit logging only; no Commerce state changes.
myeventlane_pro.subscription_webhook:
  path: '/stripe/webhook/subscription'
  defaults:
    _controller: '\Drupal\myeventlane_pro\Controller\ProSubscriptionWebhookController::handle'
    _title: 'Stripe subscription webhook'
  requirements:
    _access: 'TRUE'
  methods: [POST]

myeventlane_pro.vendor_comms:
  path: '/vendor/pro/settings/comms'
  defaults:
    _form: '\Drupal\myeventlane_pro\Form\ProVendorCommsForm'
    _title: 'Pro email wording'
  requirements:
    _role: 'vendor'
