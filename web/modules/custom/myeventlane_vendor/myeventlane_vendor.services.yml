services:
  myeventlane_vendor.adapter.paragraph:
    class: Drupal\myeventlane_vendor\Adapter\ParagraphAdapter

  myeventlane_vendor.footer_context:
    class: Drupal\myeventlane_vendor\Service\FooterContextService
    arguments:
      - '@current_user'
      - '@myeventlane_vendor.current_vendor_resolver'
      - '@entity_type.manager'
      - '@module_handler'
      - '@logger.channel.myeventlane_vendor'
      - '@cache.default'
      - '@?myeventlane_stripe.vendor_stripe'

  logger.channel.myeventlane_vendor:
    parent: logger.channel_base
    arguments: ['myeventlane_vendor']

  logger.channel.myeventlane_ticket_reconciliation:
    parent: logger.channel_base
    arguments: ['myeventlane_ticket_reconciliation']

  logger.channel.mel_debug:
    parent: logger.channel_base
    arguments: ['mel_debug']

  myeventlane_vendor.access.vendor_console:
    class: Drupal\myeventlane_vendor\Access\VendorConsoleAccess
    arguments:
      - '@myeventlane_onboarding.manager'
      - '@request_stack'
      - '@logger.channel.myeventlane_vendor'

  myeventlane_vendor.current_vendor_resolver:
    class: Drupal\myeventlane_vendor\Service\CurrentVendorResolver
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@logger.channel.myeventlane_vendor'

  myeventlane_vendor.vendor_card_builder:
    class: Drupal\myeventlane_vendor\Service\VendorCardBuilder
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_vendor'
      - '@datetime.time'

  myeventlane_vendor.user_vendor_membership_query:
    class: Drupal\myeventlane_vendor\Service\UserVendorMembershipQuery
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  myeventlane_vendor.event_studio_create:
    class: Drupal\myeventlane_vendor\Service\VendorEventStudioCreateService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@logger.channel.myeventlane_vendor'
      - '@messenger'
      - '@string_translation'

  myeventlane_vendor.event_access_checker:
    class: Drupal\myeventlane_vendor\Service\EventVendorAccessChecker

  myeventlane_vendor.access.vendor_managed_event_console:
    class: Drupal\myeventlane_vendor\Access\VendorManagedEventConsoleAccess
    arguments:
      - '@myeventlane_vendor.access.vendor_console'
      - '@myeventlane_vendor.event_access_checker'

  myeventlane_vendor.vendor_event_removal:
    class: Drupal\myeventlane_vendor\Service\VendorEventRemovalService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@myeventlane_event_studio.save'
      - '@myeventlane_vendor.event_access_checker'
      - '@csrf_token'
      - '@string_translation'
      - '@logger.factory'

  myeventlane_vendor.paid_publish_stripe_gate:
    class: Drupal\myeventlane_vendor\Service\PaidPublishStripeGate
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@logger.channel.myeventlane_vendor'
      - '@string_translation'

  myeventlane_vendor.publish_requirements_gate:
    class: Drupal\myeventlane_vendor\Service\VendorPublishRequirementsGate
    arguments:
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@entity_type.manager'
      - '@myeventlane_onboarding.manager'
      - '@myeventlane_legal.gatekeeper'
      - '@myeventlane_vendor.event_studio_create'
      - '@string_translation'

  myeventlane_vendor.vendor_console_page_preprocess:
    class: Drupal\myeventlane_vendor\Hook\VendorConsolePagePreprocess
    arguments:
      - '@current_route_match'
      - '@string_translation'

  myeventlane_vendor.vendor_store_subscriber:
    class: Drupal\myeventlane_vendor\EventSubscriber\VendorStoreSubscriber
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@myeventlane_onboarding.manager'
      - '@current_user'
    tags:
      - { name: event_subscriber }

  myeventlane_vendor.event_studio_onboarding_gate:
    class: Drupal\myeventlane_vendor\EventSubscriber\EventStudioVendorOnboardingGateSubscriber
    arguments:
      - '@current_user'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@current_route_match'
      - '@logger.channel.myeventlane_vendor'
      - '@module_handler'
    tags:
      - { name: event_subscriber }

  myeventlane_vendor.path_membership_guard:
    class: Drupal\myeventlane_vendor\EventSubscriber\VendorPathMembershipGuardSubscriber
    arguments:
      - '@current_user'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@myeventlane_core.domain_detector'
      - '@config.factory'
      - '@logger.channel.myeventlane_vendor'
    tags:
      - { name: event_subscriber }

  myeventlane_vendor.manage_event_navigation:
    class: Drupal\myeventlane_vendor\Service\ManageEventNavigation

  myeventlane_vendor.service.ticket_sales:
    class: Drupal\myeventlane_vendor\Service\TicketSalesService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_analytics.order_item_classifier'
      - '@database'
      - '@logger.factory'
      - '@myeventlane_vendor.subscription'
      - '@config.factory'
      - '@myeventlane_vendor.user_vendor_membership_query'

  myeventlane_vendor.subscription:
    class: Drupal\myeventlane_vendor\Service\VendorSubscriptionService
    arguments:
      - '@entity_type.manager'
      - '@module_handler'
      - '@logger.channel.myeventlane_vendor'

  myeventlane_vendor.service.rsvp_stats:
    class: Drupal\myeventlane_vendor\Service\RsvpStatsService
    arguments:
      - '@database'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@myeventlane_vendor.user_vendor_membership_query'

  myeventlane_vendor.service.category_audience:
    class: Drupal\myeventlane_vendor\Service\CategoryAudienceService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@myeventlane_core.entity_id_normalizer'
      - '@?myeventlane_event_studio.repository'

  myeventlane_vendor.service.boost_status:
    class: Drupal\myeventlane_vendor\Service\BoostStatusService
    arguments:
      - '@myeventlane_boost.manager'
      - '@entity_type.manager'

  myeventlane_vendor.service.metrics_aggregator:
    class: Drupal\myeventlane_vendor\Service\MetricsAggregator
    arguments:
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@myeventlane_vendor.service.category_audience'
      - '@myeventlane_vendor.service.boost_status'
      - '@myeventlane_metrics.service'
      - '@myeventlane_boost.metrics'
      - '@?myeventlane_donations.service'

  myeventlane_vendor.action_queue_builder:
    class: Drupal\myeventlane_vendor\Service\VendorActionQueueBuilder
    arguments:
      - '@router.route_provider'
      - '@access_manager'
      - '@logger.factory'
      - '@string_translation'

  myeventlane_vendor.event_presentation_alerts:
    class: Drupal\myeventlane_vendor\Service\VendorEventPresentationAlertsBuilder
    arguments:
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_event.ticket_type_manager'
      - '@myeventlane_event.booking_flow_resolver'
      - '@logger.channel.myeventlane_vendor'

  myeventlane_vendor.event_ticket_reconciliation:
    class: Drupal\myeventlane_vendor\Service\EventTicketReconciliationService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_event.ticket_type_manager'
      - '@myeventlane_event.booking_flow_resolver'
      - '@myeventlane_event.ticket_tier_lifecycle'
      - '@commerce_price.currency_formatter'
      - '@logger.channel.myeventlane_ticket_reconciliation'
      - '@string_translation'

  myeventlane_vendor.event_index_view_model_builder:
    class: Drupal\myeventlane_vendor\Service\VendorEventIndexViewModelBuilder
    arguments:
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@entity_type.manager'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@myeventlane_core.event_state_resolver'
      - '@myeventlane_vendor.event_presentation_alerts'
      - '@router.route_provider'
      - '@access_manager'
      - '@datetime.time'
      - '@date.formatter'
      - '@entity_field.manager'
      - '@string_translation'
      - '@logger.factory'
      - '@myeventlane_vendor.vendor_event_removal'

  myeventlane_vendor.dashboard_view_model_builder:
    class: Drupal\myeventlane_vendor\Service\VendorDashboardViewModelBuilder
    arguments:
      - '@myeventlane_vendor.current_vendor_resolver'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@entity_type.manager'
      - '@myeventlane_vendor.service.metrics_aggregator'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@myeventlane_core.event_state_resolver'
      - '@myeventlane_vendor.event_presentation_alerts'
      - '@myeventlane_vendor.action_queue_builder'
      - '@router.route_provider'
      - '@access_manager'
      - '@datetime.time'
      - '@date.formatter'
      - '@string_translation'
      - '@logger.factory'
      - '@myeventlane_vendor.vendor_event_removal'

  myeventlane_vendor.service.event_tabs:
    class: Drupal\myeventlane_vendor\Service\VendorEventTabsService
    arguments:
      - '@myeventlane_event.event_mode_manager'
      - '@module_handler'
      - '@string_translation'
      - '@router.route_provider'
      - '@access_manager'
      - '@current_user'

  myeventlane_vendor.event_workspace_view_model_builder:
    class: Drupal\myeventlane_vendor\Service\VendorEventWorkspaceViewModelBuilder
    arguments:
      - '@myeventlane_core.event_state_resolver'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@myeventlane_vendor.service.event_tabs'
      - '@myeventlane_vendor.event_presentation_alerts'
      - '@router.route_provider'
      - '@access_manager'
      - '@entity_field.manager'
      - '@date.formatter'
      - '@datetime.time'
      - '@string_translation'
      - '@logger.factory'

  # Vendor console controllers as services for DI.
  myeventlane_vendor.controller.vendor_dashboard:
    class: Drupal\myeventlane_vendor\Controller\VendorDashboardController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_vendor.dashboard_view_model_builder'
      - '@router.route_provider'
      - '@myeventlane_vendor.service.rsvp_stats'
      - '@entity_type.manager'
      - '@myeventlane_core.entity_id_normalizer'
      - '@?myeventlane_event_studio.repository'
      - '@myeventlane_vendor.service.boost_status'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@myeventlane_vendor_analytics.vendor_kpi'
      - '@?myeventlane_domain_events.read_model.vendor_metrics'
      - '@?myeventlane_capacity.service'
      - '@myeventlane_onboarding.manager'
      - '@myeventlane_event_state.resolver'
      - '@myeventlane_core.event_state_resolver'
      - '@state'
      - '@logger.channel.mel_debug'
      - '@datetime.time'
      - '@?myeventlane_ai.usage_tracker'
      - '@config.factory'
      - '@?myeventlane_vendor.service.category_audience'
      - '@?myeventlane_pro.event_insight'
      - '@?myeventlane_growth.insight'
      - '@?myeventlane_growth.tracking'
      - '@csrf_token'
      - '@?myeventlane_boost.performance'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_events:
    class: Drupal\myeventlane_vendor\Controller\VendorEventsController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@entity_type.manager'
      - '@form_builder'
      - '@myeventlane_vendor.event_index_view_model_builder'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_create:
    class: Drupal\myeventlane_vendor\Controller\VendorEventCreateController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@logger.channel.myeventlane_vendor']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_overview:
    class: Drupal\myeventlane_vendor\Controller\VendorEventOverviewController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@myeventlane_vendor.service.metrics_aggregator', '@myeventlane_vendor.service.event_tabs', '@myeventlane_event.booking_flow_resolver', '@myeventlane_core.event_state_resolver', '@myeventlane_boost.help_content', '@date.formatter', '@?myeventlane_pro.active_resolver', '@?myeventlane_donations.vendor_mel_pct_contribution', '@?myeventlane_refunds.processor']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.boost_event_export:
    class: Drupal\myeventlane_vendor\Controller\BoostEventExportController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_vendor.service.metrics_aggregator'
      - '@config.factory'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.boost_vendor_export:
    class: Drupal\myeventlane_vendor\Controller\BoostVendorExportController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_vendor.service.metrics_aggregator'
      - '@entity_type.manager'
      - '@config.factory'
      - '@datetime.time'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_orders:
    class: Drupal\myeventlane_vendor\Controller\VendorEventOrdersController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@entity_type.manager'
      - '@date.formatter'
      - '@myeventlane_vendor.service.event_tabs'
      - '@myeventlane_core.route_helper'
      - '@logger.channel.myeventlane_vendor'
      - '@?myeventlane_refunds.processor'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_order_view:
    class: Drupal\myeventlane_vendor\Controller\VendorEventOrderViewController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@entity_type.manager', '@date.formatter', '@database', '@myeventlane_vendor.service.event_tabs', '@myeventlane_core.ticket_label_resolver', '@myeventlane_event_attendees.vendor_presentation', '@logger.channel.myeventlane_vendor', '@?myeventlane_refunds.processor']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_tickets:
    class: Drupal\myeventlane_vendor\Controller\VendorEventTicketsController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@myeventlane_vendor.service.ticket_sales', '@myeventlane_vendor.service.event_tabs']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_rsvps:
    class: Drupal\myeventlane_vendor\Controller\VendorEventRsvpController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@myeventlane_vendor.service.rsvp_stats', '@entity_type.manager', '@myeventlane_vendor.service.event_tabs']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_analytics:
    class: Drupal\myeventlane_vendor\Controller\VendorEventAnalyticsController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@entity_type.manager', '@myeventlane_vendor.service.metrics_aggregator', '@myeventlane_vendor.service.event_tabs', '@myeventlane_event.ticket_tier_lifecycle', '@myeventlane_commerce.ticket_tier_analytics', '@access_manager', '@logger.factory', '@?myeventlane_pro.active_resolver']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_settings:
    class: Drupal\myeventlane_vendor\Controller\VendorEventSettingsController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@myeventlane_vendor.service.event_tabs']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_attendees:
    class: Drupal\myeventlane_vendor\Controller\VendorEventAttendeesController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_event_attendees.manager'
      - '@myeventlane_vendor.service.event_tabs'
      - '@myeventlane_event_attendees.vendor_presentation'
      - '@module_handler'
      - '@?myeventlane_growth.tracking'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_payouts:
    class: Drupal\myeventlane_vendor\Controller\VendorPayoutsController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_vendor.service.ticket_sales'
      - '@entity_type.manager'
      - '@myeventlane_core.entity_id_normalizer'
      - '@?myeventlane_event_studio.repository'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_boost:
    class: Drupal\myeventlane_vendor\Controller\VendorBoostController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@entity_type.manager'
      - '@myeventlane_boost.manager'
      - '@logger.channel.myeventlane_boost'
      - '@myeventlane_boost.help_content'
      - '@myeventlane_event_state.resolver'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_audience:
    class: Drupal\myeventlane_vendor\Controller\VendorAudienceController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@myeventlane_vendor.service.category_audience']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_dashboard_messaging_brand:
    class: Drupal\myeventlane_vendor\Controller\VendorDashboardMessagingBrandController
    arguments: ['@myeventlane_core.domain_detector', '@current_user', '@messenger', '@form_builder', '@entity_type.manager']
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.event_workspace:
    class: Drupal\myeventlane_vendor\Controller\EventWorkspaceController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@logger.channel.myeventlane_vendor'
      - '@request_stack'
      - '@myeventlane_vendor.event_workspace_view_model_builder'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.controller.vendor_event_archive:
    class: Drupal\myeventlane_vendor\Controller\VendorEventArchiveController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_vendor.vendor_event_removal'
      - '@csrf_token'
    tags:
      - { name: controller.service_arguments }

  myeventlane_vendor.theme.negotiator:
    class: Drupal\myeventlane_vendor\Theme\VendorThemeNegotiator
    tags:
      - { name: theme_negotiator, priority: 200 }
