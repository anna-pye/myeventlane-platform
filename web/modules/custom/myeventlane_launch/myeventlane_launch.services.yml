services:
  logger.channel.myeventlane_launch:
    parent: logger.channel_base
    arguments: ['myeventlane_launch']

  logger.channel.myeventlane_monitoring:
    parent: logger.channel_base
    arguments: ['myeventlane_monitoring']

  myeventlane_launch.vendor_dashboard_health:
    class: Drupal\myeventlane_launch\Service\VendorDashboardHealthBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_analytics.conversion'
      - '@myeventlane_vendor.service.metrics_aggregator'
      - '@logger.channel.myeventlane_launch'

  myeventlane_launch.monitoring:
    class: Drupal\myeventlane_launch\Service\MELMonitoringService
    arguments:
      - '@logger.channel.myeventlane_monitoring'

  myeventlane_launch.checkout_guard:
    class: Drupal\myeventlane_launch\Service\CheckoutIdempotencyGuard
    arguments:
      - '@keyvalue'
      - '@logger.channel.myeventlane_launch'

  myeventlane_launch.email_sender:
    class: Drupal\myeventlane_launch\Service\ReliableEmailSender
    arguments:
      - '@queue'
      - '@keyvalue'
      - '@logger.channel.myeventlane_launch'
      - '@myeventlane_launch.monitoring'

  myeventlane_launch.rate_limiter:
    class: Drupal\myeventlane_launch\Service\PlatformRateLimiter
    arguments:
      - '@flood'
      - '@current_user'
      - '@logger.channel.myeventlane_launch'

  myeventlane_launch.event_bridge:
    class: Drupal\myeventlane_launch\Service\LaunchPlatformEventBridge
    arguments:
      - '@myeventlane_launch.monitoring'
      - '@myeventlane_launch.email_sender'
      - '@logger.channel.myeventlane_launch'

  myeventlane_launch.order_completed_subscriber:
    class: Drupal\myeventlane_launch\EventSubscriber\LaunchOrderCompletedSubscriber
    arguments:
      - '@myeventlane_launch.checkout_guard'
      - '@myeventlane_launch.event_bridge'
      - '@myeventlane_launch.monitoring'
      - '@entity_type.manager'
      - '@request_stack'
      - '@logger.channel.myeventlane_launch'
      - '@myeventlane_commerce.ticket_backed_order_item_classifier'
    tags:
      - { name: event_subscriber }

  myeventlane_launch.request_protection_subscriber:
    class: Drupal\myeventlane_launch\EventSubscriber\LaunchRequestProtectionSubscriber
    arguments:
      - '@myeventlane_launch.rate_limiter'
      - '@myeventlane_launch.checkout_guard'
      - '@myeventlane_launch.monitoring'
      - '@logger.channel.myeventlane_launch'
      - '@current_user'
      - '@myeventlane_vendor.user_vendor_membership_query'
    tags:
      - { name: event_subscriber }
