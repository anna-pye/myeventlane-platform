services:
  myeventlane_legal.rsvp_alter:
    class: Drupal\myeventlane_legal\Service\RsvpLegalAlter
    arguments:
      - '@myeventlane_legal.settings'
      - '@myeventlane_legal.version_diff'
      - '@current_user'
      - '@request_stack'

  myeventlane_legal.registration_alter:
    class: Drupal\myeventlane_legal\Form\UserRegisterLegalAlter
    arguments:
      - '@myeventlane_legal.settings'
      - '@current_user'
      - '@datetime.time'
      - '@request_stack'
      - '@logger.factory'

  myeventlane_legal.consent_helper:
    class: Drupal\myeventlane_legal\Service\RsvpSubmissionConsentHelper
    arguments:
      - '@myeventlane_legal.settings'
      - '@datetime.time'
      - '@myeventlane_legal.consent_audit'

  myeventlane_legal.consent_audit:
    class: Drupal\myeventlane_legal\Service\ConsentAuditService
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@request_stack'
      - '@datetime.time'
      - '@myeventlane_legal.settings'
      - '@logger.factory'

  myeventlane_legal.settings:
    class: Drupal\myeventlane_legal\Service\LegalSettingsService
    arguments:
      - '@config.factory'
      - '@logger.factory'
      - '@datetime.time'

  myeventlane_legal.version_diff:
    class: Drupal\myeventlane_legal\Service\ConsentVersionDiffService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_legal.settings'
      - '@current_user'

  myeventlane_legal.gatekeeper:
    class: Drupal\myeventlane_legal\Service\LegalGatekeeper
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_legal.settings'
      - '@current_user'
      - '@logger.factory'
      - '@messenger'
      - '@string_translation'
