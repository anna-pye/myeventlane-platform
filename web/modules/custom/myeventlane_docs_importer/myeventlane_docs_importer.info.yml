name: 'MyEventLane Docs Importer'
type: module
description: 'Imports MEL documentation rows from CSV into help_article and staff_playbook content via Drush.'
core_version_requirement: ^11
package: MyEventLane
dependencies:
  - drupal:node
  - drupal:field
  - drupal:taxonomy
  - drupal:user
  - drupal:text
  - drupal:link
  - drupal:datetime
  - drupal:content_moderation
  - drupal:options
  - drupal:file
  - myeventlane_help_centre:myeventlane_help_centre
  - myeventlane_staff_playbooks:myeventlane_staff_playbooks
