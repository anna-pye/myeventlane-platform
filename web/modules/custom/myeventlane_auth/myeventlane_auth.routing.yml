# Public continuation handoff. Route must be reachable before login; anonymous users
# are redirected to core user.login with destination preserved. Authenticated users
# are redirected by PostAuthRedirectResolver. No sensitive data returned (redirect only).
myeventlane_auth.mel_continue:
  path: '/mel/auth/continue'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\MelContinueController::handoff'
    _title: 'Continue'
  requirements:
    _access: 'TRUE'

myeventlane_auth.post_login:
  path: '/mel/post-login'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\MelPostLoginController::handle'
    _title: 'Welcome to MyEventLane'
  requirements:
    _user_is_logged_in: 'TRUE'

# Public sign-in placeholder. Anonymous-safe static content linking to core login via
# mel_continue. No account or token data exposed.
myeventlane_auth.mel_email_entry:
  path: '/mel/auth/email'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\MelEmailEntryPlaceholderController::build'
    _title: 'Sign in'
  requirements:
    _access: 'TRUE'

# OAuth authorization entry. Must be public so unauthenticated users can start SSO.
# AuthController::login() validates client_id and OAuth params; authorization codes
# are issued only on authorize (requires authenticated session).
myeventlane_auth.login:
  path: '/auth/login'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\AuthController::login'
    _title: 'Sign in'
  requirements:
    _access: 'TRUE'

myeventlane_auth.authorize:
  path: '/auth/authorize'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\AuthController::authorize'
    _title: 'Authorize'
  requirements:
    _user_is_logged_in: 'TRUE'

myeventlane_auth.logout:
  path: '/auth/logout'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\AuthController::logout'
    _title: 'Sign out'
  methods: [GET, POST]
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'

# OAuth token endpoint (authorization_code grant). Route is public; TokenController::token()
# enforces client_id, client_secret, one-time code, and redirect_uri via TokenGrantService.
myeventlane_auth.token:
  path: '/auth/token'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\TokenController::token'
  methods: [POST]
  requirements:
    _access: 'TRUE'

# OAuth refresh endpoint. Route is public; TokenController::refresh() enforces client
# credentials and a valid refresh token (body or HTTP-only cookie).
myeventlane_auth.refresh:
  path: '/auth/refresh'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\TokenController::refresh'
  methods: [POST]
  requirements:
    _access: 'TRUE'

# OAuth userinfo endpoint. Route is public; TokenController::me() requires a valid
# Bearer access token before returning any user profile fields.
myeventlane_auth.me:
  path: '/auth/me'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\TokenController::me'
  methods: [GET]
  requirements:
    _access: 'TRUE'

# OAuth revocation endpoint. Route is public; TokenController::revoke() requires client
# credentials plus refresh token, or a valid Bearer access token for revoke-all.
myeventlane_auth.revoke:
  path: '/auth/revoke'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\TokenController::revoke'
  methods: [POST]
  requirements:
    _access: 'TRUE'

myeventlane_auth.settings:
  path: '/admin/config/system/myeventlane-auth'
  defaults:
    _form: '\Drupal\myeventlane_auth\Form\SettingsForm'
    _title: 'MyEventLane SSO (Auth)'
  requirements:
    _permission: 'administer myeventlane auth'

# Vendor-host SSO callback after auth-host redirect. Route is public; VendorSsoCallbackController
# validates OAuth state (HMAC signed state or legacy session state) and exchanges the
# one-time authorization code before establishing a Drupal session.
myeventlane_auth.vendor_sso_callback:
  path: '/vendor/sso/callback'
  defaults:
    _controller: '\Drupal\myeventlane_auth\Controller\VendorSsoCallbackController::callback'
  requirements:
    _access: 'TRUE'
