services:
  logger.channel.myeventlane_auth:
    parent: logger.channel_base
    arguments: ['myeventlane_auth']

  myeventlane_auth.auth_redirect_validator:
    class: Drupal\myeventlane_auth\Service\AuthRedirectValidator
    arguments:
      - '@config.factory'
      - '@module_handler'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.vendor_sso_state_signer:
    class: Drupal\myeventlane_auth\Service\VendorSsoStateSigner
    arguments:
      - '@datetime.time'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.identity_intent_resolver:
    class: Drupal\myeventlane_auth\Service\IdentityIntentResolver

  myeventlane_auth.post_auth_redirect_resolver:
    class: Drupal\myeventlane_auth\Service\PostAuthRedirectResolver
    arguments:
      - '@myeventlane_auth.identity_intent_resolver'
      - '@myeventlane_core.mel_destination_normalizer'
      - '@url_generator'
      - '@request_stack'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.post_login_router:
    class: Drupal\myeventlane_auth\Service\PostLoginRouter
    arguments:
      - '@myeventlane_onboarding.manager'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@myeventlane_auth.identity_intent_resolver'
      - '@logger.channel.myeventlane_auth'
      - '@myeventlane_core.route_helper'

  myeventlane_auth.customer_identity_bridge:
    class: Drupal\myeventlane_auth\Service\CustomerIdentityBridge
    arguments:
      - '@myeventlane_onboarding.manager'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.customer_order_onboarding_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\CustomerOrderOnboardingSubscriber
    arguments:
      - '@myeventlane_auth.customer_identity_bridge'
      - '@module_handler'
    tags:
      - { name: event_subscriber }

  # Disabled: hub wrap moved to MelPostLoginSessionRedirectSubscriber (request phase after session commit).
  myeventlane_auth.post_login_hub_redirect_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\PostLoginHubRedirectSubscriber
    arguments:
      - '@current_user'
      - '@myeventlane_auth.post_auth_redirect_resolver'

  myeventlane_auth.mel_post_login_session_redirect_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\MelPostLoginSessionRedirectSubscriber
    arguments:
      - '@current_user'
      - '@myeventlane_auth.post_auth_redirect_resolver'
      - '@logger.channel.myeventlane_auth'
    tags:
      - { name: event_subscriber }

  myeventlane_auth.login_url_builder:
    class: Drupal\myeventlane_auth\Service\MelAuthLoginUrlBuilder
    arguments:
      - '@config.factory'
      - '@myeventlane_auth.auth_redirect_validator'
      - '@logger.channel.myeventlane_auth'
      - '@myeventlane_core.domain_detector'
      - '@myeventlane_auth.vendor_sso_state_signer'

  myeventlane_auth.oauth_client_repository:
    class: Drupal\myeventlane_auth\Service\OAuthClientRepository
    arguments:
      - '@config.factory'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.jwt_hs256:
    class: Drupal\myeventlane_auth\Utility\JwtHs256

  myeventlane_auth.token_issuer:
    class: Drupal\myeventlane_auth\Service\TokenIssuer
    arguments:
      - '@myeventlane_auth.jwt_hs256'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.myeventlane_auth'
      - '@entity_type.manager'

  myeventlane_auth.token_grant_service:
    class: Drupal\myeventlane_auth\Service\TokenGrantService
    arguments:
      - '@myeventlane_auth.oauth_client_repository'
      - '@myeventlane_auth.auth_redirect_validator'
      - '@myeventlane_auth.authorization_code_manager'
      - '@myeventlane_auth.refresh_token_manager'
      - '@myeventlane_auth.token_issuer'
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.authorization_code_manager:
    class: Drupal\myeventlane_auth\Service\AuthorizationCodeManager
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.refresh_token_manager:
    class: Drupal\myeventlane_auth\Service\RefreshTokenManager
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.myeventlane_auth'

  myeventlane_auth.cors_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\MelAuthCorsSubscriber
    arguments:
      - '@myeventlane_auth.auth_redirect_validator'
    tags:
      - { name: event_subscriber }

  myeventlane_auth.vendor_sso_redirect_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\VendorSsoRedirectSubscriber
    arguments:
      - '@config.factory'
      - '@current_user'
      - '@logger.channel.myeventlane_auth'
      - '@module_handler'
      - '@myeventlane_auth.login_url_builder'
    tags:
      - { name: event_subscriber }

  myeventlane_auth.auth_login_fail_count_reset_subscriber:
    class: Drupal\myeventlane_auth\EventSubscriber\AuthLoginFailCountResetSubscriber
    arguments:
      - '@myeventlane_core.domain_detector'
    tags:
      - { name: event_subscriber }
