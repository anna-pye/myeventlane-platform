# Per-client row under oauth_clients (key = client_id). Matches SettingsForm /
# OAuthClientRepository — not a sequence of { client_id, client_secret, … }.
myeventlane_auth.oauth_client_row:
  type: mapping
  label: 'OAuth client'
  mapping:
    secret_hash:
      type: string
      label: 'Password hash for client secret'
    redirect_uri_prefixes:
      type: sequence
      label: 'Redirect URI prefixes'
      sequence:
        type: string
        label: 'Prefix'

# client_id => row. Wildcard key documents dynamic OAuth client IDs.
myeventlane_auth.oauth_clients_data:
  type: mapping
  label: 'OAuth confidential clients'
  mapping:
    '*':
      type: myeventlane_auth.oauth_client_row

myeventlane_auth.settings:
  type: config_object
  label: 'MyEventLane SSO settings'
  mapping:
    auth_base_url:
      type: string
      label: 'Auth site base URL'
    jwt_issuer:
      type: string
      label: 'JWT issuer'
    jwt_audience:
      type: string
      label: 'JWT audience'
    access_token_ttl:
      type: integer
      label: 'Access token TTL'
    refresh_token_ttl:
      type: integer
      label: 'Refresh token TTL'
    authorization_code_ttl:
      type: integer
      label: 'Authorization code TTL'
    refresh_cookie_name:
      type: string
    refresh_cookie_path:
      type: string
    refresh_cookie_domain:
      type: string
    vendor_sso_redirect_enabled:
      type: boolean
    vendor_sso_client_id:
      type: string
    vendor_sso_callback_path:
      type: string
    vendor_sso_success_path:
      type: string
    vendor_sso_redirect_hosts:
      type: sequence
      sequence:
        type: string
    allowed_redirect_hosts:
      type: sequence
      sequence:
        type: string
    allowed_cors_origins:
      type: sequence
      sequence:
        type: string
    oauth_clients:
      type: myeventlane_auth.oauth_clients_data
