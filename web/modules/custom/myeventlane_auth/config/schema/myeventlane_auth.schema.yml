myeventlane_auth.settings:
  type: config_object
  label: 'MyEventLane SSO settings'
  mapping:
    auth_base_url:
      type: string
      label: 'Auth site base URL (e.g. https://auth.staging.myeventlane.com.au)'
    access_token_ttl:
      type: integer
      label: 'Access token TTL in seconds (300–900 typical)'
    refresh_token_ttl:
      type: integer
      label: 'Refresh token TTL in seconds (7–30 days)'
    authorization_code_ttl:
      type: integer
      label: 'Authorization code TTL in seconds'
    refresh_cookie_name:
      type: string
      label: 'HttpOnly refresh cookie name (auth host only)'
    refresh_cookie_path:
      type: string
      label: 'Path scope for refresh cookie'
    vendor_sso_redirect_enabled:
      type: boolean
      label: 'Send anonymous /vendor/* requests to auth login (vendor host only)'
    vendor_sso_client_id:
      type: string
      label: 'OAuth client_id used for vendor SSO redirect'
    vendor_sso_callback_path:
      type: string
      label: 'Path on vendor host for OAuth redirect (must match token exchange redirect_uri)'
    vendor_sso_success_path:
      type: string
      label: 'Post-login redirect path on vendor host'
    vendor_sso_redirect_hosts:
      type: sequence
      label: 'Extra hostnames treated as vendor SSO hosts'
      sequence:
        type: string
        label: 'Hostname'
    allowed_redirect_hosts:
      type: sequence
      label: 'Allowed redirect_uri hosts (hostname only)'
      sequence:
        type: string
        label: 'Hostname'
    allowed_cors_origins:
      type: sequence
      label: 'Allowed Origin values for /auth/* CORS'
      sequence:
        type: string
        label: 'Origin URL'
    oauth_clients:
      type: mapping
      label: 'OAuth clients (client_id => settings)'
      mapping:
        '*':
          type: myeventlane_auth.oauth_client_entry

myeventlane_auth.oauth_client_entry:
  type: mapping
  label: 'OAuth client entry'
  mapping:
    secret_hash:
      type: string
      label: 'password_hash() of client secret'
    redirect_uri_prefixes:
      type: sequence
      label: 'Allowed redirect URI prefixes (scheme + host + optional path prefix)'
      sequence:
        type: string
        label: 'Prefix'
