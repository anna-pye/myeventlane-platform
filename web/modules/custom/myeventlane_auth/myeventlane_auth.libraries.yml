# Create-event intent callout on user.login (works with Gin Login / any active theme).
login_create_event_intent:
  css:
    theme:
      css/login-create-event-intent.css: {}

# Configured Google/Apple controls on user.login (Gin Login + any active theme).
social_login:
  css:
    theme:
      css/social-login.css: {}

# MEL-owned presentation shell for Gin Login's public authentication routes.
login_shell:
  css:
    theme:
      css/login-shell.css: {}
  js:
    js/login-shell.js: { attributes: { defer: true } }
  dependencies:
    - core/drupal
    - core/once
