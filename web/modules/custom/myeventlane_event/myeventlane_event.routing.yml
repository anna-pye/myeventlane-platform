# Event step wizard (Form API). Create/edit URLs are myeventlane_event_studio.* only.
# Wizard steps remain for users with "administer nodes" (support); vendors are redirected to Studio.
# Wizard step forms (Form API, save on every step).
myeventlane_event.wizard.basics:
  path: '/vendor/events/{event}/build/basics'
  defaults:
    _form: '\Drupal\myeventlane_event\Form\EventWizardBasicsForm'
    _title: 'Event basics'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
    event: '\d+'
  options:
    parameters:
      event:
        type: entity:node
        bundle:
          - event

myeventlane_event.wizard.when_where:
  path: '/vendor/events/{event}/build/when-where'
  defaults:
    _form: '\Drupal\myeventlane_event\Form\EventWizardWhenWhereForm'
    _title: 'When & Where'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
    event: '\d+'
  options:
    parameters:
      event:
        type: entity:node
        bundle:
          - event

