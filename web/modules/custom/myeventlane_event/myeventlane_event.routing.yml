# Duplicate event (rebook / run again).
myeventlane_event.duplicate:
  path: '/vendor/events/{node}/duplicate'
  defaults:
    _controller: '\Drupal\myeventlane_event\Controller\EventDuplicateController::duplicate'
    _title: 'Duplicate event'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - event

myeventlane_event.calendar_ics:
  path: '/event/{node}/calendar.ics'
  defaults:
    _controller: '\Drupal\myeventlane_event\Controller\EventIcsDownloadController::download'
  requirements:
    _entity_access: 'node.view'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
        bundle:
          - event

# Series instance generation (manual trigger).
# Door Mode: fast mobile check-in (JSON validate + search).
myeventlane_event.checkin_door:
  path: '/event/{event}/checkin'
  defaults:
    _controller: '\Drupal\myeventlane_event\Controller\CheckinController::doorMode'
    _title: 'Check-in'
  requirements:
    _custom_access: '\Drupal\myeventlane_event\Controller\CheckinController::checkAccess'
    event: '\d+'
  options:
    parameters:
      event:
        type: entity:node
        bundle:
          - event

myeventlane_event.checkin_validate:
  path: '/event/{event}/checkin/validate'
  defaults:
    _controller: '\Drupal\myeventlane_event\Controller\CheckinController::validate'
  requirements:
    _custom_access: '\Drupal\myeventlane_event\Controller\CheckinController::checkAccess'
    _method: 'GET|POST'
    event: '\d+'
  options:
    parameters:
      event:
        type: entity:node
        bundle:
          - event

myeventlane_event.generate_series_instances:
  path: '/vendor/event/{event}/series/generate'
  defaults:
    _form: '\Drupal\myeventlane_event\Form\GenerateSeriesInstancesForm'
    _title: 'Generate instances'
  requirements:
    _custom_access: '\Drupal\myeventlane_vendor\Controller\ManageSeriesInstancesController::access'
  options:
    parameters:
      event:
        type: entity:node
        bundle:
          - event
