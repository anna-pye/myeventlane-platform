services:
  logger.channel.myeventlane_event:
    parent: logger.channel_base
    arguments: ['myeventlane_event']

  myeventlane_event.stats:
    class: Drupal\myeventlane_event\Service\EventStatsService
    arguments:
      - '@database'
      - '@cache.default'
      - '@logger.channel.myeventlane_event'

  myeventlane_event.intelligence:
    class: Drupal\myeventlane_event\Service\EventIntelligenceService
    arguments:
      - '@string_translation'
      - '@myeventlane_event.stats'
      - '@myeventlane_event.event_mode_manager'

  myeventlane_event.wizard_review_summary_builder:
    class: Drupal\myeventlane_event\Service\WizardReviewSummaryBuilder
    arguments:
      - '@string_translation'

  myeventlane_event.mel_platform_support_wizard_form:
    class: Drupal\myeventlane_event\Service\MelPlatformSupportWizardFormHelper
    arguments:
      - '@module_handler'
      - '@config.factory'
      - '@myeventlane_donations.vendor_event_mel_support'
      - '@string_translation'

  myeventlane_event.geo_resolver:
    class: Drupal\myeventlane_event\Service\EventGeoResolver
    public: true

  myeventlane_event.wizard_publish_validator:
    class: Drupal\myeventlane_event\Service\EventWizardPublishValidator
    arguments:
      - '@logger.factory'
      - '@myeventlane_event.event_product_manager'

  myeventlane_event.builder_state:
    class: Drupal\myeventlane_event\Service\EventBuilderStateService
    arguments:
      - '@myeventlane_event.ticket_type_manager'

  myeventlane_event.ticket_type_route_subscriber:
    class: Drupal\myeventlane_event\Routing\TicketTypeRouteSubscriber
    tags:
      - { name: event_subscriber }

  myeventlane_event.event_vendor_subscriber:
    class: Drupal\myeventlane_event\EventSubscriber\EventVendorSubscriber
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
    tags:
      - { name: event_subscriber }

  myeventlane_event.ticket_product_event_ownership:
    class: Drupal\myeventlane_event\Service\TicketProductEventOwnershipService
    arguments:
      - '@logger.factory'

  myeventlane_event.event_product_manager:
    class: Drupal\myeventlane_event\Service\EventProductManager
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@messenger'
      - '@lock'
      - '@myeventlane_event.ticket_type_manager'
      - '@myeventlane_event.ticket_product_event_ownership'

  myeventlane_event.commerce_resolver:
    class: Drupal\myeventlane_event\Service\EventCommerceResolver
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event'
      - '@myeventlane_event.commerce_classification_registry'

  myeventlane_event.commerce_classification_registry:
    class: Drupal\myeventlane_event\Service\EventCommerceClassificationRegistry

  myeventlane_event.operational_type_registry:
    class: Drupal\myeventlane_event\Service\EventOperationalTypeRegistry

  myeventlane_event.event_mode_manager:
    class: Drupal\myeventlane_event\Service\EventModeManager
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_event_attendees.manager'
      - '@url_generator'
      - '@datetime.time'
      - '@myeventlane_capacity.service'

  myeventlane_event.ticket_type_manager:
    class: Drupal\myeventlane_event\Service\TicketTypeManager
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@myeventlane_event.ticket_product_event_ownership'

  myeventlane_event.ticket_presets:
    class: Drupal\myeventlane_event\Service\TicketPresetManager

  myeventlane_event.ticket_tier_lifecycle:
    class: Drupal\myeventlane_event\Service\TicketTierLifecycleService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_event.ticket_type_manager'
      - '@logger.factory'
      - '@myeventlane_vendor.event_access_checker'

  myeventlane_event.booking_flow_resolver:
    class: Drupal\myeventlane_event\Service\BookingFlowResolver
    arguments:
      - '@myeventlane_event.event_mode_manager'
      - '@myeventlane_event_state.resolver'
      - '@myeventlane_commerce.ticket_availability'
      - '@myeventlane_event.ticket_type_manager'
      # Build intl formatter from repos — do not inject commerce_price.currency_formatter
      # (lazy proxy still resolves that service and can self-cycle during container compile).
      - '@commerce_price.number_format_repository'
      - '@commerce_price.currency_repository'
      - '@language_manager'
      - '@logger.channel.myeventlane_event'

  myeventlane_event.cta_resolver:
    class: Drupal\myeventlane_event\Service\EventCtaResolver
    arguments:
      - '@myeventlane_event.booking_flow_resolver'

  myeventlane_event.recurrence_generator:
    class: Drupal\myeventlane_event\Service\EventRecurrenceGenerator
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'

  myeventlane_event.icalendar_builder:
    class: Drupal\myeventlane_event\Service\EventIcalendarBuilder

  myeventlane_event.media_presenter:
    class: Drupal\myeventlane_event\Service\EventMediaPresenter
    arguments:
      - '@logger.channel.myeventlane_event'

  myeventlane_event.sidebar_carousel_builder:
    class: Drupal\myeventlane_event\Service\EventSidebarCarouselBuilder
    arguments:
      - '@string_translation'
      - '@?myeventlane_commerce.event_operational_addon_teaser_builder'

  myeventlane_event.public_visibility:
    class: Drupal\myeventlane_event\Service\PublicEventVisibility
    arguments:
      - '@myeventlane_event_state.resolver'
      - '@datetime.time'

  myeventlane_event.structured_data_builder:
    class: Drupal\myeventlane_event\Service\EventStructuredDataBuilder
    arguments:
      - '@myeventlane_event.public_visibility'
      - '@myeventlane_event.booking_flow_resolver'
      - '@myeventlane_event.ticket_type_manager'

  myeventlane_event.event_card_view_model:
    class: Drupal\myeventlane_event\EventCard\EventCardViewModel
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@file_url_generator'
      - '@file_system'
      - '@?flag'
