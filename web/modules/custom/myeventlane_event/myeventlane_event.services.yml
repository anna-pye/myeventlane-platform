services:
  logger.channel.myeventlane_event:
    parent: logger.channel_base
    arguments: ['myeventlane_event']

  myeventlane_event.stats:
    class: Drupal\myeventlane_event\Service\EventStatsService
    arguments:
      - '@database'
      - '@cache.default'
      - '@logger.channel.myeventlane_event'

  myeventlane_event.intelligence:
    class: Drupal\myeventlane_event\Service\EventIntelligenceService
    arguments:
      - '@string_translation'
      - '@myeventlane_event.stats'
      - '@myeventlane_event.event_mode_manager'

  myeventlane_event.wizard_review_summary_builder:
    class: Drupal\myeventlane_event\Service\WizardReviewSummaryBuilder
    arguments:
      - '@string_translation'

  myeventlane_event.mel_platform_support_wizard_form:
    class: Drupal\myeventlane_event\Service\MelPlatformSupportWizardFormHelper
    arguments:
      - '@module_handler'
      - '@config.factory'
      - '@myeventlane_donations.vendor_event_mel_support'
      - '@string_translation'

  myeventlane_event.geo_resolver:
    class: Drupal\myeventlane_event\Service\EventGeoResolver
    public: true

  myeventlane_event.wizard_publish_validator:
    class: Drupal\myeventlane_event\Service\EventWizardPublishValidator
    arguments:
      - '@logger.factory'

  myeventlane_event.event_form_ticket_builder_callbacks:
    class: Drupal\myeventlane_event\Form\EventFormTicketBuilderCallbacks
    arguments:
      - '@myeventlane_vendor.ticket_builder'
      - '@entity_type.manager'

  myeventlane_event.builder_state:
    class: Drupal\myeventlane_event\Service\EventBuilderStateService
    arguments:
      - '@myeventlane_event.ticket_type_manager'

  myeventlane_event.ticket_type_route_subscriber:
    class: Drupal\myeventlane_event\Routing\TicketTypeRouteSubscriber
    tags:
      - { name: event_subscriber }

  myeventlane_event.event_vendor_subscriber:
    class: Drupal\myeventlane_event\EventSubscriber\EventVendorSubscriber
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
    tags:
      - { name: event_subscriber }

  myeventlane_event.event_product_manager:
    class: Drupal\myeventlane_event\Service\EventProductManager
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@messenger'
      - '@lock'

  myeventlane_event.event_mode_manager:
    class: Drupal\myeventlane_event\Service\EventModeManager
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_event_attendees.manager'
      - '@url_generator'
      - '@datetime.time'
      - '@myeventlane_capacity.service'

  myeventlane_event.ticket_type_manager:
    class: Drupal\myeventlane_event\Service\TicketTypeManager
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'

  myeventlane_event.ticket_tier_lifecycle:
    class: Drupal\myeventlane_event\Service\TicketTierLifecycleService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_event.ticket_type_manager'
      - '@logger.factory'

  myeventlane_event.cta_resolver:
    class: Drupal\myeventlane_event\Service\EventCtaResolver
    arguments:
      - '@myeventlane_event.event_mode_manager'
      - '@myeventlane_event_state.resolver'

  myeventlane_event.recurrence_generator:
    class: Drupal\myeventlane_event\Service\EventRecurrenceGenerator
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
