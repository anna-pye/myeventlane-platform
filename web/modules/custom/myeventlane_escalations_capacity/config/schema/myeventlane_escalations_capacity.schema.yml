myeventlane_escalations_capacity.settings:
  type: config_object
  label: 'Escalations Capacity settings'
  mapping:
    activity_window_days:
      type: integer
      label: 'Activity window (days)'
    trend_window_days:
      type: integer
      label: 'Trend comparison window (days)'
    staff_roles:
      type: sequence
      label: 'Staff roles'
      sequence:
        type: string
        label: 'Role ID'
    thresholds:
      type: mapping
      label: 'Capacity thresholds'
      mapping:
        waiting_on_staff:
          type: integer
          label: 'Waiting on staff threshold'
        avg_first_staff_response_hours:
          type: integer
          label: 'Average first staff response hours threshold'
        oldest_open_escalation_days:
          type: integer
          label: 'Oldest open escalation days threshold'
