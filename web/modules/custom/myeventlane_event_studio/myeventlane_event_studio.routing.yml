myeventlane_event_studio.create:
  path: '/vendor/events/create'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioController::buildCreate'
    _title: 'Create Event'
  requirements:
    _permission: 'access content'

myeventlane_event_studio.edit:
  path: '/vendor/events/{node}/edit'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioController::buildEdit'
    _title_callback: '\Drupal\myeventlane_event_studio\Controller\EventStudioController::editTitle'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_basic:
  path: '/vendor/events/{node}/edit/basic'
  defaults:
    _form: '\Drupal\myeventlane_event_studio\Form\EventStudioBasicForm'
    _title: 'Basic info'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_datetime:
  path: '/vendor/events/{node}/edit/datetime'
  defaults:
    _form: '\Drupal\myeventlane_event_studio\Form\EventStudioDateForm'
    _title: 'Date & location'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_tickets:
  path: '/vendor/events/{node}/edit/tickets'
  defaults:
    _form: '\Drupal\myeventlane_event_studio\Form\EventStudioTicketsForm'
    _title: 'Tickets'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_description:
  path: '/vendor/events/{node}/edit/description'
  defaults:
    _form: '\Drupal\myeventlane_event_studio\Form\EventStudioDescriptionForm'
    _title: 'Description'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_preview:
  path: '/vendor/events/{node}/edit/preview'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioPreviewController::build'
    _title_callback: '\Drupal\myeventlane_event_studio\Controller\EventStudioPreviewController::title'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.edit_publish:
  path: '/vendor/events/{node}/edit/publish'
  defaults:
    _form: '\Drupal\myeventlane_event_studio\Form\EventStudioPublishForm'
    _title: 'Publish'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.autosave:
  path: '/vendor/events/autosave'
  defaults:
    _controller: myeventlane_event_studio.autosave_controller:handle
  methods: [POST]
  requirements:
    _permission: 'access content'

# Header CSRF: JS sends X-CSRF-Token from GET /session/token (same salt as
# CsrfRequestHeaderAccessCheck). Do NOT use _csrf_token — that only validates ?token=.
myeventlane_event_studio.ai_generate:
  path: '/vendor/events/ai/generate'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioAiController::generate'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

myeventlane_event_studio.ai_rewrite:
  path: '/vendor/events/ai/rewrite'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioAiController::rewrite'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

myeventlane_event_studio.ticket_link_suggestions:
  path: '/vendor/events/studio/ticket-link-suggestions'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioTicketSuggestionsController::suggest'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'
