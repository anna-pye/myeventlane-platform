myeventlane_event_studio.create:
  path: '/vendor/events/create'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioController::buildCreate'
    _title: 'Create Event'
  requirements:
    _permission: 'access content'

myeventlane_event_studio.edit:
  path: '/vendor/events/{node}/edit'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioController::buildEdit'
    _title: 'Edit Event'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

myeventlane_event_studio.autosave:
  path: '/vendor/events/autosave'
  defaults:
    _controller: myeventlane_event_studio.autosave_controller:handle
  methods: [POST]
  requirements:
    _permission: 'access content'

# Header CSRF: JS sends X-CSRF-Token from GET /session/token (same salt as
# CsrfRequestHeaderAccessCheck). Do NOT use _csrf_token — that only validates ?token=.
myeventlane_event_studio.ai_generate:
  path: '/vendor/events/ai/generate'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioAiController::generate'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'

myeventlane_event_studio.ai_rewrite:
  path: '/vendor/events/ai/rewrite'
  defaults:
    _controller: '\Drupal\myeventlane_event_studio\Controller\EventStudioAiController::rewrite'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _csrf_request_header_token: 'TRUE'
