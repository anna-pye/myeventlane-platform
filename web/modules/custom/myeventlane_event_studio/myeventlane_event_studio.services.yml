services:
  myeventlane_event_studio.controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioController
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_vendor.event_studio_create'
      - '@logger.channel.myeventlane_event_studio'
      - '@request_stack'
      - '@myeventlane_vendor.event_access_checker'
      - '@date.formatter'
      - '@myeventlane_event_studio.readiness'
      - '@myeventlane_event_studio.autosave'
      - '@plugin.manager.myeventlane_event_studio_section'
      - '@myeventlane_event_studio.section_renderer'
    tags:
      - { name: controller.service_arguments }

  myeventlane_event_studio.preprocess:
    class: Drupal\myeventlane_event_studio\EventStudioPreprocess
    arguments:
      - '@current_user'
      - '@myeventlane_vendor.user_vendor_membership_query'
      - '@myeventlane_onboarding.manager'
      - '@entity_type.manager'
      - '@request_stack'

  myeventlane_event_studio.vendor_mel_ticket_type_edit_redirect_subscriber:
    class: Drupal\myeventlane_event_studio\EventSubscriber\VendorMelTicketTypeEditRedirectSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event_studio'
    tags:
      - { name: event_subscriber }

  myeventlane_event_studio.vendor_legacy_wizard_redirect_subscriber:
    class: Drupal\myeventlane_event_studio\EventSubscriber\VendorLegacyWizardRedirectSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event_studio'
    tags:
      - { name: event_subscriber }

  myeventlane_event_studio.node_form_access_subscriber:
    class: Drupal\myeventlane_event_studio\EventSubscriber\EventNodeFormAccessSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  Drupal\myeventlane_event_studio\Access\EventStudioAccess:
    arguments:
      - '@myeventlane_vendor.current_vendor_resolver'
      - '@myeventlane_vendor.event_access_checker'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event_studio'

  logger.channel.myeventlane_event_studio:
    parent: logger.channel_base
    arguments: ['myeventlane_event_studio']

  plugin.manager.myeventlane_event_studio_section:
    class: Drupal\myeventlane_event_studio\EventStudioSectionManager
    arguments:
      - '@container.namespaces'
      - '@module_handler'
      - '@cache.discovery'

  myeventlane_event_studio.empty_state_builder:
    class: Drupal\myeventlane_event_studio\Service\EventStudioEmptyStateBuilder
    arguments:
      - '@string_translation'

  myeventlane_event_studio.mel_support_resolver:
    class: Drupal\myeventlane_event_studio\Support\MelSupportResolver
    arguments:
      - '@module_handler'
      - '@config.factory'
      - '@router.route_provider'
      - '@current_user'
      - '@logger.channel.myeventlane_event_studio'
      - '@string_translation'

  myeventlane_event_studio.section_renderer:
    class: Drupal\myeventlane_event_studio\Service\EventStudioSectionRenderer
    arguments:
      - '@form_builder'
      - '@myeventlane_event_studio.readiness'
      - '@myeventlane_event_studio.empty_state_builder'
      - '@current_user'
      - '@logger.channel.myeventlane_event_studio'
      - '@string_translation'
      - '@myeventlane_event_studio.mel_support_resolver'
      - '@?myeventlane_capacity.service'
      - '@?myeventlane_metrics.service'

  myeventlane_event_studio.highlight_helper:
    class: Drupal\myeventlane_event_studio\Service\EventHighlightHelper
    arguments:
      - '@entity_type.manager'

  myeventlane_event_studio.mel_payload:
    class: Drupal\myeventlane_event_studio\Service\EventStudioMelPayloadService
    arguments:
      - '@myeventlane_event_studio.highlight_helper'
      - '@myeventlane_event_studio.question_field_type_registry'
      - '@myeventlane_event_studio.operational_capability_studio_manager'

  myeventlane_event_studio.entity_autocomplete_mel_normalizer:
    class: Drupal\myeventlane_event_studio\Service\EntityAutocompleteMelNormalizer
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event_studio'

  myeventlane_event_studio.wizard_mel_baseline:
    class: Drupal\myeventlane_event_studio\Service\EventStudioWizardMelBaseline
    arguments:
      - '@form_builder'
      - '@myeventlane_event_studio.entity_autocomplete_mel_normalizer'

  myeventlane_event_studio.ticket_link_suggestion:
    class: Drupal\myeventlane_event_studio\Service\EventStudioTicketLinkSuggestionService
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@logger.channel.myeventlane_event_studio'

  myeventlane_event_studio.ai_assist_builder:
    class: Drupal\myeventlane_event_studio\Service\EventStudioAiAssistBuilder
    arguments:
      - '@renderer'
      - '@url_generator'
      - '@logger.channel.myeventlane_event_studio'
      - '@string_translation'

  myeventlane_event_studio.ai_prompt_builder:
    class: Drupal\myeventlane_event_studio\Service\EventStudioAiPromptBuilder
    arguments:
      - '@logger.channel.myeventlane_event_studio'

  myeventlane_event_studio.question_template_manager:
    class: Drupal\myeventlane_event_studio\Service\EventStudioQuestionTemplateManager
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_event_studio'
      - '@myeventlane_event_studio.question_field_type_registry'
      - '@myeventlane_event_studio.question_answer_existence_repository'

  myeventlane_event_studio.question_field_type_registry:
    class: Drupal\myeventlane_event_studio\Service\QuestionFieldTypeRegistry
    calls:
      - [setStringTranslation, ['@string_translation']]

  myeventlane_event_studio.question_answer_existence_repository:
    class: Drupal\myeventlane_event_studio\Service\EventStudioQuestionAnswerExistenceRepository
    arguments:
      - '@database'
      - '@logger.channel.myeventlane_event_studio'

  myeventlane_event_studio.governance_builder:
    class: Drupal\myeventlane_event_studio\Service\EventStudioGovernanceBuilder
    arguments:
      - '@?myeventlane_surface.workflow_manager'
      - '@?myeventlane_surface.state_manager'
      - '@?myeventlane_surface.operational_policy_manager'
      - '@?myeventlane_surface.experience_manager'
      - '@?myeventlane_surface.intelligence_manager'
      - '@?myeventlane_surface.observability_manager'
      - '@current_user'
      - '@?myeventlane_surface.observability_diagnostics_access'
      - '@?myeventlane_surface.resolver'
      - '@?myeventlane_surface.governance_presentation_sanitizer'
      - '@string_translation'

  myeventlane_event_studio.governance_component_builder:
    class: Drupal\myeventlane_event_studio\Service\EventStudioGovernanceComponentBuilder
    arguments:
      - '@string_translation'
      - '@myeventlane_surface.state_readiness_helper'

  myeventlane_event_studio.repository:
    class: Drupal\myeventlane_event_studio\Service\EventRepository
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_core.entity_id_normalizer'
      - '@logger.channel.myeventlane_event_studio'
      - '@?myeventlane_event_state.resolver'
      - '@?myeventlane_capacity.service'

  myeventlane_event_studio.operational_capability_commerce_link_manager:
    class: Drupal\myeventlane_event_studio\Service\OperationalCapabilityCommerceLinkManager
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.operational_entitlement_capability_manager'
      - '@myeventlane_tickets.fulfillment_lifecycle_manager'
      - '@myeventlane_tickets.inventory_reservation_governance_manager'

  myeventlane_event_studio.operational_capability_commerce_preview_builder:
    class: Drupal\myeventlane_event_studio\Service\OperationalCapabilityCommercePreviewBuilder
    arguments:
      - '@myeventlane_event_studio.operational_capability_commerce_link_manager'
      - '@entity_type.manager'
      - '@string_translation'

  myeventlane_event_studio.operational_capability_studio_manager:
    class: Drupal\myeventlane_event_studio\Service\OperationalCapabilityStudioManager
    arguments:
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.venue_operation_policy_manager'
      - '@myeventlane_tickets.operational_entitlement_capability_manager'
      - '@myeventlane_tickets.fulfillment_lifecycle_manager'
      - '@myeventlane_tickets.inventory_reservation_governance_manager'
      - '@logger.channel.myeventlane_event_studio'
      - '@myeventlane_event_studio.operational_capability_commerce_link_manager'
      - '@myeventlane_commerce.operational_merchandise_manager'

  myeventlane_event_studio.operational_capability_studio_builder:
    class: Drupal\myeventlane_event_studio\Service\OperationalCapabilityStudioBuilder
    arguments:
      - '@myeventlane_event_studio.operational_capability_studio_manager'
      - '@myeventlane_event_studio.operational_capability_commerce_preview_builder'
      - '@string_translation'

  myeventlane_event_studio.operational_capability_preview_builder:
    class: Drupal\myeventlane_event_studio\Service\OperationalCapabilityPreviewBuilder
    arguments:
      - '@myeventlane_event_studio.operational_capability_studio_manager'
      - '@myeventlane_event_studio.operational_capability_commerce_preview_builder'
      - '@string_translation'

  myeventlane_event_studio.customer_operational_commerce_experience_builder:
    class: Drupal\myeventlane_event_studio\Service\CustomerOperationalCommerceExperienceBuilder
    arguments:
      - '@myeventlane_event_studio.operational_capability_commerce_link_manager'
      - '@myeventlane_event_studio.operational_capability_preview_builder'
      - '@myeventlane_event_studio.operational_capability_studio_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.fulfillment_lifecycle_manager'
      - '@myeventlane_tickets.inventory_reservation_governance_manager'
      - '@entity_type.manager'
      - '@string_translation'

  myeventlane_event_studio.save:
    class: Drupal\myeventlane_event_studio\Service\EventStudioSaveService
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_venue.manager'
      - '@logger.channel.myeventlane_event_studio'
      - '@myeventlane_event_studio.highlight_helper'
      - '@myeventlane_vendor.paid_publish_stripe_gate'
      - '@myeventlane_vendor.publish_requirements_gate'
      - '@myeventlane_event_studio.readiness'
      - '@myeventlane_event_studio.question_field_type_registry'
      - '@image.factory'
      - '@string_translation'
      - '@file_system'
      - '@?myeventlane_questions.template_cloner'
      - '@myeventlane_event_studio.operational_capability_studio_manager'

  myeventlane_event_studio.readiness:
    class: Drupal\myeventlane_event_studio\Service\EventReadinessService
    arguments:
      - '@myeventlane_event.ticket_type_manager'
      - '@myeventlane_vendor.publish_requirements_gate'
      - '@myeventlane_vendor.paid_publish_stripe_gate'
      - '@string_translation'

  myeventlane_event_studio.autosave:
    class: Drupal\myeventlane_event_studio\Service\EventStudioAutosaveService
    arguments:
      - '@tempstore.private'
      - '@logger.channel.myeventlane_event_studio'

  myeventlane_event_studio.governance_refresh_controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioGovernanceRefreshController
    arguments:
      - '@myeventlane_event_studio.governance_builder'
      - '@current_user'
      - '@myeventlane_vendor.event_access_checker'
      - '@logger.channel.myeventlane_event_studio'
    tags:
      - { name: controller.service_arguments }

  myeventlane_event_studio.governance_component_controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioGovernanceComponentController
    arguments:
      - '@myeventlane_event_studio.governance_builder'
      - '@myeventlane_event_studio.governance_component_builder'
      - '@renderer'
      - '@current_user'
      - '@myeventlane_vendor.event_access_checker'
      - '@logger.channel.myeventlane_event_studio'
    tags:
      - { name: controller.service_arguments }

  myeventlane_event_studio.autosave_controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioAutosaveController
    arguments:
      - '@myeventlane_event_studio.save'
      - '@current_user'
      - '@entity_type.manager'
      - '@myeventlane_event_studio.highlight_helper'
      - '@logger.channel.myeventlane_event_studio'
      - '@access_manager'
      - '@myeventlane_vendor.event_access_checker'
      - '@myeventlane_vendor.current_vendor_resolver'
      - '@myeventlane_event_studio.autosave'
      - '@plugin.manager.myeventlane_event_studio_section'
      - '@form_builder'
      - '@myeventlane_event_studio.entity_autocomplete_mel_normalizer'
    tags:
      - { name: controller.service_arguments }

  myeventlane_event_studio.publish_controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioPublishController
    arguments:
      - '@myeventlane_event_studio.save'
      - '@myeventlane_event_studio.readiness'
      - '@myeventlane_event_studio.autosave'
      - '@plugin.manager.myeventlane_event_studio_section'
      - '@myeventlane_vendor.event_access_checker'
      - '@current_user'
      - '@date.formatter'
      - '@logger.channel.myeventlane_event_studio'
      - '@string_translation'
    tags:
      - { name: controller.service_arguments }

  myeventlane_event_studio.ai_controller:
    class: Drupal\myeventlane_event_studio\Controller\EventStudioAiController
    arguments:
      - '@myeventlane_ai.manager'
      - '@myeventlane_event_studio.ai_prompt_builder'
      - '@current_user'
      - '@myeventlane_vendor.event_access_checker'
      - '@logger.channel.myeventlane_event_studio'
    tags:
      - { name: controller.service_arguments }
