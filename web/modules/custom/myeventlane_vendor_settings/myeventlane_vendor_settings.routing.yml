# Owns Workspace Settings hub + organiser profile form.
# Access matches vendor console.

myeventlane_vendor.console.settings:
  path: '/vendor/settings'
  defaults:
    _controller: 'myeventlane_vendor.controller.vendor_settings_hub:hub'
    _title: 'Workspace Settings'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
  options:
    _theme: myeventlane_vendor_theme

myeventlane_vendor.console.settings_profile:
  path: '/vendor/settings/profile'
  defaults:
    _form: '\Drupal\myeventlane_vendor_settings\Form\VendorSettingsForm'
    _title: 'Profile'
  requirements:
    _custom_access: 'myeventlane_vendor.access.vendor_console:access'
  options:
    _theme: myeventlane_vendor_theme
