services:
  logger.channel.myeventlane_help_assistant:
    parent: logger.channel_base
    arguments: ['myeventlane_help_assistant']

  myeventlane_help_assistant.context_resolver:
    class: Drupal\myeventlane_help_assistant\Service\HelpContextResolver
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_help_assistant'
      - '@request_stack'

  myeventlane_help_assistant.response_builder:
    class: Drupal\myeventlane_help_assistant\Service\HelpResponseBuilder
    arguments:
      - '@myeventlane_help_centre.support_action_builder'
    calls:
      - [setStringTranslation, ['@string_translation']]

  myeventlane_help.context_resolver:
    alias: myeventlane_help_assistant.context_resolver

  myeventlane_help_assistant.retriever:
    class: Drupal\myeventlane_help_assistant\Service\HelpRetriever
    arguments:
      - '@entity_type.manager'
      - '@path_alias.manager'
      - '@current_user'
      - '@logger.channel.myeventlane_help_assistant'

  myeventlane_help_assistant.assistant:
    class: Drupal\myeventlane_help_assistant\Service\HelpAssistantService
    arguments:
      - '@myeventlane_help_assistant.retriever'
      - '@myeventlane_ai.manager'
      - '@myeventlane_help_centre.analytics'
      - '@config.factory'
      - '@current_user'
      - '@logger.channel.myeventlane_help_assistant'
    calls:
      - [setStringTranslation, ['@string_translation']]

  myeventlane_help_assistant.event_suggestion_formatter:
    class: Drupal\myeventlane_help_assistant\Service\EventSuggestionFormatter
    arguments:
      - '@logger.channel.myeventlane_help_assistant'
    calls:
      - [setStringTranslation, ['@string_translation']]

  myeventlane_help_assistant.event_suggestion_engine:
    class: Drupal\myeventlane_help_assistant\Service\EventSuggestionEngine
    arguments:
      - '@myeventlane_help_assistant.event_suggestion_formatter'
      - '@myeventlane_help_assistant.retriever'
      - '@myeventlane_ai.manager'
      - '@config.factory'
      - '@current_user'
      - '@logger.channel.myeventlane_help_assistant'
      - '@myeventlane_core.event_state_resolver'
      - '@?myeventlane_event_attendees.manager'
    calls:
      - [setStringTranslation, ['@string_translation']]

  myeventlane_help_assistant.event_suggestions:
    class: Drupal\myeventlane_help_assistant\Service\EventSuggestionService
    arguments:
      - '@myeventlane_help_assistant.event_suggestion_engine'
      - '@myeventlane_help_assistant.event_suggestion_formatter'
