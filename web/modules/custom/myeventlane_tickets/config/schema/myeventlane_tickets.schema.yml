# Schema for MyEventLane Tickets module configuration.
myeventlane_tickets.settings:
  type: config_object
  label: 'MyEventLane Tickets settings'
  mapping:
    pdf_enabled:
      type: boolean
      label: 'PDF tickets enabled'
    pdf_expiry_days:
      type: integer
      label: 'PDF expiry days'
    include_qr_code:
      type: boolean
      label: 'Include QR code in tickets'
    show_ticket_code:
      type: boolean
      label: 'Show ticket code'
    ticket_code_format:
      type: string
      label: 'Ticket code format'
    brand_logo_url:
      type: string
      label: 'Brand logo URL'
    brand_accent_color:
      type: string
      label: 'Brand accent color'
    brand_footer_text:
      type: text
      label: 'Brand footer text'
    qr_payload_mode:
      type: string
      label: 'QR payload mode'
    qr_secret:
      type: string
      label: 'QR signing secret (fallback; prefer settings.php)'
