services:
  myeventlane_tickets.ticket_code_generator:
    class: Drupal\myeventlane_tickets\Ticket\TicketCodeGenerator
    arguments: ['@entity_type.manager', '@uuid']

  myeventlane_tickets.ticket_pdf_event_metadata_helper:
    class: Drupal\myeventlane_tickets\Service\TicketPdfEventMetadataHelper

  myeventlane_tickets.ticket_pdf_attachment_renderer:
    class: Drupal\myeventlane_tickets\Ticket\TicketPdfAttachmentRenderer
    arguments: ['@renderer']

  myeventlane_tickets.pdf_compatibility.order_item:
    class: Drupal\myeventlane_tickets\Pdf\Compatibility\OrderItemPdfCompatibilityAdapter
    arguments:
      - '@myeventlane_tickets.ticket_pdf_event_metadata_helper'
      - '@myeventlane_tickets.ticket_pdf_attachment_renderer'

  myeventlane_tickets.pdf_compatibility.rsvp:
    class: Drupal\myeventlane_tickets\Pdf\Compatibility\RsvpPdfCompatibilityAdapter
    arguments:
      - '@myeventlane_tickets.ticket_pdf_event_metadata_helper'
      - '@myeventlane_tickets.ticket_pdf_attachment_renderer'

  myeventlane_tickets.pdf_compatibility.event_attendee:
    class: Drupal\myeventlane_tickets\Pdf\Compatibility\EventAttendeePdfCompatibilityAdapter
    arguments:
      - '@myeventlane_tickets.ticket_pdf_event_metadata_helper'
      - '@myeventlane_tickets.ticket_pdf_attachment_renderer'

  myeventlane_tickets.ticket_pdf_generator:
    class: Drupal\myeventlane_tickets\Ticket\TicketPdfGenerator
    arguments:
      - '@myeventlane_tickets.ticket_pdf_attachment_renderer'
      - '@myeventlane_tickets.ticket_pdf_event_metadata_helper'
      - '@myeventlane_tickets.pdf_compatibility.order_item'
      - '@myeventlane_tickets.pdf_compatibility.rsvp'
      - '@myeventlane_tickets.pdf_compatibility.event_attendee'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'

  # Alias for shorter service name.
  myeventlane_tickets.pdf_generator:
    alias: myeventlane_tickets.ticket_pdf_generator

  myeventlane_tickets.ticket_issuer:
    class: Drupal\myeventlane_tickets\Ticket\TicketIssuer
    arguments: [
      '@entity_type.manager',
      '@myeventlane_tickets.ticket_code_generator',
      '@logger.factory'
    ]

  myeventlane_tickets.order_paid_subscriber:
    class: Drupal\myeventlane_tickets\EventSubscriber\OrderPaidSubscriber
    arguments:
      - '@myeventlane_tickets.ticket_issuer'
    tags:
      - { name: event_subscriber }

  myeventlane_tickets.ticket_assignment_token:
    class: Drupal\myeventlane_tickets\Service\TicketAssignmentTokenService

  myeventlane_tickets.qr_code_generator:
    class: Drupal\myeventlane_tickets\Ticket\QrCodeGenerator
    arguments: ['@logger.channel.myeventlane_tickets']

  myeventlane_tickets.ticket_qr_payload:
    class: Drupal\myeventlane_tickets\Ticket\TicketQrPayload
    arguments: ['@config.factory', '@logger.channel.myeventlane_tickets']

  myeventlane_tickets.ticket_checkin_logger:
    class: Drupal\myeventlane_tickets\Service\TicketCheckinLogger
    arguments:
      - '@database'
      - '@datetime.time'
      - '@current_user'
      - '@request_stack'
      - '@logger.channel.myeventlane_tickets'

  myeventlane_tickets.entitlement_capability_registry:
    class: Drupal\myeventlane_tickets\Service\EntitlementCapabilityRegistry

  myeventlane_tickets.timed_entry_policy_manager:
    class: Drupal\myeventlane_tickets\Service\TimedEntryPolicyManager

  myeventlane_tickets.session_entitlement_policy_manager:
    class: Drupal\myeventlane_tickets\Service\SessionEntitlementPolicyManager
    arguments:
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'

  myeventlane_tickets.zone_access_policy_manager:
    class: Drupal\myeventlane_tickets\Service\ZoneAccessPolicyManager
    arguments:
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@datetime.time'

  myeventlane_tickets.device_operation_identity_manager:
    class: Drupal\myeventlane_tickets\Service\DeviceOperationIdentityManager
    arguments:
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'
      - '@datetime.time'

  myeventlane_tickets.operational_continuity_policy_manager:
    class: Drupal\myeventlane_tickets\Service\OperationalContinuityPolicyManager
    arguments:
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'
      - '@datetime.time'

  myeventlane_tickets.occupancy_policy_manager:
    class: Drupal\myeventlane_tickets\Service\OccupancyPolicyManager
    arguments:
      - '@myeventlane_tickets.operational_continuity_policy_manager'
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'
      - '@datetime.time'

  myeventlane_tickets.venue_operation_policy_manager:
    class: Drupal\myeventlane_tickets\Service\VenueOperationPolicyManager
    arguments:
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@mel_ticket_capability.manager'
      - '@datetime.time'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@myeventlane_tickets.operational_continuity_policy_manager'
      - '@myeventlane_tickets.occupancy_policy_manager'

  mel_ticket_capability.manager:
    class: Drupal\myeventlane_tickets\Service\TicketCapabilityManager
    arguments:
      - '@datetime.time'
      - '@myeventlane_tickets.entitlement_capability_registry'

  mel_scanner.operation_manager:
    class: Drupal\myeventlane_tickets\Service\ScannerOperationManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@current_user'
      - '@myeventlane_tickets.ticket_qr_payload'
      - '@myeventlane_tickets.ticket_checkin_logger'
      - '@mel_ticket_capability.manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.venue_operation_policy_manager'
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@database'
      - '@request_stack'
      - '@logger.channel.myeventlane_tickets'

  myeventlane_tickets.ticket_checkin_service:
    class: Drupal\myeventlane_tickets\Service\TicketCheckinService
    arguments:
      - '@mel_scanner.operation_manager'

  myeventlane_tickets.ticket_pdf_template_builder:
    class: Drupal\myeventlane_tickets\Service\TicketPdfTemplateBuilder
    arguments:
      - '@config.factory'
      - '@myeventlane_tickets.qr_code_generator'
      - '@myeventlane_tickets.ticket_qr_payload'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'
      - '@?token'

  myeventlane_tickets.universal_ticket_view_model_builder:
    class: Drupal\myeventlane_tickets\Service\UniversalTicketViewModelBuilder
    arguments:
      - '@myeventlane_tickets.ticket_qr_payload'
      - '@myeventlane_tickets.qr_code_generator'
      - '@mel_ticket_capability.manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@router.route_provider'
      - '@datetime.time'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@myeventlane_tickets.operational_continuity_policy_manager'
      - '@myeventlane_tickets.occupancy_policy_manager'

  myeventlane_tickets.ticket_mailer:
    class: Drupal\myeventlane_tickets\Service\TicketMailer
    arguments:
      - '@plugin.manager.mail'
      - '@myeventlane_tickets.ticket_pdf_generator'
      - '@logger.channel.myeventlane_tickets'
      - '@?myeventlane_rsvp.ics_generator'

  myeventlane_tickets.event_access:
    class: Drupal\myeventlane_tickets\Service\EventAccess
    arguments: ['@current_user', '@entity_type.manager']

  myeventlane_tickets.access.event_tickets:
    class: Drupal\myeventlane_tickets\Access\EventTicketsAccess
    arguments:
      - '@myeventlane_tickets.event_access'
      - '@myeventlane_vendor.event_access_checker'
    tags:
      - { name: access_check }

  myeventlane_tickets.access.ticket_operations:
    class: Drupal\myeventlane_tickets\Access\TicketOperationsAccess
    arguments: ['@myeventlane_tickets.event_access']
    tags:
      - { name: access_check }

  logger.channel.myeventlane_tickets:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['myeventlane_tickets']

  myeventlane_tickets.ticket_assigned_subscriber:
    class: Drupal\myeventlane_tickets\EventSubscriber\TicketAssignedSubscriber
    arguments:
      - '@myeventlane_tickets.ticket_mailer'
      - '@logger.channel.myeventlane_tickets'

  myeventlane_tickets.operational_incident_normalizer:
    class: Drupal\myeventlane_tickets\Service\OperationalIncidentNormalizer

  myeventlane_tickets.operational_recovery_summary_builder:
    class: Drupal\myeventlane_tickets\Service\OperationalRecoverySummaryBuilder

  myeventlane_tickets.operational_incident_builder:
    class: Drupal\myeventlane_tickets\Service\OperationalIncidentBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_tickets.operational_integrity_inspector'
      - '@myeventlane_tickets.operational_incident_normalizer'
      - '@myeventlane_tickets.venue_operation_policy_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'

  myeventlane_tickets.operational_incident_access:
    class: Drupal\myeventlane_tickets\Access\OperationalIncidentAccessChecker
    tags:
      - { name: access_check }

  myeventlane_tickets.operational_workspace_builder:
    class: Drupal\myeventlane_tickets\Service\OperationalWorkspaceBuilder
    arguments:
      - '@datetime.time'
      - '@myeventlane_tickets.venue_operation_policy_manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.operational_incident_builder'
      - '@myeventlane_tickets.operational_recovery_summary_builder'

  myeventlane_tickets.operational_workspace_access:
    class: Drupal\myeventlane_tickets\Access\OperationalWorkspaceAccessChecker
    tags:
      - { name: access_check }

  myeventlane_tickets.operational_integrity_inspector:
    class: Drupal\myeventlane_tickets\Service\OperationalIntegrityInspector
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_tickets.ticket_issuer'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'
      - '@myeventlane_tickets.ticket_pdf_generator'
      - '@myeventlane_tickets.ticket_qr_payload'
      - '@mel_ticket_capability.manager'
      - '@myeventlane_tickets.entitlement_capability_registry'
      - '@myeventlane_tickets.venue_operation_policy_manager'
      - '@myeventlane_tickets.timed_entry_policy_manager'
      - '@myeventlane_tickets.session_entitlement_policy_manager'
      - '@myeventlane_tickets.zone_access_policy_manager'
      - '@myeventlane_tickets.device_operation_identity_manager'
      - '@myeventlane_tickets.operational_continuity_policy_manager'
      - '@myeventlane_tickets.occupancy_policy_manager'
      - '@datetime.time'
      - '@state'
      - '@logger.channel.myeventlane_tickets'
      - '@?myeventlane_wallet.ticket_resolver'
      - '@?myeventlane_messaging.message_storage'