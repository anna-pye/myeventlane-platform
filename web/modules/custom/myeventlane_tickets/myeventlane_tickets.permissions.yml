# Admin permission.
administer myeventlane tickets:
  title: 'Administer ticket settings'
  description: 'Configure ticket PDF generation and download settings.'
  restrict access: TRUE

manage own events tickets:
  title: 'Manage tickets for own events'
  description: 'Create and manage ticket products, groups, access codes and settings for events the user owns.'

administer all events tickets:
  title: 'Administer tickets for all events'
  description: 'Full access to manage tickets for any event.'
  restrict access: true

check in tickets:
  title: 'Check in tickets'
  description: 'Validate ticket codes and mark tickets as checked in for accessible events.'

view check-in analytics:
  title: 'View check-in analytics'
  description: 'View ticket check-in analytics dashboards for accessible events.'

resend ticket emails:
  title: 'Resend ticket emails'
  description: 'Resend assigned ticket emails for accessible events.'

view mel venue operations workspace:
  title: 'View MyEventLane venue operations workspace'
  description: 'Access the read-only staff venue operations workspace at /admin/mel/operations.'
  restrict access: true

govern mel operational escalations:
  title: 'Govern MyEventLane operational escalations'
  description: 'View escalation, SLA, resolution, and suppression governance projections in the venue operations workspace.'
  restrict access: true

govern mel operational ownership:
  title: 'Govern MyEventLane operational ownership'
  description: 'View assignment, acknowledgement, escalation owner, handoff, and ownership audit projections in the venue operations workspace.'
  restrict access: true

govern mel operational coordination:
  title: 'Govern MyEventLane operational coordination'
  description: 'View operational coordination, posture, readiness, recovery, reconciliation, confidence, and coordination audit projections in the venue operations workspace.'
  restrict access: true

govern mel fulfillment lifecycle:
  title: 'Govern MyEventLane fulfillment lifecycle'
  description: 'View fulfillment lifecycle, pickup, redemption, partial fulfillment, execution, and fulfillment audit projections in the venue operations workspace.'
  restrict access: true






