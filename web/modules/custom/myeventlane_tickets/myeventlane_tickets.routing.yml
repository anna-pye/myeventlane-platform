# Staff venue operations workspace (read-only shell).
myeventlane_tickets.venue_operations_workspace:
  path: '/admin/mel/operations'
  defaults:
    _controller: '\Drupal\myeventlane_tickets\Controller\VenueOperationsController::page'
    _title_callback: '\Drupal\myeventlane_tickets\Controller\VenueOperationsController::title'
  requirements:
    _custom_access: 'myeventlane_tickets.operational_incident_access:accessOperationalIncidentWorkspace'
  options:
    _admin_route: TRUE

entity.mel_operational_incident.collection:
  path: '/admin/mel/operations/incidents'
  defaults:
    _entity_list: 'mel_operational_incident'
  requirements:
    _custom_access: 'myeventlane_tickets.operational_incident_access:accessOperationalIncidentWorkspace'
    _permission: 'manage mel operational incidents'
  options:
    _admin_route: TRUE

myeventlane_tickets.operational_incident_add:
  path: '/admin/mel/operations/incidents/add'
  defaults:
    _form: '\Drupal\myeventlane_tickets\Form\OperationalIncidentCreateForm'
    _title: 'Register operational incident'
  requirements:
    _custom_access: 'myeventlane_tickets.operational_incident_access:accessOperationalIncidentWorkspace'
    _permission: 'manage mel operational incidents'
  options:
    _admin_route: TRUE

myeventlane_tickets.operational_incident_coordination:
  path: '/admin/mel/operations/incidents/{mel_operational_incident}'
  defaults:
    _form: '\Drupal\myeventlane_tickets\Form\OperationalIncidentCoordinationForm'
    _title: 'Operational incident coordination'
  requirements:
    _custom_access: 'myeventlane_tickets.operational_incident_access:accessOperationalIncidentWorkspace'
    _permission: 'manage mel operational incidents'
  options:
    _admin_route: TRUE
    parameters:
      mel_operational_incident:
        type: entity:mel_operational_incident

# Admin settings page.
myeventlane_tickets.settings:
  path: '/admin/config/myeventlane/tickets'
  defaults:
    _form: '\Drupal\myeventlane_tickets\Form\TicketSettingsForm'
    _title: 'Ticket settings'
  requirements:
    _permission: 'administer myeventlane tickets'
  options:
    _admin_route: TRUE

# Ticket PDF download (legacy by order item ID).
myeventlane_tickets.download_pdf:
  path: '/ticket/pdf/{order_item_id}'
  defaults:
    _controller: '\Drupal\myeventlane_tickets\Controller\TicketDownloadController::download'
    _title: 'Download Ticket PDF'
  requirements:
    _permission: 'access content'
    order_item_id: '\d+'

# Assign holder details to an unassigned ticket (token-validated).
myeventlane_tickets.assign_ticket:
  path: '/ticket/assign/{token}'
  defaults:
    _form: '\Drupal\myeventlane_tickets\Form\AssignTicketForm'
    _title: 'Assign ticket'
  requirements:
    _permission: 'access content'
    token: '[A-Za-z0-9+/=_-]+'
  options:
    _admin_route: FALSE

# Canonical ticket PDF download by ticket code.
myeventlane_tickets.download_pdf_by_code:
  path: '/ticket/{ticket_code}/pdf'
  defaults:
    _controller: '\Drupal\myeventlane_tickets\Controller\TicketDownloadController::downloadByCode'
    _title: 'Download Ticket PDF'
  requirements:
    _permission: 'access content'
    # MEL codes and legacy alphanumeric codes; no slashes in segment.
    ticket_code: '[^/]+'

