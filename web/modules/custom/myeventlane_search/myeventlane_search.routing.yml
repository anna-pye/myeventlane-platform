# Public event discovery search page. Anonymous-safe published upcoming events via
# Search API indexes; no order, vendor payout, or account data exposed.
mel_search.view:
  path: /search
  defaults:
    _controller: '\Drupal\myeventlane_search\Controller\SearchController::build'
    _title: 'Search'
  requirements:
    _access: 'TRUE'

# Public search autocomplete JSON. Anonymous-safe event titles, venues, and categories
# from the same Search API indexes as /search; no private entity fields returned.
mel_search.autocomplete:
  path: /search/autocomplete
  defaults:
    _controller: '\Drupal\myeventlane_search\Controller\SearchAutocompleteController::autocomplete'
  requirements:
    _access: 'TRUE'
