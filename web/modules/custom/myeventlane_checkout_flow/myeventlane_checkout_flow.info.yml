name: 'MyEventLane Checkout Flow'
type: module
description: 'Custom single-page checkout flow for MyEventLane events. Provides Humanitix-level checkout experience with grouped panes, donation support, and fee transparency.'
package: MyEventLane
core_version_requirement: ^11
lifecycle: stable

dependencies:
  - myeventlane_surface:myeventlane_surface
  - myeventlane_event:myeventlane_event
  - myeventlane_legal
  - myeventlane_api
  - myeventlane_commerce
  - myeventlane_checkout_paragraph
  - myeventlane_donations
  - myeventlane_event_attendees:myeventlane_event_attendees
  - myeventlane_tickets:myeventlane_tickets
  - myeventlane_vendor:myeventlane_vendor
  - drupal:commerce_checkout
  - drupal:commerce_order
  - drupal:commerce_payment
  - drupal:commerce_price
  - drupal:node
  - commerce_stripe:commerce_stripe
  - drupal:paragraphs
