services:
  myeventlane_checkout_flow.attendee_event_stats:
    class: Drupal\myeventlane_checkout_flow\Service\AttendeeEventStatsService
    arguments:
      $dateFormatter: '@date.formatter'
      $moduleHandler: '@module_handler'
      $ticketSales: '@?myeventlane_vendor.service.ticket_sales'
      $rsvpStats: '@?myeventlane_vendor.service.rsvp_stats'
      $capacityService: '@?myeventlane_capacity.service'
      $eventStats: '@?myeventlane_event.stats'

  myeventlane_checkout_flow.checkout_ux_attacher:
    class: Drupal\myeventlane_checkout_flow\Service\CheckoutUxAttacher
    arguments:
      - '@myeventlane_checkout_flow.checkout_summary_presenter'
      - '@current_route_match'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@entity_type.manager'
      - '@myeventlane_surface.state_readiness_helper'

  myeventlane_checkout_flow.checkout_summary_presenter:
    class: Drupal\myeventlane_checkout_flow\Service\MelCheckoutSummaryPresenter
    arguments:
      - '@myeventlane_checkout_flow.checkout_grouped_summary_builder'
      - '@myeventlane_surface.state_readiness_helper'
      - '@myeventlane_surface.governed_operational_templates'

  myeventlane_checkout_flow.order_pricing_breakdown:
    class: Drupal\myeventlane_checkout_flow\Service\OrderPricingBreakdownBuilder
    arguments:
      - '@commerce_price.currency_formatter'
      - '@entity_type.manager'
      - '@config.factory'
      - '@myeventlane_commerce.order_item_classifier'
      - '@myeventlane_surface.state_readiness_helper'

  myeventlane_checkout_flow.checkout_grouped_summary_builder:
    class: Drupal\myeventlane_checkout_flow\Service\CheckoutGroupedSummaryBuilder
    arguments:
      - '@entity_type.manager'
      - '@commerce_price.currency_formatter'
      - '@date.formatter'
      - '@myeventlane_checkout_flow.order_pricing_breakdown'
      - '@myeventlane_event.booking_flow_resolver'
      - '@myeventlane_commerce.order_item_classifier'
      - '@myeventlane_surface.state_readiness_helper'
      - '@file_url_generator'

  myeventlane_checkout_flow.tax_invoice_presentation:
    class: Drupal\myeventlane_checkout_flow\Service\TaxInvoicePresentationBuilder
    arguments:
      - '@commerce_price.currency_formatter'
      - '@date.formatter'
      - '@myeventlane_checkout_flow.order_pricing_breakdown'

  myeventlane_checkout_flow.vendor_ownership_resolver:
    class: Drupal\myeventlane_checkout_flow\Service\VendorOwnershipResolver
    arguments:
      - '@entity_type.manager'
      - '@?myeventlane_vendor.current_vendor_resolver'

  myeventlane_checkout_flow.fast_checkout_eligibility:
    class: Drupal\myeventlane_checkout_flow\Service\FastCheckoutEligibility
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_checkout_paragraph.checkout_attendee_schema'
      - '@logger.channel.myeventlane_checkout_flow'

  myeventlane_checkout_flow.fast_checkout_access_check:
    class: Drupal\myeventlane_checkout_flow\Access\FastCheckoutAccessCheck
    arguments:
      - '@myeventlane_checkout_flow.fast_checkout_eligibility'

  myeventlane_checkout_flow.my_tickets_order_access:
    class: Drupal\myeventlane_checkout_flow\Access\MyTicketsOrderAccess
    arguments: ['@entity_type.manager']

  myeventlane_checkout_flow.my_tickets_order_view_model_builder:
    class: Drupal\myeventlane_checkout_flow\Service\MyTicketsOrderViewModelBuilder
    arguments:
      - '@entity_type.manager'
      - '@myeventlane_tickets.universal_ticket_view_model_builder'
      - '@myeventlane_core.ticket_label_resolver'

  logger.channel.myeventlane_checkout_flow:
    parent: logger.channel_base
    arguments: ['myeventlane_checkout_flow']

  myeventlane_checkout_flow.checkout_attendee_requirement_resolver:
    class: Drupal\myeventlane_checkout_flow\Service\MelCheckoutAttendeeRequirementResolver
    arguments:
      - '@myeventlane_checkout_paragraph.checkout_attendee_schema'

  myeventlane_checkout_flow.checkout_rate_limit_subscriber:
    class: Drupal\myeventlane_checkout_flow\EventSubscriber\CheckoutRateLimitSubscriber
    arguments:
      - '@myeventlane_api.rate_limiter'
      - '@config.factory'
      - '@current_route_match'
      - '@logger.channel.myeventlane_checkout_flow'
    tags:
      - { name: event_subscriber }

  myeventlane_checkout_flow.fast_checkout_route_subscriber:
    class: Drupal\myeventlane_checkout_flow\EventSubscriber\FastCheckoutRouteSubscriber
    tags:
      - { name: event_subscriber }

  # MEL Attendee Operations Layer
  # Single operational presenter, access policy, export builder, and check-in
  # transition manager for vendor attendee surfaces. See
  # docs/adoption/mel-attendee-operations-audit.md.
  myeventlane_checkout_flow.attendee_operations_access:
    class: Drupal\myeventlane_checkout_flow\Service\MelAttendeeOperationsAccess
    arguments:
      - '@myeventlane_vendor.event_access_checker'
      - '@logger.channel.myeventlane_checkout_flow'

  myeventlane_checkout_flow.attendee_operations_presenter:
    class: Drupal\myeventlane_checkout_flow\Service\MelAttendeeOperationsPresenter
    arguments:
      - '@myeventlane_event_attendees.manager'
      - '@myeventlane_event_attendees.vendor_presentation'
      - '@date.formatter'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@string_translation'

  myeventlane_checkout_flow.attendee_checkin_manager:
    class: Drupal\myeventlane_checkout_flow\Service\MelAttendeeCheckinManager
    arguments:
      - '@myeventlane_event_attendees.manager'
      - '@myeventlane_checkout_flow.attendee_operations_access'
      - '@datetime.time'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@entity_type.manager'

  myeventlane_checkout_flow.door_checkin_validate:
    class: Drupal\myeventlane_checkout_flow\Service\MelDoorCheckinValidateService
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@date.formatter'
      - '@?myeventlane_checkout_paragraph.checkin_token'
      - '@myeventlane_checkout_flow.attendee_checkin_manager'

  myeventlane_checkout_flow.venue_operations_view_model:
    class: Drupal\myeventlane_checkout_flow\Service\MelVenueOperationsViewModelBuilder
    arguments:
      - '@myeventlane_checkout_flow.attendee_checkin_manager'
      - '@myeventlane_checkout_flow.attendee_operations_presenter'
      - '@myeventlane_event_attendees.manager'
      - '@myeventlane_event_attendees.vendor_presentation'
      - '@myeventlane_surface.state_readiness_helper'
      - '@date.formatter'
      - '@string_translation'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@datetime.time'
      - '@csrf_token'

  myeventlane_checkout_flow.controller.vendor_event_operations:
    class: Drupal\myeventlane_checkout_flow\Controller\VendorEventOperationsController
    arguments:
      - '@myeventlane_core.domain_detector'
      - '@current_user'
      - '@messenger'
      - '@myeventlane_checkout_flow.venue_operations_view_model'
      - '@myeventlane_vendor.service.event_tabs'
      - '@myeventlane_surface.governed_operational_templates'
      - '@myeventlane_checkout_flow.attendee_operations_access'
      - '@myeventlane_checkout_flow.door_checkin_validate'
      - '@csrf_token'
      - '@module_handler'
    tags:
      - { name: controller.service_arguments }

