services:
  myeventlane_checkout_flow.attendee_event_stats:
    class: Drupal\myeventlane_checkout_flow\Service\AttendeeEventStatsService
    arguments:
      $dateFormatter: '@date.formatter'
      $moduleHandler: '@module_handler'
      $ticketSales: '@?myeventlane_vendor.service.ticket_sales'
      $rsvpStats: '@?myeventlane_vendor.service.rsvp_stats'
      $capacityService: '@?myeventlane_capacity.service'
      $eventStats: '@?myeventlane_event.stats'

  myeventlane_checkout_flow.checkout_ux_attacher:
    class: Drupal\myeventlane_checkout_flow\Service\CheckoutUxAttacher
    arguments:
      - '@myeventlane_checkout_flow.checkout_grouped_summary_builder'
      - '@current_route_match'
      - '@logger.channel.myeventlane_checkout_flow'
      - '@entity_type.manager'

  myeventlane_checkout_flow.checkout_grouped_summary_builder:
    class: Drupal\myeventlane_checkout_flow\Service\CheckoutGroupedSummaryBuilder
    arguments:
      - '@entity_type.manager'
      - '@commerce_price.currency_formatter'
      - '@date.formatter'

  myeventlane_checkout_flow.tax_invoice_presentation:
    class: Drupal\myeventlane_checkout_flow\Service\TaxInvoicePresentationBuilder
    arguments:
      - '@commerce_price.currency_formatter'
      - '@date.formatter'

  myeventlane_checkout_flow.vendor_ownership_resolver:
    class: Drupal\myeventlane_checkout_flow\Service\VendorOwnershipResolver
    arguments: ['@entity_type.manager']

  myeventlane_checkout_flow.my_tickets_order_access:
    class: Drupal\myeventlane_checkout_flow\Access\MyTicketsOrderAccess
    arguments: ['@entity_type.manager']

  logger.channel.myeventlane_checkout_flow:
    parent: logger.channel_base
    arguments: ['myeventlane_checkout_flow']

  myeventlane_checkout_flow.checkout_rate_limit_subscriber:
    class: Drupal\myeventlane_checkout_flow\EventSubscriber\CheckoutRateLimitSubscriber
    arguments:
      - '@myeventlane_api.rate_limiter'
      - '@config.factory'
      - '@current_route_match'
      - '@logger.channel.myeventlane_checkout_flow'
    tags:
      - { name: event_subscriber }

