    arguments:
      - '@myeventlane_surface.workflow_resolver'
      - '@myeventlane_surface.workflow_registry'
      - '@myeventlane_surface.operational_policy_manager'
      - '@myeventlane_surface.workflow_manager'
      - '@logger.channel.myeventlane_surface'

  myeventlane_surface.access_helper:
    class: Drupal\myeventlane_surface\SurfaceAccessHelper
    arguments:
      - '@current_route_match'
      - '@request_stack'

  myeventlane_surface.block_governor:
    class: Drupal\myeventlane_surface\Block\SurfaceBlockGovernor
    arguments:
      - '@myeventlane_surface.resolver'
      - '@myeventlane_surface.access_helper'

  myeventlane_surface.route_subscriber:
    class: Drupal\myeventlane_surface\EventSubscriber\SurfaceRouteSubscriber
    arguments:
      - '@current_route_match'
      - '@current_user'
      - '@logger.channel.myeventlane_surface'
    tags:
      - { name: event_subscriber }

  logger.channel.myeventlane_surface:
    parent: logger.channel_base
    arguments: ['myeventlane_surface']

  myeventlane_surface.form_classification_resolver:
    class: Drupal\myeventlane_surface\MelFormClassificationResolver
