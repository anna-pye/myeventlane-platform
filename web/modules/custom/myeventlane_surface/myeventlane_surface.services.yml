      - '@myeventlane_surface.intelligence_registry'
      - '@myeventlane_surface.workflow_resolver'
      - '@myeventlane_surface.state_resolver'
      - '@myeventlane_surface.state_registry'
      - '@myeventlane_surface.experience_manager'
      - '@myeventlane_surface.recommendation_resolver'
      - '@myeventlane_surface.priority_resolver'
      - '@myeventlane_surface.adaptive_guidance_helper'
      - '@myeventlane_surface.engagement_orchestrator'
      - '@myeventlane_surface.insight_helper'
      - '@myeventlane_surface.intelligence_accessibility_helper'
      - '@myeventlane_surface.operational_policy_manager'
      - '@module_handler'
      - '@logger.channel.myeventlane_surface'
      - '@myeventlane_surface.state_readiness_helper'

  myeventlane_surface.operational_policy_registry:
    class: Drupal\myeventlane_surface\MelOperationalPolicyRegistry

  myeventlane_surface.policy_resolver:
    class: Drupal\myeventlane_surface\MelPolicyResolver
    arguments:
      - '@myeventlane_surface.operational_policy_registry'

  myeventlane_surface.policy_trust_threshold_helper:
    class: Drupal\myeventlane_surface\MelTrustThresholdHelper

  myeventlane_surface.policy_escalation_helper:
    class: Drupal\myeventlane_surface\MelEscalationPolicyHelper

  myeventlane_surface.policy_suppression_helper:
    class: Drupal\myeventlane_surface\MelSuppressionPolicyHelper
    arguments:
      - '@myeventlane_surface.operational_policy_registry'

  myeventlane_surface.policy_automation_boundary_helper:
    class: Drupal\myeventlane_surface\MelAutomationBoundaryHelper

  myeventlane_surface.policy_communication_helper:
    class: Drupal\myeventlane_surface\MelCommunicationPolicyHelper

  myeventlane_surface.policy_accessibility_helper:
    class: Drupal\myeventlane_surface\MelPolicyAccessibilityHelper

  myeventlane_surface.operational_policy_manager:
    class: Drupal\myeventlane_surface\MelOperationalPolicyManager
    arguments:
      - '@myeventlane_surface.operational_policy_registry'
      - '@myeventlane_surface.policy_resolver'
      - '@myeventlane_surface.state_registry'
      - '@myeventlane_surface.state_resolver'
      - '@myeventlane_surface.policy_trust_threshold_helper'
      - '@myeventlane_surface.policy_escalation_helper'
      - '@myeventlane_surface.policy_suppression_helper'
      - '@myeventlane_surface.policy_automation_boundary_helper'
