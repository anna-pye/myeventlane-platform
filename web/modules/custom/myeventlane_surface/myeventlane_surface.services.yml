  myeventlane_surface.state_trust_helper:
    class: Drupal\myeventlane_surface\MelTrustStateHelper

  myeventlane_surface.state_eligibility_helper:
    class: Drupal\myeventlane_surface\MelEligibilityHelper

  myeventlane_surface.state_accessibility_helper:
    class: Drupal\myeventlane_surface\MelStateAccessibilityHelper

  myeventlane_surface.state_manager:
    class: Drupal\myeventlane_surface\MelStateManager
    arguments:
      - '@myeventlane_surface.state_registry'
      - '@myeventlane_surface.state_resolver'
      - '@myeventlane_surface.state_readiness_helper'
      - '@myeventlane_surface.state_lifecycle_helper'
      - '@myeventlane_surface.state_trust_helper'
      - '@myeventlane_surface.state_eligibility_helper'
      - '@myeventlane_surface.state_accessibility_helper'
