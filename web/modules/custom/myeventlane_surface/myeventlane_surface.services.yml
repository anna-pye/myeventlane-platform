services:
  myeventlane_surface.manager:
    class: Drupal\myeventlane_surface\SurfaceManager
    arguments:
      - '@myeventlane_surface.registry'

  myeventlane_surface.registry:
    class: Drupal\myeventlane_surface\SurfaceRegistry

  myeventlane_surface.resolver:
    class: Drupal\myeventlane_surface\SurfaceResolver
    arguments:
      - '@current_route_match'
      - '@request_stack'

  myeventlane_surface.insight_helper:
    class: Drupal\myeventlane_surface\MelInsightHelper
    arguments:
      - '@string_translation'

  myeventlane_surface.intelligence_registry:
    class: Drupal\myeventlane_surface\MelIntelligenceRegistry

  myeventlane_surface.recommendation_resolver:
    class: Drupal\myeventlane_surface\MelRecommendationResolver

  myeventlane_surface.priority_resolver:
    class: Drupal\myeventlane_surface\MelPriorityResolver

  myeventlane_surface.adaptive_guidance_helper:
    class: Drupal\myeventlane_surface\MelAdaptiveGuidanceHelper

  myeventlane_surface.engagement_orchestrator:
    class: Drupal\myeventlane_surface\MelEngagementOrchestrator

  myeventlane_surface.intelligence_accessibility_helper:
    class: Drupal\myeventlane_surface\MelIntelligenceAccessibilityHelper

  myeventlane_surface.intelligence_manager:
    class: Drupal\myeventlane_surface\MelIntelligenceManager
