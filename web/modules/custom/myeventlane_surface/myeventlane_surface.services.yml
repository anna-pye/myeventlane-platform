  myeventlane_surface.data_accessibility:
    class: Drupal\myeventlane_surface\MelDataAccessibilityHelper

  myeventlane_surface.data_presentation_manager:
    class: Drupal\myeventlane_surface\MelDataPresentationManager
    arguments:
      - '@myeventlane_surface.resolver'
      - '@myeventlane_surface.data_presentation_registry'
      - '@myeventlane_surface.component_manager'
      - '@myeventlane_surface.data_table_helper'
      - '@myeventlane_surface.metric_helper'
      - '@myeventlane_surface.analytics_helper'

  myeventlane_surface.data_presentation_preprocess:
    class: Drupal\myeventlane_surface\MelDataPresentationPreprocess
    arguments:
      - '@myeventlane_surface.resolver'
      - '@myeventlane_surface.data_presentation_manager'
      - '@myeventlane_surface.data_table_helper'
      - '@myeventlane_surface.metric_helper'
      - '@myeventlane_surface.analytics_helper'
      - '@myeventlane_surface.data_accessibility'

  myeventlane_surface.interaction_registry:
    class: Drupal\myeventlane_surface\MelInteractionRegistry

  myeventlane_surface.focus_manager:
    class: Drupal\myeventlane_surface\MelFocusManager

  myeventlane_surface.interaction_accessibility:
    class: Drupal\myeventlane_surface\MelInteractionAccessibilityHelper

  myeventlane_surface.modal_helper:
