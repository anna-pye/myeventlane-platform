  myeventlane_surface.async_state_helper:
    class: Drupal\myeventlane_surface\MelAsyncStateHelper
    arguments:
      - '@myeventlane_surface.interaction_accessibility'

  myeventlane_surface.disclosure_helper:
    class: Drupal\myeventlane_surface\MelDisclosureHelper
    arguments:
      - '@myeventlane_surface.interaction_registry'
      - '@myeventlane_surface.interaction_accessibility'

  myeventlane_surface.interaction_manager:
    class: Drupal\myeventlane_surface\MelInteractionManager
    arguments:
      - '@myeventlane_surface.resolver'
      - '@current_route_match'
      - '@request_stack'
      - '@myeventlane_surface.interaction_registry'
      - '@myeventlane_surface.focus_manager'

