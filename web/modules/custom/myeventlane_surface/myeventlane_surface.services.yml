  myeventlane_surface.governance_payload_inspector:
    class: Drupal\myeventlane_surface\MelGovernancePayloadInspector

  myeventlane_surface.governance_presentation_sanitizer:
    class: Drupal\myeventlane_surface\MelGovernancePresentationSanitizer

  myeventlane_surface.observability_manager:
    class: Drupal\myeventlane_surface\MelObservabilityManager
    arguments:
      - '@myeventlane_surface.observability_registry'
      - '@myeventlane_surface.trace_resolver'
      - '@myeventlane_surface.observability_suppression_trace_helper'
      - '@myeventlane_surface.observability_state_trace_helper'
      - '@myeventlane_surface.observability_experience_trace_helper'
      - '@myeventlane_surface.observability_intelligence_trace_helper'
      - '@myeventlane_surface.observability_policy_trace_helper'
      - '@myeventlane_surface.telemetry_boundary_helper'
      - '@myeventlane_surface.observability_accessibility_helper'
      - '@myeventlane_surface.workflow_resolver'
      - '@myeventlane_surface.state_resolver'
      - '@myeventlane_surface.state_registry'
      - '@myeventlane_surface.observability_diagnostics_access'
      - '@module_handler'
      - '@logger.channel.myeventlane_surface'
      - '@string_translation'

  myeventlane_surface.negotiator:
    class: Drupal\myeventlane_surface\SurfaceNegotiator
    arguments:
      - '@myeventlane_surface.resolver'
      - '@myeventlane_surface.manager'
      - '@myeventlane_surface.form_manager'
      - '@myeventlane_surface.component_manager'
      - '@myeventlane_surface.navigation_manager'
      - '@myeventlane_surface.workflow_manager'
      - '@myeventlane_surface.data_presentation_manager'
