      - '@logger.channel.myeventlane_surface'
      - '@string_translation'

  myeventlane_surface.observability_registry:
    class: Drupal\myeventlane_surface\MelObservabilityRegistry

  myeventlane_surface.trace_resolver:
    class: Drupal\myeventlane_surface\MelTraceResolver
    arguments:
      - '@myeventlane_surface.observability_registry'

  myeventlane_surface.observability_suppression_trace_helper:
    class: Drupal\myeventlane_surface\MelSuppressionTraceHelper
    arguments:
      - '@string_translation'

  myeventlane_surface.observability_state_trace_helper:
    class: Drupal\myeventlane_surface\MelStateTraceHelper
