# MyEventLane Vendor Theme Libraries
# Built with Vite; outputs live in dist/ (main.css / main.js — not style.css / app.js).

# Canonical global bundle for vendor pages (attached via info.yml + page_attachments_alter).
global:
  css:
    theme:
      dist/main.css: {}
  js:
    dist/main.js: { attributes: { type: module } }
  dependencies:
    - core/drupal
    - core/once

# Backward-compatible alias: other libraries and modules may depend on this name.
global-styling:
  dependencies:
    - myeventlane_vendor_theme/global

form-protection:
  js:
    src/js/form-protection.js: {}
  dependencies:
    - core/drupal
    - core/once

# Internal dashboard footer accordion (replaces myeventlane_theme/footer-internal on vendor).
footer-internal:
  js:
    js/footer-accordion.js: {}
  dependencies:
    - core/drupal
    - core/once

# Vendor dashboard shell styles (global bundle includes TASK 5 dashboard SCSS).
dashboard:
  dependencies:
    - myeventlane_vendor_theme/global-styling

mel_event_card_remove:
  js:
    js/mel-event-card-remove.js: {}
  dependencies:
    - core/drupal
    - core/once

# Chart.js library (CDN)
chartjs:
  version: 4.4.1
  js:
    https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js: { type: external, minified: true }

# Event form with tabs and validation
event-form:
  dependencies:
    - myeventlane_vendor_theme/global-styling
    - core/drupal.form
    - core/drupal.states
    - core/drupal.ajax

# Analytics page
analytics:
  dependencies:
    - myeventlane_vendor_theme/global-styling
    - myeventlane_vendor_theme/chartjs

# Event overview (Mission Control) — charts + layout tokens
event_overview:
  dependencies:
    - myeventlane_vendor_theme/global-styling
    - myeventlane_vendor_theme/chartjs

# Vendor workspace UI shell (Event Studio grid + studio chrome).
# Built by Vite from src/scss/workspace.scss — same pipeline as global (main.css).
vendor-workspace:
  css:
    theme:
      dist/workspace.css: {}
  js:
    js/vendor-studio.js: {}
  dependencies:
    - core/drupal
    - core/once
    - myeventlane_vendor_theme/global-styling

# Vendor Event Wizard
vendor_wizard:
  css:
    theme:
      dist/vendor-wizard.css: {}
  dependencies:
    - core/drupal
    - core/drupal.form

# Organiser events list (/vendor/events): list/grid toggle.
mel_vendor_events:
  js:
    js/mel-events-toggle.js: {}
  dependencies:
    - core/drupal
    - core/once
    - myeventlane_vendor_theme/global-styling
    - myeventlane_vendor_theme/mel_event_card_remove

mel_notifications:
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - myeventlane_notifications/user_experience

# Node add event: header Save draft is outside <form>; delegate to real submit.
vendor_event_form_page:
  js:
    js/vendor-event-form-page.js: {}
  dependencies:
    - core/drupal
    - core/once
