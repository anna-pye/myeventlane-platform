# MyEventLane Theme Libraries
# Built with Vite; outputs live in dist/.

footer-internal:
  js:
    js/footer-accordion.js: {}
  dependencies:
    - core/drupal
    - core/once

global-styling:
  # Main CSS/JS are injected from Vite manifest via hook_library_info_alter().
  dependencies:
    - core/drupal
    - core/once
    - myeventlane_theme/skeleton

# Event card grid: skeleton → content swap (see src/js/skeleton.js).
skeleton:
  js:
    src/js/skeleton.js: {}
  dependencies:
    - core/drupal
    - core/once

# Branded 403/404 (standalone CSS; source SCSS in mel_maintenance/scss/errors.scss).
mel-error-pages:
  version: VERSION
  css:
    theme:
      css/errors.css: {}

myeventlane-global:
  # Legacy alias; assets are injected from Vite manifest via hook_library_info_alter().
  dependencies:
    - core/drupal
    - core/once
    - myeventlane_theme/skeleton

# Account dropdown fallback bundle (kept for legacy attachments).
account-dropdown:
  js:
    dist/account-dropdown.js: {}
  dependencies:
    - core/drupal

# Event form behaviors rely on the main bundle; use dependencies only to avoid
# double-loading scripts while allowing targeted attachment from PHP/Twig.
event-form:
  dependencies:
    - myeventlane_theme/global-styling
    - core/drupal
    - core/drupal.form
    - core/drupal.states

front:
  css:
    theme:
      dist/css/front.css: {}
  js:
    js/mel-cards.js: {}
  dependencies:
    - core/drupal
    - core/once

# Help Centre search (/help/search) — compiled into dist/main.scss via Vite.
help_search:
  dependencies:
    - myeventlane_theme/global-styling

# Listing headers (taxonomy/search/filtered views).
# Reuses the front "above-the-cards" CSS without loading front-only JS.
mel-listing-header:
  css:
    theme:
      dist/css/front.css: {}
  dependencies:
    - core/drupal

# /events listing: date pills + exposed filter bar (bundled in main.css via Vite).
mel-events-discovery:
  dependencies:
    - myeventlane_theme/global-styling
    - core/drupal

# Category discovery chip bar (AJAX, no full page reload).
mel-chips:
  js:
    js/mel-chips.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings

# Homepage discover — chips + Views exposed form submit (use_ajax on embed_discover).
mel-filters:
  js:
    js/mel-filters.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - views/views.ajax

# Event page (Poster Card layout).
# NOTE: This theme uses Vite to compile SCSS into dist/main.css. The event-page
# styling lives in src/scss/components/_event-page.scss and is bundled via
# src/scss/main.scss. This library is a Drupal attachment hook + dependencies.
event-page:
  dependencies:
    - myeventlane_theme/global-styling
    - core/drupal
    - core/drupalSettings

# Event wizard form styling.
# CSS for the vendor event creation wizard.
event-wizard:
  dependencies:
    - core/drupal
    - core/drupal.form
    - core/drupal.states
    - myeventlane_theme/global-styling

# Alias: vendor event builder preview assets live in myeventlane_event module.
event-builder-preview:
  dependencies:
    - myeventlane_event/event_builder_preview

# Event full node page styling.
# Styles are compiled via Vite into dist/main.css from src/scss/pages/_event.scss.
myeventlane_event_full:
  dependencies:
    - core/drupal
    - core/once
    - myeventlane_location/event_map
    - myeventlane_theme/global-styling
  js:
    js/event-full-trust-rotator.js: { attributes: { defer: true } }

# Commerce pages: toast-style add-to-cart messages (attached via page_attachments).
mel_toasts:
  js:
    js/mel-toasts.js: {}
  dependencies:
    - core/drupal

# In-app notification polling + toast stack (MyEventLane notifications module).
mel_notifications:
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    - myeventlane_notifications/user_experience

# RSVP sidebar accordion (Accessibility + Support sections on event book page).
rsvp_sidebar:
  js:
    js/rsvp-accordion.js: {}
  dependencies:
    - core/drupal
    - core/once

# Checkout form behaviour: first-error scroll/focus and structured layout hooks.
mel_checkout:
  js:
    js/mel-checkout.js: {}
  dependencies:
    - core/drupal
    - core/once

# Contact /support entry (/contact). Styles are compiled into dist/main.css via
# src/scss/pages/_contact.scss; this library ensures the bundle is referenced
# when the contact form template attaches it.
contact_page:
  dependencies:
    - myeventlane_theme/global-styling

# Auth pages: register and password reset (CSS only). Login uses Gin Login only.
# Attached on user.register, user.pass — not on user.login.
auth_pages:
  css:
    theme:
      css/auth-pages.css: {}

vendor-studio:
  js:
    js/event-navigator.js: {}
    js/editor-sections.js: {}
  dependencies:
    - myeventlane_theme/global-styling
    - core/drupal
    - core/once

# Confirmation page: copy event link button.
mel_confirmation:
  js:
    js/mel-confirmation-share.js: {}
  dependencies:
    - core/drupal
    - core/once

# Live order summary + mobile totals on /event/{nid}/book (paid ticket matrix only).
mel_booking_summary:
  js:
    js/mel-booking-summary.js: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once