# Loaded via settings.mel_shared_session.php when running under DDEV.
# Full session.storage.options (Drupal requires the whole array when overriding).
parameters:
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    gc_maxlifetime: 200000
    cookie_lifetime: 2000000
    # Apple returns scoped authorisation responses with a cross-site POST.
    # SameSite=None keeps the OAuth state session available for that callback.
    cookie_samesite: None
    name_suffix: ''
    cookie_httponly: true
    cookie_domain: '.myeventlane.ddev.site'
