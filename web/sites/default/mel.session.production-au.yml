# Production AU (*.myeventlane.com.au, excluding *.staging.*) — shared session across subdomains.
parameters:
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    gc_maxlifetime: 200000
    cookie_lifetime: 2000000
    cookie_samesite: Lax
    name_suffix: ''
    cookie_httponly: true
    cookie_domain: '.myeventlane.com.au'
