# Staging (*.staging.myeventlane.com) — shared session across apex / vendor / admin.
parameters:
  session.storage.options:
    gc_probability: 1
    gc_divisor: 100
    gc_maxlifetime: 200000
    cookie_lifetime: 2000000
    # Required for Apple's scope-bearing form_post OAuth callback.
    cookie_samesite: None
    name_suffix: ''
    cookie_httponly: true
    cookie_domain: '.staging.myeventlane.com'
