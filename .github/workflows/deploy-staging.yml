name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build staging artifact
    uses: ./.github/workflows/reusable-build.yml
    with:
      # Pin checkout to the exact commit that triggered this run (avoids wrong-tree / stale builds).
      ref: ${{ github.sha }}

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    environment: staging

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./artifact

      - name: Debug artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lah ./artifact
          if [ ! -f ./artifact/artifact.tar.gz ]; then
            echo "ERROR: ./artifact/artifact.tar.gz not found"
            exit 1
          fi

      - name: Inspect artifact contents
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for deploy script in artifact..."
          tar -tzf ./artifact/artifact.tar.gz | grep scripts/deploy/remote-deploy.sh || {
            echo "ERROR: deploy script missing from artifact"
            exit 1
          }

      - name: Write SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Validate SSH key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Add known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH config
        shell: bash
        run: |
          echo "USER: ${{ secrets.SSH_USER }}"
          echo "HOST: ${{ secrets.SSH_HOST }}"

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo CONNECTED"

      - name: Upload artifact to staging server
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 ./artifact/artifact.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/artifact.tar.gz"

      # Heredoc body cannot start at column 0 inside YAML `run: |` (invalid YAML).
      # This block is equivalent to the requested ssh … <<'EOF' … EOF remote script.
      - name: Run remote deploy script
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'set -euo pipefail' \
            '' \
            'temp_dir="$(mktemp -d)"' \
            'trap '\''rm -rf "$temp_dir"; rm -f /tmp/artifact.tar.gz'\'' EXIT' \
            '' \
            'echo "TEMP DIR:"' \
            'echo "$temp_dir"' \
            '' \
            'echo "Extracting artifact..."' \
            'tar -xzf /tmp/artifact.tar.gz -C "$temp_dir"' \
            '' \
            'echo "TEMP DIR CONTENTS:"' \
            'ls -lah "$temp_dir"' \
            '' \
            'echo "Running deploy..."' \
            'cd "$temp_dir"' \
            '' \
            'APP_PATH="$HOME/staging" \' \
            'APP_ENV=staging \' \
            'SITE_URI="https://staging.myeventlane.com.au" \' \
            'ARTIFACT_PATH="$temp_dir" \' \
            'bash scripts/deploy/remote-deploy.sh' \
            | ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "ls -lt ~/staging/releases"
