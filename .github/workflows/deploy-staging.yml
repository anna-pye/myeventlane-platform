name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build staging artifact
    uses: ./.github/workflows/reusable-build.yml
    with:
      # Pin checkout to the exact commit that triggered this run (avoids wrong-tree / stale builds).
      ref: ${{ github.sha }}

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    environment: staging

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./artifact

      - name: Debug artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lah ./artifact
          if [ ! -f ./artifact/artifact.tar.gz ]; then
            echo "ERROR: ./artifact/artifact.tar.gz not found"
            exit 1
          fi

      - name: Inspect artifact contents
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking for deploy script in artifact..."
          tar -tzf ./artifact/artifact.tar.gz | grep scripts/deploy/remote-deploy.sh || {
            echo "ERROR: deploy script missing from artifact"
            exit 1
          }

      - name: Diagnose extracted release artifact
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          debug_marker="MEL REMOTE DEPLOY DEBUG BUILD"
          deploy_script="$temp_dir/scripts/deploy/remote-deploy.sh"
          deploy_dir="$temp_dir/scripts/deploy"

          tar -xzf ./artifact/artifact.tar.gz -C "$temp_dir"

          echo "===== EXTRACTED ARTIFACT ====="
          grep "$debug_marker" "$deploy_script" || true
          sha256sum "$deploy_script"
          ls -la "$deploy_dir"
          find "$temp_dir/scripts" -maxdepth 2 | sort

      - name: Write SSH key
        shell: bash
        env:
          # Prefer env over inline echo so multiline OpenSSH keys are not mangled.
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          umask 077
          # Strip CR (Windows paste) and ensure a trailing newline for OpenSSH.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fail early with a clear message if the secret is truncated/corrupt.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>/tmp/mel_ssh_key_err; then
            echo "ERROR: SSH_PRIVATE_KEY secret is not a usable OpenSSH private key." >&2
            echo "Re-set it with: gh secret set SSH_PRIVATE_KEY < ~/mel-staging-deploy" >&2
            cat /tmp/mel_ssh_key_err >&2 || true
            exit 1
          fi

      - name: Validate SSH key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          echo "SSH private key parses OK"

      - name: Add known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH config
        shell: bash
        run: |
          echo "USER: ${{ secrets.SSH_USER }}"
          echo "HOST: ${{ secrets.SSH_HOST }}"

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo CONNECTED"

      - name: Preflight staging disk space
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -euo pipefail
             APP_PATH="$HOME/staging"
             echo "Staging disk usage before deploy:"
             df -h "$APP_PATH" || df -h "$HOME"
             if [ -d "$APP_PATH/releases" ]; then
               echo "Existing releases:"
               ls -1dt "$APP_PATH/releases"/*/ 2>/dev/null | head -10 || true
             fi'

      - name: Upload artifact to staging server
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 ./artifact/artifact.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/artifact.tar.gz"

      # Heredoc body cannot start at column 0 inside YAML `run: |` (invalid YAML).
      # This block is equivalent to the requested ssh … <<'EOF' … EOF remote script.
      - name: Run remote deploy script
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'set -euo pipefail' \
            '' \
            'temp_dir="$(mktemp -d)"' \
            'trap '\''rm -rf "$temp_dir"; rm -f /tmp/artifact.tar.gz'\'' EXIT' \
            'deploy_script="$temp_dir/scripts/deploy/remote-deploy.sh"' \
            'deploy_dir="$temp_dir/scripts/deploy"' \
            '' \
            'echo "TEMP DIR:"' \
            'echo "$temp_dir"' \
            '' \
            'echo "Extracting artifact..."' \
            'tar -xzf /tmp/artifact.tar.gz -C "$temp_dir"' \
            '' \
            'echo "TEMP DIR CONTENTS:"' \
            'ls -lah "$temp_dir"' \
            '' \
            'echo "Running deploy..."' \
            'cd "$temp_dir"' \
            '' \
            'echo "===== EXECUTING ====="' \
            'pwd' \
            'echo "$temp_dir"' \
            'ls -la "$deploy_dir"' \
            'head -5 "$deploy_script"' \
            '' \
            'APP_PATH="$HOME/staging" \' \
            'APP_ENV=staging \' \
            'SITE_URI="https://staging.myeventlane.com.au" \' \
            'MEL_PUBLIC_DOMAIN="https://staging.myeventlane.com.au" \' \
            'MEL_VENDOR_DOMAIN="https://vendor.staging.myeventlane.com.au" \' \
            'MEL_ADMIN_DOMAIN="https://admin.staging.myeventlane.com.au" \' \
            'MEL_FORCE_DOMAIN_REDIRECTS=0 \' \
            'MEL_REVISION="${{ github.sha }}" \' \
            'MEL_DEPLOY_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \' \
            'MEL_RELEASE_IDENTIFIER="${{ github.run_id }}.${{ github.run_attempt }}" \' \
            'RUN_UPDB=1 \' \
            'RUN_CIM=1 \' \
            'CIM_ALLOWED_DIFFERENCES="crop.type.focal_point,flag.flag.following,image.style.mel_vendor_logo,views.view.flag_followers" \' \
            'ARTIFACT_PATH="$temp_dir" \' \
            'bash scripts/deploy/remote-deploy.sh' \
            | ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "ls -lt ~/staging/releases"

      # Independent provenance check: live release REVISION vs this workflow commit,
      # repository composer.lock, and repository remote-deploy.sh. Fail on mismatch.
      - name: Check out commit for provenance verification
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            composer.lock
            scripts/deploy/remote-deploy.sh
            scripts/deploy/verify-revision-metadata.sh
            scripts/deploy/show-release.sh
          sparse-checkout-cone-mode: false

      - name: Verify deployed REVISION provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/verify-revision-metadata.sh
          chmod +x scripts/deploy/show-release.sh
          expected_lock="$(sha256sum composer.lock | awk '{print $1}')"
          expected_deploy_script="$(sha256sum scripts/deploy/remote-deploy.sh | awk '{print $1}')"
          echo "Expected artifact_sha=${EXPECTED_SHA}"
          echo "Expected composer_lock_sha256=${expected_lock}"
          echo "Expected deploy_script_sha256=${expected_deploy_script}"
          echo "Build output composer_lock_sha256=${{ needs.build.outputs.composer_lock_sha256 }}"

          if [ "${{ needs.build.outputs.composer_lock_sha256 }}" != "$expected_lock" ]; then
            echo "ERROR: build job composer_lock_sha256 output disagrees with repository lockfile" >&2
            exit 1
          fi

          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -euo pipefail
             revision="$HOME/staging/current/REVISION"
             if [ ! -f "$revision" ]; then
               echo "ERROR: missing $revision" >&2
               exit 1
             fi
             cat "$revision"' \
            > /tmp/mel-staging-REVISION

          scripts/deploy/verify-revision-metadata.sh \
            "$EXPECTED_SHA" \
            "$expected_lock" \
            "$expected_deploy_script" \
            /tmp/mel-staging-REVISION

          # Local consistency check using the deployed release copy of show-release.sh
          # (only after REVISION fingerprints match this commit).
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -euo pipefail
             release="$HOME/staging/current"
             script="$release/scripts/deploy/show-release.sh"
             if [ ! -x "$script" ]; then
               echo "ERROR: missing executable $script in active release" >&2
               exit 1
             fi
             "$script" --path "$release" --verify --quiet'
