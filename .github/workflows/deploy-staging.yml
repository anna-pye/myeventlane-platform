name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build staging artifact
    uses: ./.github/workflows/reusable-build.yml

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build
    environment: staging

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./artifact

      # ✅ HARD CHECK — fail early if secret missing
      - name: Validate SSH key exists
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY is empty"
            exit 1
          fi

      - name: Write SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add staging host to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          set -euo pipefail
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "echo CONNECTED"

      - name: Upload artifact to staging server
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 \
            ./artifact/artifact.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/artifact.tar.gz"

      - name: Run remote deploy script
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          echo "Extracting artifact..."
          tar -xzf /tmp/artifact.tar.gz -C "$temp_dir"

          echo "Running deploy..."
          cd "$temp_dir"

          APP_PATH="$HOME/staging" \
          SITE_URI="https://staging.myeventlane.com.au" \
          ARTIFACT_PATH="$temp_dir" \
          bash scripts/deploy/remote-deploy.sh

          rm -f /tmp/artifact.tar.gz
          EOF