name: PHP Composer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Config safety check
        run: bash scripts/check-config-safety.sh

      - name: Webroot safety check
        run: bash scripts/check-webroot-safety.sh

      - name: Verify config/sync has no DDEV hostnames
        shell: bash
        run: |
          set -euo pipefail
          if grep -rE 'ddev\.site' config/sync --include='*.yml' --include='*.yaml' 2>/dev/null | grep -q .; then
            echo "::error::config/sync must not contain ddev.site (use staging/production hosts or relative URLs)."
            grep -rE 'ddev\.site' config/sync --include='*.yml' --include='*.yaml' || true
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "8.3"

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Composer security audit
        run: composer audit --no-dev

      - name: Run Drupal check (optional)
        run: vendor/bin/drupal-check web/modules/custom web/themes/custom
        continue-on-error: true

      - name: Governance audit tooling
        run: composer run-script governance:audit

      - name: Governance kernel tests + snapshots
        env:
          SIMPLETEST_DB: "sqlite://localhost/:memory:"
        run: composer run-script governance:test
