name: Reusable Build

on:
  workflow_call:
    outputs:
      artifact_name:
        description: Deployable artifact name
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      ARTIFACT_NAME: staging-release-${{ github.sha }}
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, intl, gd, pdo_mysql
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/themes/custom/myeventlane_theme/package-lock.json

      - name: Verify Node version matches .nvmrc
        shell: bash
        run: |
          set -euo pipefail
          read -r expect < .nvmrc
          expect="$(echo "$expect" | tr -d '\r' | xargs)"
          expect="${expect%%.*}"
          major="$(node -p "process.versions.node.split('.')[0]")"
          if [ "$major" != "$expect" ]; then
            echo "Node major version mismatch: expected ${expect}.x from .nvmrc, got $(node -v)"
            exit 1
          fi

      - name: Log Node and npm versions
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v

      - name: Install root Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: npm ci

      - name: Install Composer dependencies
        shell: bash
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install theme Node dependencies
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        shell: bash
        working-directory: web/themes/custom/myeventlane_theme
        run: npm ci

      - name: Verify theme build reproducibility
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        shell: bash
        working-directory: web/themes/custom/myeventlane_theme
        run: |
          set -euo pipefail
          shopt -s nullglob
          run_build_and_hash() {
            rm -rf dist
            npm run build
            local css=(dist/assets/main*.css)
            if [ "${#css[@]}" -ne 1 ]; then
              echo "ERROR: Expected exactly 1 main*.css after build, found ${#css[@]}"
              exit 1
            fi
            shasum "${css[0]}" | awk '{print $1}'
          }
          HASH1="$(run_build_and_hash)"
          HASH2="$(run_build_and_hash)"
          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: Theme build not reproducible (main CSS hash $HASH1 vs $HASH2)"
            exit 1
          fi
          echo "Theme build reproducibility OK"
          shopt -u nullglob

      # Repo-root `npm run build` is not used here: theme Vite resolves deps from the
      # theme package. Production assets and dist-checksums.txt come from the theme build.

      - name: Generate theme dist checksum manifest
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR="web/themes/custom/myeventlane_theme/dist/assets"
          MANIFEST="dist-checksums.txt"

          echo "== MEL checksum generation =="

          # 1. Ensure clean dist (prevents stale artifacts)
          echo "Cleaning dist directory..."
          rm -rf web/themes/custom/myeventlane_theme/dist

          # 2. Rebuild (must already have run, but enforce consistency)
          echo "Rebuilding theme..."
          cd web/themes/custom/myeventlane_theme
          npm run build
          cd - > /dev/null

          # 3. Validate asset directory exists
          if [ ! -d "$ASSET_DIR" ]; then
            echo "ERROR: Asset directory missing: $ASSET_DIR"
            exit 1
          fi

          # 4. Validate exactly ONE main CSS file
          shopt -s nullglob
          CSS_FILES=("$ASSET_DIR"/main*.css)
          CSS_COUNT=${#CSS_FILES[@]}

          if [ "$CSS_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 main*.css file, found $CSS_COUNT"
            ls -la "$ASSET_DIR"
            exit 1
          fi

          echo "CSS OK: ${CSS_FILES[0]}"

          # 5. Validate JS assets exist
          JS_FILES=("$ASSET_DIR"/*.js)
          JS_COUNT=${#JS_FILES[@]}

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "ERROR: No JS assets found in $ASSET_DIR"
            exit 1
          fi

          echo "JS OK:"
          printf '%s\n' "${JS_FILES[@]}"

          # 6. Ensure no unexpected file types (hard guard)
          INVALID_FILES=$(find "$ASSET_DIR" -type f ! -name "*.css" ! -name "*.js" ! -name "*.map")

          if [ -n "$INVALID_FILES" ]; then
            echo "ERROR: Unexpected files in dist/assets:"
            echo "$INVALID_FILES"
            exit 1
          fi

          # 7. Generate checksum manifest (repo-root-relative paths)
          echo "Generating checksum manifest..."

          rm -f "$MANIFEST"

          shasum "${CSS_FILES[@]}" > "$MANIFEST"
          shasum "${JS_FILES[@]}" >> "$MANIFEST"

          shopt -u nullglob

          echo "Manifest created:"
          cat "$MANIFEST"

          # 8. Final sanity check
          if [ ! -s "$MANIFEST" ]; then
            echo "ERROR: Manifest file is empty"
            exit 1
          fi

          echo "== MEL checksum generation complete =="

      - name: Set artifact metadata
        id: meta
        shell: bash
        run: echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/artifact.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.git/*' \
            --exclude='.ddev' \
            --exclude='.ddev/*' \
            --exclude='node_modules' \
            --exclude='node_modules/*' \
            --exclude='*/node_modules' \
            --exclude='*/node_modules/*' \
            --exclude='tests' \
            --exclude='tests/*' \
            --exclude='*/tests' \
            --exclude='*/tests/*' \
            --exclude='web/sites/*/files' \
            --exclude='web/sites/*/files/*' \
            --exclude='web/sites/*/private' \
            --exclude='web/sites/*/private/*' \
            --exclude='web/sites/*/settings.php' \
            --exclude='web/sites/*/settings.local.php' \
            --exclude='web/sites/*/services.yml' \
            -czf "$archive_path" .
          echo "artifact_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
