name: Reusable Build

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    outputs:
      artifact_name:
        description: Deployable artifact name
        value: ${{ jobs.build.outputs.artifact_name }}
      composer_lock_sha256:
        description: SHA-256 of composer.lock baked into REVISION
        value: ${{ jobs.build.outputs.composer_lock_sha256 }}

permissions:
  contents: read

jobs:
  build:
    name: Build deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      composer_lock_sha256: ${{ steps.package.outputs.composer_lock_sha256 }}
    env:
      ARTIFACT_NAME: staging-release-${{ github.sha }}
      HUSKY: 0

    steps:
      - name: Check out repository (CORRECT REF)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Debug commit
        run: |
          echo "Building commit:"
          git rev-parse HEAD

      - name: Diagnose checked-out deploy script
        run: |
          set -euo pipefail
          debug_marker="MEL REMOTE DEPLOY DEBUG BUILD"
          deploy_script="scripts/deploy/remote-deploy.sh"
          echo "===== WORKSPACE ====="
          git rev-parse HEAD
          git status --short
          grep "$debug_marker" "$deploy_script" || true
          sha256sum "$deploy_script"

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.0
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, intl, gd, pdo_mysql
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/themes/custom/myeventlane_theme/package-lock.json
            web/themes/custom/myeventlane_vendor_theme/package-lock.json

      - name: Install root Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install theme Node dependencies
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        working-directory: web/themes/custom/myeventlane_theme
        run: npm ci

      - name: Build theme assets
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        working-directory: web/themes/custom/myeventlane_theme
        run: npm run build

      - name: Generate theme dist checksum manifest
        if: ${{ hashFiles('web/themes/custom/myeventlane_theme/package.json') != '' }}
        run: |
          set -euo pipefail

          ASSET_DIR="web/themes/custom/myeventlane_theme/dist/assets"
          MANIFEST="dist-checksums.txt"

          rm -rf web/themes/custom/myeventlane_theme/dist

          cd web/themes/custom/myeventlane_theme
          npm run build
          cd -

          [ -d "$ASSET_DIR" ] || { echo "Missing assets"; exit 1; }

          CSS_FILES=$(ls $ASSET_DIR/main*.css 2>/dev/null || true)
          [ "$(echo "$CSS_FILES" | wc -w)" -eq 1 ] || exit 1

          JS_FILES=$(ls $ASSET_DIR/*.js 2>/dev/null || true)
          [ -n "$JS_FILES" ] || exit 1

          rm -f "$MANIFEST"
          sha1sum $ASSET_DIR/main*.css > "$MANIFEST"
          sha1sum $ASSET_DIR/*.js >> "$MANIFEST"

          [ -s "$MANIFEST" ] || exit 1

      # Vendor console theme: dist/ is gitignored; without this step the artifact
      # ships without dist/main.css + main.js and vendor.* domains render unstyled.
      - name: Install vendor theme Node dependencies
        if: ${{ hashFiles('web/themes/custom/myeventlane_vendor_theme/package.json') != '' }}
        working-directory: web/themes/custom/myeventlane_vendor_theme
        run: npm ci

      - name: Build vendor theme assets
        if: ${{ hashFiles('web/themes/custom/myeventlane_vendor_theme/package.json') != '' }}
        working-directory: web/themes/custom/myeventlane_vendor_theme
        run: npm run build

      - name: Validate vendor theme dist
        if: ${{ hashFiles('web/themes/custom/myeventlane_vendor_theme/package.json') != '' }}
        run: |
          set -euo pipefail
          test -f web/themes/custom/myeventlane_vendor_theme/dist/main.css
          test -f web/themes/custom/myeventlane_vendor_theme/dist/main.js
          test -f web/themes/custom/myeventlane_vendor_theme/dist/vendor-wizard.css

      - name: Test deploy config-status parser
        run: bash scripts/deploy/test-config-status-parser.sh

      - name: Test GST config convergence
        run: php scripts/deploy/test-gst-config-convergence.php

      - name: Test deploy domain redirect policy
        run: bash scripts/deploy/test-domain-redirect-policy.sh

      - name: Test stale deployment guard
        run: bash scripts/deploy/test-stale-release-guard.sh

      - name: Set artifact metadata
        id: meta
        run: echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package release artifact
        id: package
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/artifact.tar.gz"

          # Release provenance (KEY=VALUE). Build-time fields only; deploy stamps
          # deploy_time_utc / release_dir without changing activation behaviour.
          test -f composer.lock
          test -f scripts/deploy/remote-deploy.sh
          composer_lock_sha256="$(sha256sum composer.lock | awk '{print $1}')"
          deploy_script_sha256="$(sha256sum scripts/deploy/remote-deploy.sh | awk '{print $1}')"
          build_time_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          branch=""
          tag=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME:-}"
          else
            branch="${GITHUB_REF_NAME:-}"
          fi

          {
            printf 'artifact_sha=%s\n' "${GITHUB_SHA}"
            printf 'branch=%s\n' "${branch}"
            printf 'tag=%s\n' "${tag}"
            printf 'workflow=%s\n' "${GITHUB_WORKFLOW}"
            printf 'workflow_run=%s\n' "${GITHUB_RUN_ID}"
            printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'actor=%s\n' "${GITHUB_ACTOR}"
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'build_time_utc=%s\n' "${build_time_utc}"
            printf 'composer_lock_sha256=%s\n' "${composer_lock_sha256}"
            printf 'deploy_script_sha256=%s\n' "${deploy_script_sha256}"
            printf 'release_identifier=%s.%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
          } > REVISION

          echo "Wrote release REVISION provenance:"
          cat REVISION

          echo "composer_lock_sha256=${composer_lock_sha256}" >> "$GITHUB_OUTPUT"

          tar \
            --exclude='.git' \
            --exclude='.ddev' \
            --exclude='.github' \
            --exclude='.cursor' \
            --exclude='.husky' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='tests' \
            --exclude='*/tests' \
            --exclude='web/sites/*/files' \
            --exclude='web/sites/*/private' \
            --exclude='web/sites/*/settings.php' \
            --exclude='web/sites/*/settings.local.php' \
            --exclude='web/sites/*/services.yml' \
            --exclude='composer.phar' \
            --exclude='_INVALID_config_backup_*' \
            --exclude='_myeventlane_audit' \
            --exclude='*.md' \
            --exclude='*.bak' \
            --exclude='*.sql' \
            --exclude='*.sql.gz' \
            --exclude='web/error_log' \
            --exclude='web/phpinfo-temp.php' \
            --exclude='check-*.sh' \
            --exclude='test-*.sh' \
            --exclude='fix-*.sh' \
            --exclude='reset-*.sh' \
            --exclude='create-*.sh' \
            --exclude='start-*.sh' \
            --exclude='rebuild-*.sh' \
            --exclude='diagnose-*.sh' \
            --exclude='delete-*.php' \
            --exclude='install-*.php' \
            --exclude='create-*.php' \
            --exclude='infrastructure' \
            --exclude='staging-nginx.conf' \
            --exclude='phpcs.xml' \
            --exclude='phpunit-governance.xml' \
            -czf "$archive_path" .

          echo "artifact_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "Artifact size: $(du -h "$archive_path" | awk '{print $1}')"

      - name: Validate artifact REVISION provenance
        run: |
          set -euo pipefail
          archive_path="${{ steps.package.outputs.artifact_path }}"
          member="$(tar -tzf "$archive_path" | grep -E '(^|/)REVISION$' | head -1)"
          if [ -z "$member" ]; then
            echo "❌ Artifact missing top-level REVISION"
            exit 1
          fi
          content="$(tar -xOzf "$archive_path" "$member")"
          echo "===== ARTIFACT REVISION ====="
          printf '%s\n' "$content"
          echo "$content" | grep -qx "artifact_sha=${GITHUB_SHA}" || {
            echo "❌ REVISION artifact_sha must equal GITHUB_SHA (${GITHUB_SHA})"
            exit 1
          }
          echo "$content" | grep -qE '^composer_lock_sha256=[0-9a-f]{64}$' || {
            echo "❌ REVISION missing valid composer_lock_sha256"
            exit 1
          }
          echo "$content" | grep -qE '^deploy_script_sha256=[0-9a-f]{64}$' || {
            echo "❌ REVISION missing valid deploy_script_sha256"
            exit 1
          }
          expected_deploy="$(sha256sum scripts/deploy/remote-deploy.sh | awk '{print $1}')"
          echo "$content" | grep -qx "deploy_script_sha256=${expected_deploy}" || {
            echo "❌ REVISION deploy_script_sha256 must match scripts/deploy/remote-deploy.sh"
            exit 1
          }
          echo "$content" | grep -qE '^workflow_run=[0-9]+$' || {
            echo "❌ REVISION missing workflow_run"
            exit 1
          }
          echo "OK: artifact REVISION provenance looks valid"

      - name: Validate artifact contains NEW code
        run: |
          tar -tzf ${{ steps.package.outputs.artifact_path }} | grep "myeventlane_core/src/Commands/MelCoreCommands.php" || {
            echo "❌ Artifact missing NEW code"
            exit 1
          }

      - name: Validate artifact excludes nginx reference configs
        run: |
          set -euo pipefail
          archive_path="${{ steps.package.outputs.artifact_path }}"
          leaked=$(tar -tzf "$archive_path" | grep -E '(^|/)staging-nginx\.conf$|(^|/)infrastructure/' || true)
          if [ -n "$leaked" ]; then
            echo "❌ Artifact must not bundle nginx reference configs (staging-nginx.conf or infrastructure/)"
            echo "   Install includes on the VPS during provisioning — see infrastructure/README.md"
            echo "$leaked"
            exit 1
          fi
          echo "OK: nginx reference configs excluded from release artifact"

      - name: Validate artifact registers state_readiness_helper (staging Drush)
        run: |
          set -euo pipefail
          archive_path="${{ steps.package.outputs.artifact_path }}"
          # GNU tar stores paths as ./web/... when archiving "."; member must match exactly.
          member=$(tar -tzf "$archive_path" | grep -E '(^|/)myeventlane_core\.services\.yml$' | head -1)
          if [ -z "$member" ]; then
            echo "❌ Artifact missing myeventlane_core.services.yml (cannot validate state_readiness_helper)."
            exit 1
          fi
          if ! tar -xOzf "$archive_path" "$member" | grep -q 'myeventlane_surface.state_readiness_helper:'; then
            echo "❌ Artifact myeventlane_core.services.yml missing myeventlane_surface.state_readiness_helper"
            echo "   (remote deploy runs drush cr; without this service the container will not compile.)"
            exit 1
          fi
          echo "OK: state_readiness_helper present in packaged core services.yml ($member)"

      - name: Validate artifact registers followed organisers route (customer hub)
        run: |
          set -euo pipefail
          archive_path="${{ steps.package.outputs.artifact_path }}"
          member=$(tar -tzf "$archive_path" | grep -E '(^|/)myeventlane_account\.routing\.yml$' | head -1)
          if [ -z "$member" ]; then
            echo "❌ Artifact missing myeventlane_account.routing.yml (cannot validate followed_organisers route)."
            exit 1
          fi
          if ! tar -xOzf "$archive_path" "$member" | grep -q 'myeventlane_account\.followed_organisers:'; then
            echo "❌ Artifact myeventlane_account.routing.yml missing myeventlane_account.followed_organisers"
            echo "   (/my-organisers must ship with releases or staging returns 404.)"
            exit 1
          fi
          echo "OK: followed_organisers route present in packaged account routing.yml ($member)"

      - name: Diagnose deploy script before artifact upload
        run: |
          set -euo pipefail
          debug_marker="MEL REMOTE DEPLOY DEBUG BUILD"
          deploy_script="scripts/deploy/remote-deploy.sh"
          echo "===== ARTIFACT CONTENT CHECK ====="
          ls -la scripts/deploy/
          grep "$debug_marker" "$deploy_script" || true
          sha256sum "$deploy_script"
          find scripts -maxdepth 2 | sort

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
